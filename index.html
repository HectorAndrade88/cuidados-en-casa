<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ============================================================
       SEGURIDAD DE LA INFORMACIÓN (defensa en profundidad)
       - CSP: sin scripts externos. connect-src 'self' permite leer
         únicamente perfil.json del propio sitio: no hay ningún
         destino externo al que se puedan enviar datos.
       - object/frame/base/form-action bloqueados: sin incrustaciones
         ni envíos de formulario a terceros.
       - noindex: la página es pública en GitHub Pages, pero no debe
         aparecer en buscadores.
       ============================================================ -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#3a5bd0">
  <meta name="description" content="Cuida: seguimiento en casa de la medicación, los síntomas y el equipo de cuidado de una persona.">
  <title>Cuida · Seguimiento domiciliario</title>
  <style>
  /* ============================================================
     CUIDA · Hoja de estilos
     Organización:
       1. Tokens (variables) + temas (claro/oscuro/alto contraste/grande)
       2. Base y accesibilidad (foco, movimiento reducido)
       3. Layout (app, sidebar, contenido)
       4. Componentes (tarjetas, botones, píldoras, tablas, formularios)
       5. Diálogos y toasts
       6. Responsive (mobile-first con overrides)
     Todos los colores usan variables para poder tematizar.
     ============================================================ */

  /* 1. TOKENS ------------------------------------------------- */
  :root{
    --bg:#f4f6fb;
    --surface:#ffffff;
    --surface-2:#f8fafc;
    --ink:#16202e;         /* texto principal */
    --muted:#5a6478;       /* texto secundario · AA sobre superficie */
    --line:#e2e8f2;
    --primary:#3a5bd0;
    --primary-ink:#ffffff; /* texto sobre color primario */
    --primary-soft:#eaf0ff;
    --primary-soft-ink:#2b46b0;
    --good:#0f6f52; --good-bg:#e6f6ef;
    --warn:#92500a; --warn-bg:#fff3df;
    --bad:#b31f3f;  --bad-bg:#ffe9ee;
    --focus:#1746e0;
    --radius:14px;
    --shadow:0 8px 26px rgba(29,46,74,.08);
    /* Tipografía fluida: escala con el viewport dentro de límites */
    --fs-base:clamp(15px, 0.9rem + 0.2vw, 17px);
    --fs-h1:clamp(1.35rem, 1.1rem + 1.4vw, 1.75rem);
    --fs-h2:clamp(1.05rem, 0.98rem + 0.4vw, 1.2rem);
    --tap:44px; /* tamaño táctil mínimo (WCAG) */
  }
  /* Tema oscuro */
  body.dark{
    --bg:#0f1726; --surface:#172133; --surface-2:#1c2740;
    --ink:#e8eef8; --muted:#a9b7cd; --line:#2b3a54;
    --primary:#6f8cff; --primary-ink:#0b1120;
    --primary-soft:#26365f; --primary-soft-ink:#cdd9ff;
    --good:#4fd6a6; --good-bg:#123a30;
    --warn:#f2b24a; --warn-bg:#3a2c12;
    --bad:#ff8098;  --bad-bg:#3a1420;
    --focus:#9db4ff; --shadow:none;
  }
  /* Alto contraste (negro sobre blanco, bordes marcados) */
  body.high{
    --bg:#ffffff; --surface:#ffffff; --surface-2:#ffffff;
    --ink:#000000; --muted:#1a1a1a; --line:#000000;
    --primary:#0000c4; --primary-ink:#ffffff;
    --primary-soft:#dfe4ff; --primary-soft-ink:#0000a0;
    --good:#005c3c; --good-bg:#dff5ec;
    --warn:#7a3d00; --warn-bg:#fff0d6;
    --bad:#a5001f;  --bad-bg:#ffe0e6;
    --focus:#0000c4; --shadow:none;
  }
  /* Fuente y controles grandes */
  body.large{ --fs-base:19px; --tap:52px; }
  body.large .btn{ padding:14px 18px; }

  /* 2. BASE Y ACCESIBILIDAD ---------------------------------- */
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:var(--fs-base)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  button,input,select,textarea{ font:inherit; color:inherit; }
  h1,h2,h3{ line-height:1.2; }

  /* Foco visible y consistente para navegación por teclado */
  :focus-visible{ outline:3px solid var(--focus); outline-offset:2px; border-radius:6px; }
  /* Evita doble anillo en elementos sin foco por teclado */
  :focus:not(:focus-visible){ outline:none; }

  /* Enlace de salto al contenido principal */
  .skip{
    position:absolute; left:8px; top:-60px; z-index:50;
    background:var(--surface); color:var(--ink); padding:10px 14px;
    border:2px solid var(--focus); border-radius:8px; transition:top .15s;
  }
  .skip:focus{ top:8px; }

  /* Respeta a quien prefiere menos movimiento */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.001ms!important; transition-duration:.001ms!important; scroll-behavior:auto!important; }
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }

  /* 3. LAYOUT ------------------------------------------------- */
  .app{ min-height:100vh; display:grid; grid-template-columns:240px 1fr; }

  .side{
    background:linear-gradient(180deg,#1c2a4e,#111a30); color:#fff; padding:22px 14px;
    position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
  }
  body.dark .side{ background:linear-gradient(180deg,#101a30,#0a1120); }
  body.high .side{ background:#000; }
  .brand{ display:flex; align-items:center; gap:10px; font-size:1.4rem; font-weight:800; margin:0 8px 24px; }
  .brand i{
    width:38px; height:38px; border-radius:11px;
    background:linear-gradient(135deg,var(--primary),#6f8cff); box-shadow:0 6px 16px rgba(58,91,208,.45);
    color:#fff; display:grid; place-items:center; font-style:normal; font-size:1.1rem;
  }
  .nav a .ic svg{ display:block; }
  .nav{ display:flex; flex-direction:column; gap:4px; }
  .nav a{
    display:flex; align-items:center; gap:12px; min-height:var(--tap);
    padding:10px 14px; border-radius:10px; color:#cbd5e1;
    text-decoration:none; font-weight:600;
  }
  .nav a .ic{ width:22px; height:22px; display:grid; place-items:center; flex:none; }
  .nav a:hover{ background:rgba(255,255,255,.12); color:#fff; }
  .nav a[aria-current="page"]{ background:var(--primary); color:#fff; }
  body.high .nav a{ color:#fff; }
  body.high .nav a[aria-current="page"]{ background:#fff; color:#000; }
  .side-foot{ margin-top:auto; color:#9fb0cc; font-size:.8rem; padding:12px 8px 0; }

  .main{ min-width:0; display:flex; flex-direction:column; }
  .top{
    min-height:64px; padding:12px 28px; display:flex; align-items:center;
    justify-content:space-between; gap:16px;
    background:var(--surface); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:3;
  }
  .top .who{ font-weight:600; min-width:0; }
  /* Paciente en la barra superior: es un botón, pero se lee como texto */
  .linklike{
    background:none; border:0; padding:4px 0; margin:0; cursor:pointer;
    font:inherit; font-weight:600; color:var(--ink); text-align:left;
    text-decoration:underline; text-decoration-color:var(--line);
    text-underline-offset:4px; min-height:auto;
  }
  .linklike:hover{ text-decoration-color:var(--primary); }
  .linklike.warnlike{ color:var(--warn); }
  .clock{ color:var(--muted); font-size:.9rem; }
  .clock strong{ color:var(--ink); font-size:1.05rem; margin-left:6px; }
  .content{ padding:26px; max-width:1240px; width:100%; margin:0 auto; }
  .page{ animation:fade .2s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none;} }

  .title-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .title-row h1{ margin:0; font-size:var(--fs-h1); }
  .sub{ color:var(--muted); margin:6px 0 0; }
  .section-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin:30px 0 12px; flex-wrap:wrap; }
  .section-head h2{ margin:0; font-size:var(--fs-h2); }

  /* 4. COMPONENTES ------------------------------------------- */
  .grid{ display:grid; gap:16px; }
  .stats{ grid-template-columns:repeat(4,1fr); }
  .two{ grid-template-columns:1.3fr .7fr; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
  .card > b{ display:block; margin-bottom:6px; }

  .stat{ position:relative; }
  .stat .label{ color:var(--muted); font-size:.85rem; }
  .stat .n{ font-size:1.9rem; font-weight:700; margin-top:4px; }
  .stat .icon{ position:absolute; top:16px; right:16px; background:var(--primary-soft); color:var(--primary-soft-ink); padding:8px; border-radius:10px; width:38px; height:38px; display:grid; place-items:center; }

  .progress{ height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:12px; }
  .progress i{ display:block; height:100%; background:linear-gradient(90deg,var(--primary),#5aa9d6); border-radius:inherit; }

  .next{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  .med-icon{ width:58px; height:58px; border-radius:13px; object-fit:cover; background:var(--primary-soft); }

  /* Píldoras de estado (texto con contraste AA) */
  .pill{ display:inline-block; font-size:.78rem; padding:4px 10px; border-radius:99px; font-weight:700; background:var(--good-bg); color:var(--good); }
  .pill.warn{ background:var(--warn-bg); color:var(--warn); }
  .pill.bad{ background:var(--bad-bg); color:var(--bad); }

  /* Botones: enlaces navegan, botones actúan */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:var(--tap); padding:10px 15px; border:1px solid transparent; border-radius:10px;
    background:var(--primary); color:var(--primary-ink); font-weight:700; cursor:pointer; text-decoration:none;
  }
  .btn:hover{ filter:brightness(.95); }
  .btn.secondary{ background:var(--primary-soft); color:var(--primary-soft-ink); }
  .btn.danger{ background:var(--bad-bg); color:var(--bad); border-color:transparent; }
  /* Botón de WhatsApp: verde de marca oscurecido para cumplir contraste AA */
  .btn.wa{ background:#0b6b5f; color:#fff; }
  .btn.wa:hover{ filter:brightness(1.12); }
  body.high .btn.wa{ background:#00453c; border-color:#000; }
  .btn.small{ min-height:36px; padding:7px 11px; font-size:.85rem; }
  body.large .btn.small{ min-height:44px; }
  body.high .btn{ border-color:#000; }

  .list{ padding:0; margin:0; list-style:none; }
  .list li{ padding:13px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .list li:last-child{ border:0; }
  .muted{ color:var(--muted); }

  .agenda{ display:grid; gap:12px; }
  .agenda-card{ display:grid; grid-template-columns:66px 58px 1fr auto; align-items:center; gap:14px; }
  .time{ font-size:1.15rem; font-weight:800; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .status{ font-size:.82rem; color:var(--muted); margin-top:4px; }

  .alert{ border-left:4px solid var(--warn); background:var(--warn-bg); color:var(--ink); padding:11px 14px; border-radius:8px; margin:10px 0; }
  .alert.bad{ border-color:var(--bad); background:var(--bad-bg); }
  .notice{ padding:12px; border-radius:10px; background:var(--good-bg); color:var(--good); font-size:.9rem; margin-top:12px; }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .input{
    min-height:var(--tap); width:100%;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:10px 12px; border-radius:10px;
  }
  .input::placeholder{ color:var(--muted); opacity:1; }
  .search{ max-width:340px; }

  .table-wrap{ overflow-x:auto; }
  .table{ width:100%; border-collapse:collapse; font-size:.9rem; }
  .table caption{ text-align:left; color:var(--muted); padding:0 0 10px; }
  .table th{ text-align:left; color:var(--muted); font-weight:600; background:var(--surface-2); }
  .table th,.table td{ padding:12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .med-row{ display:flex; align-items:center; gap:10px; }
  .thumb{ width:40px; height:40px; border-radius:9px; object-fit:cover; background:var(--primary-soft); flex:none; }
  .empty{ text-align:center; padding:28px; color:var(--muted); }

  /* Formularios */
  .form{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .form label{ font-size:.85rem; font-weight:700; color:var(--muted); display:block; }
  .form label .req{ color:var(--bad); }
  .form .input,.form textarea,.form select{ margin-top:5px; }
  .form .full{ grid-column:1/-1; }
  .form textarea{ min-height:84px; resize:vertical; }
  .hint{ font-weight:500; color:var(--muted); font-size:.8rem; margin-top:4px; }
  /* Mensaje de error accesible por campo */
  .err{ color:var(--bad); font-size:.82rem; font-weight:600; margin-top:5px; min-height:0; }
  .input[aria-invalid="true"]{ border-color:var(--bad); outline-color:var(--bad); }

  .drop{ border:2px dashed var(--line); border-radius:12px; padding:16px; text-align:center; color:var(--muted); }
  .drop.over{ border-color:var(--primary); background:var(--primary-soft); }
  .photo-preview{ width:76px; height:76px; border-radius:12px; object-fit:cover; margin-top:10px; }

  .switch{ display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); padding:14px 0; min-height:var(--tap); }
  .switch:last-child{ border:0; }
  .switch input{ width:22px; height:22px; }
  .settings{ grid-template-columns:1fr; max-width:760px; }

  /* --- Cuidadores: avatares, chips y selección múltiple --- */
  .card.hover{ transition:transform .15s ease, box-shadow .15s ease; }
  .card.hover:hover{ transform:translateY(-2px); box-shadow:0 14px 34px rgba(29,46,74,.14); }
  .cargrid{ grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); }
  .avatar{
    width:46px; height:46px; border-radius:50%; flex:none; display:grid; place-items:center;
    font-weight:800; color:#fff; background:linear-gradient(135deg,var(--primary),#6f8cff);
  }
  .avatar.sm{ width:30px; height:30px; font-size:.72rem; }
  .car-head{ display:flex; align-items:center; gap:12px; }
  .car-meds{ margin-top:14px; }
  .car-line{ display:inline-flex; align-items:center; gap:9px; }
  /* Chips (medicamentos asignados) */
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:99px;
    background:var(--primary-soft); color:var(--primary-soft-ink); font-size:.78rem; font-weight:600;
  }
  .chip .dot,.check .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  /* Selección múltiple con casillas tipo chip */
  .checks{ border:0; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:8px; }
  .checks legend{ font-size:.85rem; font-weight:700; color:var(--muted); margin-bottom:6px; width:100%; padding:0; }
  .check{
    display:inline-flex; align-items:center; gap:8px; padding:8px 12px; min-height:var(--tap);
    border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--surface); font-weight:600;
  }
  .check input{ width:18px; height:18px; }
  .check:has(input:checked){ border-color:var(--primary); background:var(--primary-soft); color:var(--primary-soft-ink); }
  .check:focus-within{ outline:3px solid var(--focus); outline-offset:2px; }
  .chips.mini .chip{ font-size:.72rem; padding:3px 9px; }

  /* 5. DIÁLOGOS Y TOASTS ------------------------------------- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:40; background:rgba(15,23,42,.55);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .modal-backdrop[hidden]{ display:none; }
  .dialog{
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-radius:18px; padding:24px; width:min(760px,100%); max-height:92vh; overflow:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .dialog.sm{ width:min(440px,100%); }
  .dialog h2{ margin:0 0 16px; font-size:var(--fs-h2); }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; flex-wrap:wrap; }

  .toasts{ position:fixed; right:16px; bottom:16px; z-index:60; display:flex; flex-direction:column; gap:10px; max-width:min(360px,92vw); }
  .toast{
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-left:4px solid var(--primary); border-radius:10px; padding:12px 14px;
    box-shadow:var(--shadow); animation:fade .2s ease;
  }
  .toast.good{ border-left-color:var(--good); }
  .toast.bad{ border-left-color:var(--bad); }

  /* 6. RESPONSIVE -------------------------------------------- */
  /* Móvil/tablet: sidebar pasa a barra inferior fija con targets táctiles */
  @media (max-width:860px){
    .app{ display:block; }
    .side{
      position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; z-index:30;
      flex-direction:row; align-items:center; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
      border-top:1px solid var(--line);
    }
    .brand,.side-foot{ display:none; }
    .nav{ flex-direction:row; width:100%; justify-content:space-around; gap:2px; overflow-x:auto; }
    .nav a{ flex-direction:column; gap:3px; font-size:.68rem; padding:6px 4px; min-width:58px; flex:1 0 auto; justify-content:center; }
    .content{ padding:20px 15px; }
    .main{ padding-bottom:76px; } /* espacio para la barra inferior */
    .top{ padding:12px 16px; }
    .stats{ grid-template-columns:repeat(2,1fr); }
    .two{ grid-template-columns:1fr; }
    .agenda-card{ grid-template-columns:56px 46px 1fr; }
    .agenda-card .actions{ grid-column:1/-1; }
  }

  /* Tablas apiladas tipo tarjeta en pantallas pequeñas (mejor lectura móvil) */
  @media (max-width:560px){
    .stats{ grid-template-columns:1fr; }
    .form{ grid-template-columns:1fr; }
    .title-row .btn{ width:100%; }
    .table thead{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    .table, .table tbody, .table tr, .table td{ display:block; width:100%; }
    .table tr{ border:1px solid var(--line); border-radius:12px; margin-bottom:12px; padding:6px 12px; background:var(--surface); }
    .table td{ border:0; display:flex; justify-content:space-between; gap:12px; padding:8px 0; text-align:right; }
    .table td::before{ content:attr(data-label); font-weight:700; color:var(--muted); text-align:left; }
    .table td .med-row{ justify-content:flex-end; }
  }

  /* 7. SEGURIDAD: PANTALLA DE BLOQUEO ------------------------- */
  /* Al bloquear, la app se retira del render: los datos no quedan
     visibles ni siquiera desenfocados detrás de la capa. */
  .lock{
    position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:20px;
    background:linear-gradient(160deg,#16223d,#0d1424);
  }
  .lock[hidden]{ display:none; }
  body.locked .app,body.locked .toasts{ display:none; }
  .lock-box{
    width:min(410px,100%); background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:20px; padding:26px;
    box-shadow:0 26px 70px rgba(0,0,0,.5);
  }
  .lock-logo{
    width:54px; height:54px; border-radius:16px; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--primary),#6f8cff); color:#fff; font-size:1.5rem;
    margin-bottom:16px; box-shadow:0 8px 20px rgba(58,91,208,.4);
  }
  .lock-box h1{ margin:0 0 6px; font-size:1.3rem; }
  .pin{ letter-spacing:.5em; text-align:center; font-size:1.35rem; font-weight:700; }
  .lock-foot{ margin-top:18px; display:flex; flex-direction:column; gap:10px; }

  /* Indicadores de seguridad en Ajustes */
  .sec-state{ display:flex; align-items:center; gap:10px; margin:10px 0 4px; }
  .dot-state{ width:11px; height:11px; border-radius:50%; flex:none; background:var(--bad); }
  .dot-state.on{ background:var(--good); }
  .meter{ height:7px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:8px; }
  .meter i{ display:block; height:100%; width:0; background:var(--bad); transition:width .2s, background .2s; }
  .meter.mid i{ background:var(--warn); } .meter.ok i{ background:var(--good); }

  /* 8. FOTOS: PORTADA, GALERÍA, DETALLE Y VISOR --------------- */
  .hero{ display:grid; grid-template-columns:minmax(130px,180px) 1fr; gap:20px; align-items:center; }
  .hero-photo{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:16px;
    background:var(--primary-soft); cursor:zoom-in; border:1px solid var(--line);
  }
  .hero-name{ font-size:1.45rem; font-weight:800; line-height:1.2; }

  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button{
    background:var(--surface); color:var(--muted); border:0; cursor:pointer;
    min-height:var(--tap); padding:8px 16px; font-weight:700;
  }
  .seg button[aria-pressed="true"]{ background:var(--primary); color:var(--primary-ink); }

<script>
'use strict';
/* ============================================================
   CUIDA · Lógica de la aplicación
   Arquitectura por responsabilidades:
     - StorageManager : persistencia local + respaldo automático
     - Modelos        : Patient, Medication, Caregiver
     - Utilidades     : MedicationSchedule, Inventory
     - Managers       : Symptom, History, Notification, Image
     - UI helpers     : escapeHtml, toast, Modal (diálogo accesible),
                        confirmDialog, promptDialog
     - App            : controlador principal (render + acciones)
   ============================================================ */

/* --- Utilidad de seguridad: escapa texto para insertar en HTML --- */
function escapeHtml(v){
  return String(v ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

/* ------------------------------------------------------------
   Fechas en horario LOCAL (YYYY-MM-DD)
   No se usa toISOString(): en Colombia (UTC−5) devolvería el día
   siguiente a partir de las 7 de la tarde, y la agenda saltaría
   de día antes de tiempo.
   ------------------------------------------------------------ */
function isoDate(d = new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseISO(s){
  const [y, m, d] = String(s || '').split('-').map(Number);
  return new Date(y || 1970, (m || 1) - 1, d || 1);
}
function daysBetween(desde, hasta){
  return Math.round((parseISO(hasta) - parseISO(desde)) / 864e5);
}
function addDays(iso, n){
  const d = parseISO(iso);
  return isoDate(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n));
}
function prettyDate(iso){
  return parseISO(iso).toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'});
}

/* Imagen de reserva cuando un medicamento no tiene foto */
const SIN_FOTO = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><rect width="100%" height="100%" fill="#eaf0ff"/>' +
  '<path d="M58 66h64v58H58z" fill="none" stroke="#8fa6e6" stroke-width="6" rx="8"/>' +
  '<circle cx="78" cy="88" r="9" fill="#8fa6e6"/><path d="M60 118l26-24 20 18 14-12 22 22" fill="none" stroke="#8fa6e6" stroke-width="6"/></svg>');

/* --- Utilidad de seguridad: solo se admiten imágenes incrustadas ---
   Un respaldo manipulado podría traer un src con comillas o una URL
   externa. Se exige el formato data:image/... y se escapa siempre;
   cualquier otra cosa se sustituye por la imagen de reserva. */
function safeImage(src){
  return (typeof src === 'string' && /^data:image\/(png|jpeg|jpg|webp|gif|bmp|svg\+xml)[;,]/i.test(src))
    ? escapeHtml(src) : SIN_FOTO;
}

/* ============================================================
   SEGURIDAD · Base criptográfica (Web Crypto del navegador)
   Web Crypto solo existe en contexto seguro: https:// o localhost.
   Abriendo el archivo con doble clic (file://) NO está disponible;
   la app sigue funcionando pero se desactivan el PIN y el respaldo
   cifrado, y se avisa al usuario en Ajustes.
   ============================================================ */
const SECURE = !!(window.isSecureContext && window.crypto && window.crypto.subtle);

/* Identificador único (crypto.randomUUID tampoco existe en file://) */
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(b);
  else for(let i=0;i<16;i++) b[i] = Math.floor(Math.random()*256);
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

/* Base64 por bloques: evita desbordar la pila con fotos grandes */
const B64 = {
  from(buf){
    const b = new Uint8Array(buf); let s = '';
    for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000));
    return btoa(s);
  },
  to(str){ return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }
};

/* ------------------------------------------------------------
   Vault · Cifrado del archivo de respaldo
   AES-GCM 256 (confidencialidad + autenticidad) con clave derivada
   de la contraseña mediante PBKDF2-SHA256 y sal aleatoria.
   Sal e IV se generan nuevos en cada exportación.
   ------------------------------------------------------------ */
class Vault{
  /* 600 000 iteraciones: recomendación OWASP vigente para PBKDF2-SHA256.
     Importa especialmente aquí, porque el perfil cifrado se publica en un
     repositorio público y cualquiera puede intentar romperlo sin conexión. */
  static ITERATIONS = 600000;

  static async derive(pass, salt, iterations, usages){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, usages);
  }
  /* Deriva la clave a partir de la contraseña y la sal de un sobre ya
     existente. Se hace UNA vez por sesión: repetir 600 000 iteraciones
     en cada guardado dejaría la aplicación inutilizable en el móvil. */
  static keyFor(sobre, pass, usos = ['encrypt','decrypt']){
    return this.derive(pass, B64.to(sobre.salt), sobre.iterations || this.ITERATIONS, usos);
  }

  /* Cierra el sobre con una clave ya derivada (solo AES: instantáneo) */
  static async sealWith(key, obj, salt, iterations){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key,
                 new TextEncoder().encode(JSON.stringify(obj)));
    return {
      format:'cuida-backup', version:2, app:'Cuida',
      cipher:'AES-GCM-256', kdf:'PBKDF2-SHA256', iterations,
      salt:B64.from(salt), iv:B64.from(iv), data:B64.from(ct),
      createdAt:new Date().toISOString()
    };
  }
  static async openWith(key, sobre){
    const out = await crypto.subtle.decrypt({name:'AES-GCM', iv:B64.to(sobre.iv)}, key, B64.to(sobre.data));
    return JSON.parse(new TextDecoder().decode(out));
  }

  static async encrypt(obj, pass){
    if(!SECURE) throw new Error('Cifrado no disponible en este contexto.');
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key  = await this.derive(pass, salt, this.ITERATIONS, ['encrypt']);
    return this.sealWith(key, obj, salt, this.ITERATIONS);
  }
  static async decrypt(file, pass){
    return this.openWith(await this.keyFor(file, pass, ['decrypt']), file);
  }
  static isEncrypted(o){ return !!(o && o.format === 'cuida-backup' && o.data && o.salt && o.iv); }
}

/* ------------------------------------------------------------
   Profile · Perfil cifrado publicado en el repositorio
   Los datos viajan como «perfil.json»: el mismo sobre AES-GCM que
   el respaldo. El navegador lo descarga del propio sitio y lo
   descifra con la clave de acceso. Consecuencias, sin rodeos:
     · Sin la clave no se muestra absolutamente nada, en cualquier
       navegador y dispositivo: el descifrado ES la puerta.
     · El archivo es público, así que alguien puede descargarlo e
       intentar romperlo sin conexión. La clave debe ser larga.
     · No hay servidor: publicar cambios significa reemplazar el
       archivo en el repositorio y subirlo.
   ------------------------------------------------------------ */
class Profile{
  static FILE  = 'perfil.json';
  static CACHE = 'cuida-cache-cifrada';
  static AUTOLOCK = 'cuida-autobloqueo';

  /* Perfil publicado en el sitio; null si aún no se ha publicado ninguno */
  static async published(){
    if(typeof fetch !== 'function') return null;
    try{
      const r = await fetch(this.FILE + '?v=' + Date.now(), {cache:'no-store'});
      if(!r.ok) return null;
      const j = await r.json();
      return Vault.isEncrypted(j) ? j : null;
    }catch{ return null; }   // sin perfil, sin red o abierto como archivo local
  }

  /* Copia local, también cifrada: permite recargar sin perder cambios */
  static cache(){
    try{
      const j = JSON.parse(localStorage.getItem(this.CACHE));
      return Vault.isEncrypted(j) ? j : null;
    }catch{ return null; }
  }
  static saveCache(sobre){
    try{ localStorage.setItem(this.CACHE, JSON.stringify(sobre)); return true; }
    catch{ return false; }
  }
  static clearCache(){ localStorage.removeItem(this.CACHE); }
  static when(o){ return o && o.createdAt ? new Date(o.createdAt).getTime() : 0; }
}

/* ------------------------------------------------------------
   PinLock · Bloqueo de pantalla
   El PIN NO se guarda: se guarda su derivación PBKDF2 con sal.
   Comparación en tiempo constante y retardo progresivo por fallos.
   Nota: protege el acceso visual, no cifra los datos guardados.
   ------------------------------------------------------------ */
class PinLock{
  constructor(){ this.key='cuida-pin'; this.kFails='cuida-pin-fallos'; this.kLast='cuida-pin-ultimo'; }
  config(){ try{ return JSON.parse(localStorage.getItem(this.key)); }catch{ return null; } }
  enabled(){ return !!this.config(); }

  async digest(pin, salt, iterations){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations, hash:'SHA-256'}, base, 256);
    return B64.from(bits);
  }
  async set(pin){
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iterations = Vault.ITERATIONS;
    localStorage.setItem(this.key, JSON.stringify({
      salt:B64.from(salt), iterations,
      hash: await this.digest(pin, salt, iterations),
      createdAt: new Date().toISOString()
    }));
    this.resetFails();
  }
  clear(){ localStorage.removeItem(this.key); this.resetFails(); }
  async verify(pin){
    const c = this.config(); if(!c) return true;
    return this.equalTime(await this.digest(pin, B64.to(c.salt), c.iterations), c.hash);
  }
  /* Comparación sin fugas de tiempo */
  equalTime(a, b){
    if(a.length !== b.length) return false;
    let d = 0; for(let i=0;i<a.length;i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return d === 0;
  }
  fails(){ return +(localStorage.getItem(this.kFails) || 0); }
  addFail(){
    const n = this.fails() + 1;
    localStorage.setItem(this.kFails, n); localStorage.setItem(this.kLast, Date.now());
    return n;
  }
  resetFails(){ localStorage.removeItem(this.kFails); localStorage.removeItem(this.kLast); }
  /* Espera obligatoria tras 3 fallos: 5 s, 15 s, 45 s… hasta 5 min */
  waitMs(){
    const n = this.fails(); if(n < 3) return 0;
    const espera = Math.min(5000 * Math.pow(3, n - 3), 300000);
    return Math.max(0, espera - (Date.now() - (+localStorage.getItem(this.kLast) || 0)));
  }
}

/* ------------------------------------------------------------
   ImageTools · Fotos de medicamentos
   Valida el tipo, limita el tamaño y REDIBUJA la imagen en un
   canvas. El redibujado cumple dos funciones:
     1. Reduce el peso (clave: no hay base de datos externa).
     2. Elimina metadatos EXIF/GPS y cualquier carga incrustada
        en el archivo original.
   Los SVG se rechazan: pueden contener scripts.
   ------------------------------------------------------------ */
class ImageTools{
  static MAX_INPUT = 8 * 1024 * 1024;  // 8 MB de entrada
  static MAX_SIDE  = 720;              // lado mayor tras redimensionar
  static QUALITY   = 0.78;
  static ALLOWED   = ['image/png','image/jpeg','image/webp','image/gif','image/bmp'];

  static async fromFile(file){
    if(!file) throw new Error('No se seleccionó ninguna imagen.');
    if(!this.ALLOWED.includes(file.type))
      throw new Error('Formato no admitido. Usa JPG, PNG, WEBP, GIF o BMP (los SVG se rechazan por seguridad).');
    if(file.size > this.MAX_INPUT)
      throw new Error('La imagen supera los 8 MB. Elige una más ligera.');
    return this.normalize(await this.decode(file));
  }
  static decode(file){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload  = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('El archivo no es una imagen válida.')); };
      img.src = url;
    });
  }
  static normalize(img){
    const escala = Math.min(1, this.MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth  * escala));
    const h = Math.max(1, Math.round(img.naturalHeight * escala));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); // fondo para PNG transparente
    ctx.drawImage(img, 0, 0, w, h);
    return { dataUrl:c.toDataURL('image/jpeg', this.QUALITY), width:w, height:h };
  }
  static bytes(d){ return d ? Math.round((d.length - d.indexOf(',') - 1) * 3 / 4) : 0; }
  static kb(d){ return Math.max(1, Math.round(this.bytes(d) / 1024)); }
}

/* ------------------------------------------------------------
   Phone · Celulares y avisos por WhatsApp
   Se usa el enlace oficial «clic para chatear» (wa.me): no hay
   API, ni token, ni credenciales, ni servidor intermediario.
   El enlace abre WhatsApp con el mensaje ya escrito y es la
   persona quien pulsa enviar, así que nada sale del dispositivo
   sin una acción explícita.
   ------------------------------------------------------------ */
class Phone{
  static PAIS = '57';                                  // Colombia por defecto
  static digits(v){ return String(v ?? '').replace(/\D/g, ''); }

  /* Formato internacional sin signos, como exige wa.me (E.164 sin «+») */
  static intl(v){
    let d = this.digits(v);
    if(!d) return '';
    if(d.startsWith('00')) d = d.slice(2);             // 0057 300…
    if(d.length === 10 && d.startsWith('3')) d = this.PAIS + d;  // celular colombiano
    return d;
  }
  static valid(v){ const d = this.intl(v); return d.length >= 8 && d.length <= 15; }
  static pretty(v){ const d = this.intl(v); return d ? '+' + d : ''; }

  /* Enlace de WhatsApp con el mensaje precargado */
  static waLink(numero, texto){
    return 'https://wa.me/' + this.intl(numero) + '?text=' + encodeURIComponent(texto || '');
  }
}

/* ------------------------------------------------------------
   StorageManager · Persistencia local y respaldo automático
   Tres niveles, todos dentro del navegador (sin servidor):
     1. Estado actual.
     2. Copia completa del estado inmediatamente anterior.
     3. Hasta 5 copias diarias ligeras (sin fotos, ~10 % del peso)
        para poder recuperar el historial si se agota la cuota.
   ------------------------------------------------------------ */
class StorageManager{
  constructor(){
    this.key  = 'cuida-datos-v1';
    this.keyAntigua = 'cuida-paliativos-v1';   // nombre anterior, se migra al vuelo
    this.prev = 'cuida-copia-previa';
    this.snapKey = 'cuida-copias';
    this.maxSnaps = 5;
  }
  load(){
    try{
      const actual = localStorage.getItem(this.key);
      if(actual) return JSON.parse(actual);
      // Datos guardados con el nombre anterior: se recuperan y se reubican
      const viejo = localStorage.getItem(this.keyAntigua);
      if(!viejo) return null;
      localStorage.setItem(this.key, viejo);
      localStorage.removeItem(this.keyAntigua);
      return JSON.parse(viejo);
    }catch{ return null; }
  }
  previous(){ try{ return JSON.parse(localStorage.getItem(this.prev)); }catch{ return null; } }
  snapshots(){ try{ return JSON.parse(localStorage.getItem(this.snapKey)) || []; }catch{ return []; } }
  /* Borra todo rastro legible: se usa al pasar al perfil cifrado */
  wipePlain(){ [this.key, this.prev, this.snapKey].forEach(k => localStorage.removeItem(k)); }

  save(data){
    let json;
    try{ json = JSON.stringify(data); }catch{ return {ok:false, error:'serializar'}; }
    const anterior = localStorage.getItem(this.key);
    try{
      if(anterior) localStorage.setItem(this.prev, anterior);
      localStorage.setItem(this.key, json);
      this.snapshot(data);
      return {ok:true, bytes:json.length};
    }catch{
      // Cuota agotada: libera las copias y conserva lo esencial
      try{
        localStorage.removeItem(this.snapKey);
        localStorage.removeItem(this.prev);
        localStorage.setItem(this.key, json);
        return {ok:true, bytes:json.length, warning:'copias-liberadas'};
      }catch{
        return {ok:false, error:'cuota'};
      }
    }
  }
  /* Copia diaria: se renueva como mucho una vez por hora */
  snapshot(data){
    const hoy = isoDate();
    const list = this.snapshots();
    const i = list.findIndex(s => s.day === hoy);
    if(i === 0 && Date.now() - new Date(list[0].at).getTime() < 3600000) return;
    if(i >= 0) list.splice(i, 1);
    const ligero = { ...data, medications:(data.medications || []).map(m => ({...m, photo:''})) };
    list.unshift({ day:hoy, at:new Date().toISOString(), data:JSON.stringify(ligero) });
    localStorage.setItem(this.snapKey, JSON.stringify(list.slice(0, this.maxSnaps)));
  }
  /* Espacio ocupado por la app en este navegador (aprox.) */
  usedBytes(){
    let n = 0;
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('cuida')) n += k.length + (localStorage.getItem(k) || '').length;
    }
    return n * 2; // UTF-16
  }
}

/* --- Modelos de dominio --- */
/* Un único paciente: es el centro de toda la aplicación.
   Sin datos inventados: se rellena en Ajustes al empezar. */
class Patient{
  constructor(o={}){ Object.assign(this,{name:'', age:'', diagnosis:''}, o); }
  get registrado(){ return !!String(this.name || '').trim(); }
  get resumen(){
    return [this.name, this.age ? `${this.age} años` : '', this.diagnosis]
      .filter(x => String(x || '').trim()).join(' · ');
  }
}
class Medication{
  constructor(o={}){ Object.assign(this,{
    id:uuid(), name:'', activeIngredient:'', dose:'', unit:'mg',
    presentation:'Comprimido', route:'Oral', times:[], indication:'', notes:'',
    color:'#3a5bd0', active:true, stock:0, minStock:5, expiry:'', photo:'', lab:'', nationalCode:'',
    /* --- Pauta: no todos los tratamientos son diarios, ni programados --- */
    pattern:'diaria',   // 'diaria' | 'cada' | 'semana' | 'demanda' (sin horario)
    everyDays:2,        // intervalo para la pauta 'cada'
    weekdays:[],        // 0 = domingo … 6 = sábado, para la pauta 'semana'
    startDate:'',       // ancla del ciclo: desde aquí se cuentan los intervalos
    endDate:''          // fin del tratamiento (opcional)
  }, o);
    if(!Array.isArray(this.times)) this.times = [];
    if(!Array.isArray(this.weekdays)) this.weekdays = [];
    if(!['diaria','cada','semana','demanda'].includes(this.pattern)) this.pattern = 'diaria';
    if(this.pattern === 'demanda'){                   // sin horario ni fechas
      this.times = []; this.startDate = ''; this.endDate = '';
    }else if(!this.startDate){
      this.startDate = isoDate();
    }
    this.everyDays = Math.min(60, Math.max(1, +this.everyDays || 1));
  }
}
/* Cuidador/a: puede tener asignados VARIOS medicamentos (medIds) */
class Caregiver{
  constructor(o={}){ Object.assign(this,{
    id:uuid(), name:'', role:'Familiar', phone:'', medIds:[], notes:''
  }, o); if(!Array.isArray(this.medIds)) this.medIds=[]; }
}

/* --- Utilidades de negocio --- */
/* ------------------------------------------------------------
   MedicationSchedule · Qué toca y qué día
   Resuelve las tres pautas habituales en domicilio:
     · diaria  → todos los días
     · cada N  → «cada tres días», contando desde la fecha de inicio
     · semana  → días fijos (lunes, miércoles y viernes)
   Con inicio de pauta y fin de tratamiento opcionales.
   ------------------------------------------------------------ */
class MedicationSchedule{
  static DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  /* ¿Le corresponde a este medicamento en esta fecha? */
  static appliesOn(m, fecha = isoDate()){
    if(!m || !m.active) return false;
    if(m.pattern === 'demanda') return false;              // no se programa nunca
    if(m.startDate && fecha < m.startDate) return false;   // aún no empieza
    if(m.endDate   && fecha > m.endDate)   return false;   // ya terminó
    if(m.pattern === 'semana')
      return (m.weekdays || []).includes(parseISO(fecha).getDay());
    if(m.pattern === 'cada'){
      const n = Math.max(1, +m.everyDays || 1);
      const dif = daysBetween(m.startDate || fecha, fecha);
      return dif >= 0 && dif % n === 0;
    }
    return true;   // diaria
  }

  static forDate(meds, fecha = isoDate()){
    return (meds || []).filter(m => this.appliesOn(m, fecha))
      .flatMap(m => m.times.map(time => ({
        id:uuid(), medId:m.id, time, status:'pending', actual:'', responsible:'', note:'' })))
      .sort((a,b) => a.time.localeCompare(b.time));
  }
  static today(meds){ return this.forDate(meds, isoDate()); }

  /* Conserva lo ya registrado al recalcular la agenda tras editar un medicamento */
  static merge(anterior, nueva){
    return nueva.map(n =>
      (anterior || []).find(a => a.medId === n.medId && a.time === n.time) || n);
  }

  /* Próxima fecha en la que toca, buscando hacia delante */
  static nextDate(m, desde = isoDate(), limite = 400){
    for(let i = 0; i <= limite; i++){
      const f = addDays(desde, i);
      if(m.endDate && f > m.endDate) return null;
      if(this.appliesOn(m, f)) return f;
    }
    return null;
  }

  /* Descripción legible de la pauta */
  static describe(m){
    if(m.pattern === 'demanda') return 'Según necesidad · sin horario fijo';
    let t = 'Todos los días';
    if(m.pattern === 'cada'){
      const n = Math.max(1, +m.everyDays || 1);
      t = n === 1 ? 'Todos los días' : n === 2 ? 'Un día sí y otro no' : `Cada ${n} días`;
    }else if(m.pattern === 'semana'){
      const l = [...(m.weekdays || [])].sort((a,b)=>a-b).map(i => this.DIAS[i]);
      t = !l.length ? 'Sin días seleccionados'
        : l.length === 1 ? `Los ${l[0]}s`
        : `Los ${l.slice(0,-1).join(', ')} y ${l.at(-1)}`;
    }
    if(m.endDate) t += ` · hasta el ${m.endDate}`;
    return t;
  }

  /* Dosis medias por día: necesario para saber cuánto dura el inventario */
  static dosesPerDay(m){
    if(m.pattern === 'demanda') return 0;   // consumo imprevisible
    const n = (m.times || []).length;
    if(!n) return 0;
    if(m.pattern === 'cada')  return n / Math.max(1, +m.everyDays || 1);
    if(m.pattern === 'semana') return n * ((m.weekdays || []).length) / 7;
    return n;
  }
  static onDemand(m){ return !!m && m.pattern === 'demanda'; }
}
class Inventory{
  /* Días de tratamiento que cubre el stock, según la pauta real.
     Devuelve null cuando no hay consumo previsible (según necesidad
     o sin horarios): inventarse una cifra sería engañoso. */
  static days(m){
    const porDia = MedicationSchedule.dosesPerDay(m);
    return porDia ? Math.floor(m.stock / porDia) : null;
  }
  static daysText(m){
    const d = this.days(m);
    return d === null ? 'sin consumo previsible' : `${d} días`;
  }
  static level(m){ return m.stock<=m.minStock ? 'low' : 'ok'; }
}

/* ============================================================
   UI: Toasts (avisos no bloqueantes con aria-live)
   ============================================================ */
function toast(message, type='info', ms=4000){
  const host = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='good' ? ' good' : type==='bad' ? ' bad' : '');
  el.setAttribute('role', type==='bad' ? 'alert' : 'status');
  el.textContent = message;
  host.appendChild(el);
  setTimeout(()=>el.remove(), ms);
}

/* ============================================================
   UI: Modal accesible (aria-modal, foco atrapado, Escape,
       devuelve el foco al abridor). Reemplaza a los modales
       antiguos y a prompt()/alert()/confirm().
   ============================================================ */
const Modal = {
  host: null, dialog: null, lastFocus: null, onKey: null,
  init(){ this.host = document.getElementById('modalHost'); this.dialog = document.getElementById('dialog'); },
  open(html, {onOpen}={}){
    this.lastFocus = document.activeElement;
    this.dialog.innerHTML = html;
    this.host.hidden = false;
    // Cerrar al pulsar fondo o cualquier botón [data-close]
    this.host.onclick = e => { if(e.target === this.host || e.target.closest('[data-close]')) this.close(); };
    // Gestión de teclado: Escape cierra, Tab queda atrapado dentro
    this.onKey = e => {
      if(e.key === 'Escape'){ e.preventDefault(); this.close(); return; }
      if(e.key === 'Tab') this.trap(e);
    };
    document.addEventListener('keydown', this.onKey, true);
    if(onOpen) onOpen(this.dialog);
    // Foco inicial: primer campo o botón útil
    const first = this.dialog.querySelector('input,select,textarea,button:not([data-close])') || this.dialog.querySelector('button');
    (first || this.dialog).focus();
  },
  trap(e){
    const f = [...this.dialog.querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])')]
      .filter(el => !el.disabled && el.offsetParent !== null);
    if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  },
  close(){
    this.host.hidden = true;
    this.dialog.innerHTML = '';
    document.removeEventListener('keydown', this.onKey, true);
    if(this.lastFocus && this.lastFocus.focus) this.lastFocus.focus();
  }
};

/* Confirmación accesible → Promise<boolean> (reemplaza confirm) */
function confirmDialog({title='Confirmar', message='', confirmText='Aceptar', cancelText='Cancelar', danger=false}={}){
  return new Promise(resolve => {
    Modal.open(`
      <div class="dialog-inner">
        <h2 id="dialogTitle">${escapeHtml(title)}</h2>
        <p>${escapeHtml(message)}</p>
        <div class="modal-foot">
          <button class="btn secondary" data-close type="button">${escapeHtml(cancelText)}</button>
          <button class="btn ${danger?'danger':''}" id="cfmOk" type="button">${escapeHtml(confirmText)}</button>
        </div>
      </div>`, { onOpen(){ document.querySelector('#dialog').classList.add('sm'); } });
    document.querySelector('#dialog').classList.add('sm');
    const cleanup = v => { Modal.close(); document.querySelector('#dialog')?.classList.remove('sm'); resolve(v); };
    document.getElementById('cfmOk').onclick = ()=>cleanup(true);
    Modal.host.addEventListener('click', function h(e){ if(e.target===Modal.host||e.target.closest('[data-close]')){ Modal.host.removeEventListener('click',h); resolve(false); } });
  });
}

/* Entrada de un dato accesible → Promise<string|null> (reemplaza prompt).
   Soporta type (text/time/number/textarea), valor por defecto y validación. */
function promptDialog({title='', label='', value='', type='text', placeholder='', required=true, validate}={}){
  return new Promise(resolve => {
    const field = type==='textarea'
      ? `<textarea class="input" id="pd" ${required?'required':''} placeholder="${escapeHtml(placeholder)}">${escapeHtml(value)}</textarea>`
      : `<input class="input" id="pd" type="${type}" value="${escapeHtml(value)}" ${required?'required':''} placeholder="${escapeHtml(placeholder)}">`;
    Modal.open(`
      <h2 id="dialogTitle">${escapeHtml(title)}</h2>
      <form id="pdForm" novalidate>
        <label for="pd">${escapeHtml(label)}</label>
        ${field}
        <p class="err" id="pdErr" role="alert" aria-live="assertive"></p>
      </form>
      <div class="modal-foot">
        <button class="btn secondary" data-close type="button">Cancelar</button>
        <button class="btn" id="pdOk" type="submit" form="pdForm">Aceptar</button>
      </div>`, { onOpen(){ document.querySelector('#dialog').classList.add('sm'); } });
    const done = v => { document.querySelector('#dialog')?.classList.remove('sm'); Modal.close(); resolve(v); };
    const submit = e => {
      e.preventDefault();
      const el = document.getElementById('pd'), v = el.value.trim(), err = document.getElementById('pdErr');
      let msg = '';
      if(required && !v) msg = 'Este campo es obligatorio.';
      else if(validate) msg = validate(v) || '';
      if(msg){ el.setAttribute('aria-invalid','true'); err.textContent = msg; el.focus(); return; }
      done(v);
    };
    document.getElementById('pdForm').onsubmit = submit;
    // Cancelar por fondo/Escape resuelve null
    Modal.host.addEventListener('click', function h(e){ if(e.target===Modal.host||e.target.closest('[data-close]')){ Modal.host.removeEventListener('click',h); document.querySelector('#dialog')?.classList.remove('sm'); resolve(null); } });
  });
}

/* Expresión para validar horas HH:MM (00:00–23:59) */
const RE_TIME = /^([01]\d|2[0-3]):[0-5]\d$/;

/* ============================================================
   Controlador principal
   ============================================================ */
class App{
  constructor(){
    Modal.init();
    this.store  = new StorageManager();
    this.notify = new NotificationManager();
    this.pin    = new PinLock();
    this.locked = false;
    this.mode   = 'local';   // 'local' = solo este navegador · 'perfil' = perfil cifrado publicado
    this.pass   = null;      // clave de acceso: solo en memoria, nunca se guarda
    this.page   = 'dashboard';
    // Reloj, cambio de día y refresco del panel cada 30 s
    setInterval(() => {
      this.updateClock();
      if(this.state && this.syncAgenda()){
        this.save(); this.render();
        toast('Comenzó un nuevo día: la agenda se actualizó con lo que toca hoy.', 'good', 7000);
      }else{
        this.renderIfDashboard();
      }
    }, 30000);
    this.updateClock();
    // Importación de respaldo
    document.getElementById('importFile').onchange = e => this.handleImport(e);
  }

  /* ============================================================
     ARRANQUE
     Si el sitio tiene un perfil publicado —o este navegador guarda
     una copia cifrada— no se carga ni se pinta NADA hasta que la
     clave de acceso descifre los datos.
     ============================================================ */
  async start(){
    this.published = await Profile.published();
    if(this.published || Profile.cache()){
      this.mode = 'perfil';
      this.initLock();
      this.gate();
      return;
    }
    this.bootLocal();
  }

  /* Modo local: los datos viven solo en este navegador (comportamiento previo) */
  bootLocal(){
    this.mode  = 'local';
    this.state = this.store.load() || this.seed();
    this.migrate();
    this.save();
    this.buildNav();
    this.render();
    this.initLock();
    if(this.pin.enabled()) this.lock(true);
    this.backupReminder();
  }

  /* Compatibilidad con datos y respaldos de versiones anteriores */
  migrate(){
    this.state.patient    = new Patient(this.state.patient);
    this.state.caregivers = (this.state.caregivers || []).map(c => new Caregiver(c));
    this.state.medications = (this.state.medications || []).map(m => new Medication(m));
    this.state.symptoms = this.state.symptoms || [];
    this.state.rescues  = this.state.rescues  || [];
    this.state.history  = this.state.history  || [];
    this.state.agenda   = this.state.agenda   || [];
    this.state.settings = Object.assign(
      { dark:false, large:false, high:false, sound:false, notifications:false,
        autolock:5, medView:'tabla', lastBackup:'', whatsapp:true },
      this.state.settings || {});
    this.syncAgenda();
  }

  /* La agenda pertenece a un día concreto. Si se abre la aplicación otro
     día —o cambia la fecha con ella abierta— se recrea con lo que toca. */
  syncAgenda(){
    const hoy = isoDate();
    if(this.state.agendaDate === hoy) return false;
    this.state.agendaDate = hoy;
    this.state.agenda = MedicationSchedule.today(this.state.medications);
    return true;
  }

  /* ============================================================
     PUERTA DE ENTRADA Y BLOQUEO
     En modo «perfil» el descifrado ES la puerta: mientras no se
     introduzca la clave correcta no hay datos en memoria, así que
     no hay nada que mostrar en ninguna pantalla.
     En modo «local» el PIN protege el acceso visual en el equipo.
     ============================================================ */
  initLock(){
    this.lockEl = document.getElementById('lock');
    document.getElementById('lockForm').onsubmit = e => { e.preventDefault(); this.tryUnlock(); };
    // Actividad del usuario para el autobloqueo
    ['pointerdown','keydown','touchstart','wheel'].forEach(ev =>
      document.addEventListener(ev, () => this.touch(), {passive:true}));
    setInterval(() => this.checkIdle(), 15000);
    this.touch();
  }
  touch(){ this.lastActivity = Date.now(); }

  /* Minutos de inactividad; en modo perfil el ajuste se guarda aparte,
     porque al bloquear se descarta todo el estado descifrado. */
  autolockMinutes(){
    if(this.state && this.state.settings) return +this.state.settings.autolock || 0;
    return +(localStorage.getItem(Profile.AUTOLOCK) ?? 5);
  }
  checkIdle(){
    const min = this.autolockMinutes();
    if(!min || this.locked) return;
    if(this.mode === 'local' && !this.pin.enabled()) return;
    if(Date.now() - this.lastActivity > min * 60000){
      this.lock();
      toast('Bloqueada por inactividad.');
    }
  }

  lock(silencioso){
    if(this.mode === 'perfil'){
      // Se borra de memoria la clave y los datos descifrados
      this.pass = null; this.cacheKey = null; this.state = null;
      this.gate();
      if(!silencioso) this.announce('Aplicación bloqueada.');
      return;
    }
    if(!this.pin.enabled()) return;
    this.locked = true;
    document.body.classList.add('locked');
    this.lockEl.hidden = false;
    this.renderLockBox();
    if(!silencioso) this.announce('Aplicación bloqueada.');
  }
  renderLockBox(){
    const box = this.lockEl.querySelector('.lock-box');
    box.innerHTML = `
      <div class="lock-logo" aria-hidden="true">✚</div>
      <h1 id="lockTitle">Aplicación bloqueada</h1>
      <p class="muted">Introduce el PIN para ver la información.</p>
      <form id="lockForm" novalidate>
        <label class="sr-only" for="lockPin">PIN de acceso</label>
        <input class="input pin" id="lockPin" type="password" inputmode="numeric"
               autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="12" placeholder="••••">
        <p class="err" id="lockErr" role="alert" aria-live="assertive"></p>
        <div class="lock-foot">
          <button class="btn" type="submit" id="lockBtn">Desbloquear</button>
          <button class="btn secondary" type="button" data-forgot>He olvidado el PIN</button>
        </div>
      </form>`;
    document.getElementById('lockForm').onsubmit = e => { e.preventDefault(); this.tryUnlock(); };
    box.querySelector('[data-forgot]').onclick = () => this.forgotPin();
    setTimeout(() => document.getElementById('lockPin')?.focus(), 60);
  }

  /* --- Puerta del perfil cifrado --- */
  gate(mensaje){
    this.locked = true;
    document.body.classList.add('locked');
    this.lockEl = document.getElementById('lock');
    this.lockEl.hidden = false;
    const box = this.lockEl.querySelector('.lock-box');
    box.innerHTML = `
      <div class="lock-logo" aria-hidden="true">✚</div>
      <h1 id="lockTitle">Cuida</h1>
      <p class="muted">Introduce la clave de acceso para descifrar la información.</p>
      ${SECURE ? '' : `<div class="alert bad"><b>No se puede descifrar aquí</b><br>
        <small>Has abierto el archivo directamente. El descifrado necesita https:// o localhost.
        Abre el sitio publicado en lugar del archivo.</small></div>`}
      <form id="gateForm" novalidate>
        <label class="sr-only" for="gatePass">Clave de acceso</label>
        <input class="input" id="gatePass" type="password" autocomplete="current-password"
               autocapitalize="off" spellcheck="false" placeholder="Clave de acceso" ${SECURE?'':'disabled'}>
        <p class="err" id="gateErr" role="alert" aria-live="assertive">${escapeHtml(mensaje || '')}</p>
        <div class="lock-foot">
          <button class="btn" type="submit" id="gateBtn" ${SECURE?'':'disabled'}>Entrar</button>
        </div>
      </form>
      <p class="muted" style="font-size:.8rem;margin-top:16px">
        Los datos están cifrados con AES-GCM. Sin la clave no se descifran ni se muestran,
        en ningún navegador ni dispositivo.</p>`;
    document.getElementById('gateForm').onsubmit = e => { e.preventDefault(); this.tryGate(); };
    setTimeout(() => document.getElementById('gatePass')?.focus(), 60);
  }

  async tryGate(){
    const inp = document.getElementById('gatePass'),
          err = document.getElementById('gateErr'),
          btn = document.getElementById('gateBtn');
    const espera = this.pin.waitMs();
    if(espera > 0){ err.textContent = `Demasiados intentos. Espera ${Math.ceil(espera/1000)} s.`; return; }
    if(!inp.value){ err.textContent = 'Introduce la clave de acceso.'; return; }

    btn.disabled = true; err.textContent = 'Descifrando…';
    const ok = await this.openProfile(inp.value);
    btn.disabled = false;
    if(ok){ this.pin.resetFails(); return; }

    const n = this.pin.addFail();
    inp.value = ''; inp.focus();
    err.textContent = n >= 3
      ? `Clave incorrecta. Espera ${Math.ceil(this.pin.waitMs()/1000)} s antes de reintentar.`
      : `Clave incorrecta. Intento ${n} de 3.`;
  }

  /* Prueba la clave contra la copia local y contra el perfil publicado */
  async openProfile(clave){
    const cache = Profile.cache();
    for(const sobre of [cache, this.published].filter(Boolean)){
      try{
        const key   = await Vault.keyFor(sobre, clave);
        const datos = await Vault.openWith(key, sobre);
        this.pass      = clave;
        this.cacheKey  = key;
        this.cacheSalt = B64.to(sobre.salt);
        this.cacheIter = sobre.iterations || Vault.ITERATIONS;
        this.state     = datos;
        this.migrate();
        this.locked = false;
        document.body.classList.remove('locked');
        this.lockEl.hidden = true;
        this.touch();
        this.buildNav();
        this.render();
        this.afterOpen(sobre === cache);
        return true;
      }catch{ /* esa clave no abre este sobre: se prueba el siguiente */ }
    }
    return false;
  }

  /* Avisos posteriores a la apertura: conflicto entre dispositivos y respaldo */
  afterOpen(desdeCache){
    const pub = this.published;
    if(desdeCache && pub && Profile.when(pub) > new Date(this.state.updatedAt || 0).getTime()){
      toast('El perfil publicado es más reciente que los cambios de este navegador. Puedes cargarlo desde Ajustes.', 'bad', 10000);
    }
    if(!desdeCache) toast('Perfil publicado cargado.', 'good');
    this.backupReminder();
  }

  unlock(){
    this.locked = false;
    document.body.classList.remove('locked');
    this.lockEl.hidden = true;
    this.touch();
    this.render();
  }
  async tryUnlock(){
    const inp = document.getElementById('lockPin'),
          err = document.getElementById('lockErr'),
          btn = document.getElementById('lockBtn');
    const espera = this.pin.waitMs();
    if(espera > 0){ err.textContent = `Demasiados intentos. Espera ${Math.ceil(espera/1000)} s.`; return; }
    if(!inp.value){ err.textContent = 'Introduce el PIN.'; return; }
    btn.disabled = true;
    const ok = await this.pin.verify(inp.value);
    btn.disabled = false;
    if(ok){ this.pin.resetFails(); this.unlock(); toast('Sesión desbloqueada.', 'good'); return; }
    const n = this.pin.addFail();
    inp.value = ''; inp.focus();
    err.textContent = n >= 3
      ? `PIN incorrecto. Espera ${Math.ceil(this.pin.waitMs()/1000)} s antes de reintentar.`
      : `PIN incorrecto. Intento ${n} de 3.`;
  }
  /* PIN olvidado: como no se guarda, no hay forma de recuperarlo.
     La única salida honesta es restaurar un respaldo tras borrar. */
  forgotPin(){
    const box = this.lockEl.querySelector('.lock-box');
    box.innerHTML = `
      <div class="lock-logo" aria-hidden="true">!</div>
      <h1 id="lockTitle">PIN olvidado</h1>
      <p class="muted">El PIN no se guarda en ningún sitio, solo una huella criptográfica,
        así que no puede recuperarse ni mostrarse.</p>
      <p class="muted">Puedes borrar los datos de este navegador y volver a empezar.
        Si tienes un respaldo, podrás restaurarlo después.</p>
      <form id="wipeForm" novalidate>
        <label for="wipeWord">Escribe <b>BORRAR</b> para confirmar</label>
        <input class="input" id="wipeWord" autocomplete="off" placeholder="BORRAR">
        <p class="err" id="wipeErr" role="alert"></p>
        <div class="lock-foot">
          <button class="btn danger" type="submit">Borrar datos de este navegador</button>
          <button class="btn secondary" type="button" id="wipeBack">Volver al PIN</button>
        </div>
      </form>`;
    document.getElementById('wipeBack').onclick = () => location.reload();
    document.getElementById('wipeForm').onsubmit = e => {
      e.preventDefault();
      if(document.getElementById('wipeWord').value.trim().toUpperCase() !== 'BORRAR'){
        document.getElementById('wipeErr').textContent = 'Escribe BORRAR exactamente para confirmar.';
        return;
      }
      for(let i = localStorage.length - 1; i >= 0; i--){
        const k = localStorage.key(i);
        if(k && k.startsWith('cuida')) localStorage.removeItem(k);
      }
      location.reload();
    };
    setTimeout(() => document.getElementById('wipeWord').focus(), 60);
  }

  /* Recordatorio: sin servidor, el respaldo manual es la única red de seguridad */
  backupReminder(){
    const last = this.state.settings.lastBackup;
    const dias = last ? (Date.now() - new Date(last).getTime()) / 864e5 : Infinity;
    if(dias > 7) setTimeout(() => toast(
      last ? `Han pasado ${Math.floor(dias)} días desde el último respaldo. Descarga uno desde Ajustes.`
           : 'Aún no has descargado ningún respaldo. Hazlo desde Ajustes para no perder la información.',
      'bad', 9000), 1500);
  }

  /* Estado inicial: vacío y sin suponer nada sobre el paciente ni su
     situación. La aplicación no inventa datos; se configura al empezar. */
  seed(){
    return {
      patient:new Patient(), medications:[], agenda:[], agendaDate:isoDate(),
      caregivers:[], symptoms:[], rescues:[], history:[],
      settings:{dark:false, large:false, high:false, sound:false, notifications:false}
    };
  }

  /* Guarda avisando si el navegador se queda sin espacio (las fotos
     son lo que más pesa cuando no hay base de datos externa). */
  save(){
    if(!this.state) return {ok:false};
    this.state.updatedAt = new Date().toISOString();
    // El tiempo de autobloqueo se guarda aparte: hace falta ANTES de descifrar
    if(this.state.settings) localStorage.setItem(Profile.AUTOLOCK, this.state.settings.autolock ?? 5);

    if(this.mode === 'perfil'){ this.persistEncrypted(); return {ok:true}; }

    const r = this.store.save(this.state);
    if(!r.ok)
      toast('No se pudo guardar: el almacenamiento del navegador está lleno. Descarga un respaldo y elimina fotos que no uses.', 'bad', 10000);
    else if(r.warning === 'copias-liberadas')
      toast('Queda poco espacio: se liberaron las copias locales para poder guardar.', 'bad', 8000);
    return r;
  }

  /* En modo perfil el navegador NUNCA guarda nada legible: solo una copia
     cifrada con la clave de acceso. Se agrupan las ráfagas de cambios. */
  persistEncrypted(){
    if(!this.cacheKey) return;
    clearTimeout(this._persistTimer);
    this._persistTimer = setTimeout(async () => {
      try{
        const sobre = await Vault.sealWith(this.cacheKey, this.state, this.cacheSalt, this.cacheIter);
        if(!Profile.saveCache(sobre))
          toast('Sin espacio para la copia local cifrada. Publica el perfil para no perder los cambios.', 'bad', 9000);
      }catch{
        toast('No se pudo cifrar la copia local de los cambios.', 'bad');
      }
    }, 400);
  }
  applySettings(){
    const s = this.state.settings;
    document.body.classList.toggle('dark', s.dark);
    document.body.classList.toggle('large', s.large);
    document.body.classList.toggle('high', s.high);
  }

  /* --- Navegación (enlaces con aria-current, iconos SVG) --- */
  buildNav(){
    const S = p => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const icons = {
      dashboard:S('<path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/>'),
      medications:S('<path d="M10.5 3.5 3.5 10.5a5 5 0 0 0 7 7l7-7a5 5 0 0 0-7-7Z"/><path d="M7 7l7 7"/>'),
      symptoms:S('<path d="M12 20.5S3.5 15.5 3.5 9.3A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 8.5 2.3C20.5 15.5 12 20.5 12 20.5Z"/>'),
      caregivers:S('<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.3a3.2 3.2 0 0 1 0 6.1"/><path d="M17.5 14.6a5.5 5.5 0 0 1 3.2 5.4"/>'),
      settings:S('<circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9 2 2 0 1 1-2.8 2.8 1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2 2 2 0 1 1-2.8-2.8 1.7 1.7 0 0 0-1.2-2.9 2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9A2 2 0 1 1 7.3 3.9 1.7 1.7 0 0 0 10.2 2.7a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2 2 2 0 1 1 2.8 2.8 1.7 1.7 0 0 0 1.2 2.9 2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.7 1.7Z"/>')
    };
    const items = [['dashboard','Hoy'],['medications','Tratamiento'],['symptoms','Registro'],['caregivers','Cuidadores'],['settings','Ajustes']];
    this.navItems = items;
    const nav = document.getElementById('nav');
    nav.innerHTML = items.map(([id,label]) =>
      `<a href="#${id}" data-page="${id}"><span class="ic" aria-hidden="true">${icons[id]}</span><span>${label}</span></a>`).join('');
    nav.onclick = e => { const a = e.target.closest('a'); if(a){ e.preventDefault(); this.go(a.dataset.page); } };
  }
  go(page){ this.page = page; this.render(); this.announce('Sección: ' + this.pageLabel(page)); }
  pageLabel(p){ return (this.navItems.find(i=>i[0]===p)||['',''])[1]; }
  markActive(){
    document.querySelectorAll('#nav a').forEach(a =>
      a.dataset.page===this.page ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  }
  announce(msg){ const l=document.getElementById('live'); l.textContent=''; setTimeout(()=>l.textContent=msg, 30); }

  /* --- Render principal --- */
  render(){
    this.applySettings();
    const html = {
      dashboard:this.homeHTML(), medications:this.treatmentHTML(),
      symptoms:this.recordHTML(), caregivers:this.caregiversHTML(), settings:this.settingsHTML()
    }[this.page];
    const main = document.getElementById('main');
    main.innerHTML = `<div class="page">${html}</div>`;
    this.markActive();
    this.bind();
    this.updateTopPatient();
    // Botón de bloqueo rápido: solo si hay PIN configurado
    const tl = document.getElementById('topLock');
    if(tl){ tl.hidden = !this.pin.enabled(); tl.onclick = () => this.lock(); }
    main.focus({preventScroll:true});
  }
  renderIfDashboard(){ if(this.page==='dashboard') this.render(); }

  updateClock(){
    const c = document.getElementById('clock');
    if(c) c.textContent = new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  }

  /* El paciente es el centro de la aplicación: se ve en todas las
     secciones, no solo en el panel de inicio. */
  updateTopPatient(){
    const el = document.getElementById('topPatient');
    if(!el || !this.state) return;
    const p = this.state.patient;
    el.innerHTML = p.registrado
      ? `<button class="linklike" type="button" data-action="goSettings"
                 title="Editar los datos del paciente">${escapeHtml(p.resumen)}</button>`
      : `<button class="linklike warnlike" type="button" data-action="goSettings">
           Sin paciente registrado · pulsa para configurarlo</button>`;
    el.onclick = e => { if(e.target.closest('[data-action="goSettings"]')) this.go('settings'); };
  }

  /* Saludo según la hora, sin suponer nada del paciente */
  greeting(){
    const h = new Date().getHours();
    const momento = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
    const p = this.state.patient;
    return p.registrado ? `${momento}, ${String(p.name).trim().split(/\s+/)[0]}` : momento;
  }

  /* --- Fragmentos reutilizables --- */
  title(t, sub, button=''){ return `<div class="title-row"><div><h1>${escapeHtml(t)}</h1><p class="sub">${escapeHtml(sub)}</p></div>${button}</div>`; }
  section(title, content, action=''){ return `<div class="section-head"><h2>${escapeHtml(title)}</h2>${action}</div>${content}`; }
  med(id){ return this.state.medications.find(m=>m.id===id); }
  caregiver(id){ return this.state.caregivers.find(c=>c.id===id); }
  caregiversFor(medId){ return this.state.caregivers.filter(c=>c.medIds.includes(medId)); }
  initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase(); }

  todayDone(){ return this.state.agenda.filter(a=>a.status==='administered').length; }
  pending(){ return this.state.agenda.filter(a=>a.status==='pending').length; }
  next(){
    const now = new Date().toTimeString().slice(0,5);
    return this.state.agenda.find(a=>a.status==='pending' && a.time>=now)
        || this.state.agenda.find(a=>a.status==='pending');
  }
  /* Primer medicamento que toca a partir de mañana (para las pautas no diarias) */
  nextScheduled(){
    const manana = addDays(isoDate(), 1);
    let mejor = null;
    for(const m of this.state.medications.filter(x => x.active && x.times.length)){
      const f = MedicationSchedule.nextDate(m, manana);
      if(f && (!mejor || f < mejor.date)) mejor = { date:f, med:m };
    }
    return mejor;
  }

  /* --- Vistas --- */

    '<button class="btn secondary small" type="button" data-action="resetAgenda">Recrear agenda</button>'); }
  treatmentHTML(){ return this.medsHTML() + this.section('Inventario', this.inventoryHTML()); }
  recordHTML(){ return this.symptomsHTML() + this.section('Historial reciente', this.historyHTML(),
    '<button class="btn secondary small" type="button" data-action="exportCSV">Exportar CSV</button>'); }

  dashboardHTML(){

    const symToday = this.state.symptoms.filter(x => isoDate(new Date(x.date)) === isoDate()).length;
    const fecha = new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
    return this.title(this.greeting(),
      this.state.patient.diagnosis || 'Seguimiento de la medicación en casa')
      + this.onboardingHTML() + `
      <div class="grid stats">

        <div class="card stat"><span class="icon" aria-hidden="true">✓</span><div class="label">Administrados</div><div class="n">${done}</div></div>
        <div class="card stat"><span class="icon" aria-hidden="true">!</span><div class="label">Alertas</div><div class="n">${alerts.length}</div></div>
        <div class="card stat"><span class="icon" aria-hidden="true">♡</span><div class="label">Síntomas hoy</div><div class="n">${symToday}</div></div>
      </div>
      <div class="grid two" style="margin-top:18px">
        <div class="card">
          <b>Próxima medicación</b>
          ${m ? `<div class="hero" style="margin-top:14px">
                   <img class="hero-photo" src="${safeImage(m.photo)}" alt="Foto de ${escapeHtml(m.name)}"
                        data-action="viewPhoto" data-id="${m.id}" tabindex="0" role="button">
                   <div>
                     <div class="hero-name">${escapeHtml(m.name)}</div>
                     <p class="muted" style="margin:4px 0 8px">${escapeHtml(m.dose)} ${escapeHtml(m.unit)} · ${escapeHtml(m.presentation)} · ${escapeHtml(m.route)}</p>
                     <p style="margin:0 0 10px"><span class="pill warn">Pendiente · ${escapeHtml(n.time)}</span></p>
                     ${m.indication ? `<p class="muted" style="margin:0 0 12px">${escapeHtml(m.indication)}</p>` : ''}
                     <div class="actions">
                       <button class="btn" type="button" data-action="admin" data-id="${n.id}">Administrar</button>
                       <button class="btn secondary" type="button" data-action="viewMed" data-id="${m.id}">Ver ficha</button>
                     </div>
                   </div>
                 </div>`
                 : (() => {
                     const sig = this.nextScheduled();
                     return `<div class="empty">
                       ${this.state.agenda.length ? 'Todas las dosis de hoy están registradas.'
                                                  : 'Hoy no corresponde ningún medicamento.'}
                       ${sig ? `<div style="margin-top:10px">Próxima: <b>${escapeHtml(sig.med.name)}</b>
                                  el ${escapeHtml(prettyDate(sig.date))} a las ${escapeHtml(sig.med.times[0] || '—')}</div>` : ''}
                     </div>`;
                   })()}
        </div>
        <div class="card">
          <b>Progreso del día</b>
          <div class="n" style="font-size:1.5rem">${done} de ${total}</div>
          <div class="progress"><i style="width:${total ? done/total*100 : 0}%"></i></div>
          <p class="muted">${this.pending()} dosis aún por registrar</p>
        </div>
        <div class="card">
          <b>Alertas de inventario</b>
          ${alerts.length ? alerts.map(x => `<div class="alert ${Inventory.level(x)==='low'?'bad':''}"><b>${escapeHtml(x.name)}</b><br><small>${Inventory.level(x)==='low' ? `Stock bajo: quedan ${x.stock}` : `Vencimiento próximo: ${escapeHtml(x.expiry)}`}</small></div>`).join('')
                          : '<div class="notice">Todo el inventario está en orden.</div>'}
        </div>
        <div class="card">
          <b>Información del paciente</b>
          <ul class="list">
            <li><span>Nombre</span><b>${escapeHtml(this.state.patient.name || 'Sin registrar')}</b></li>
            <li><span>Edad</span><b>${this.state.patient.age ? escapeHtml(this.state.patient.age) + ' años' : '—'}</b></li>

            <button class="btn secondary small" type="button" data-action="goSettings">Editar paciente</button>
          </div>

          <b>Equipo de cuidado</b>
          ${this.state.caregivers.length

              ${puntuales.map(x => `<li>

                </span>
                <button class="btn small" type="button" data-action="takeNow" data-id="${x.id}">Registrar</button>
              </li>`).join('')}
            </ul>
          </div>`;
        })()}
      </div>`;
  }

  /* Primeros pasos: se muestra solo mientras falte lo esencial */
  onboardingHTML(){
    const pasos = [
      { hecho:this.state.patient.registrado, texto:'Registrar al paciente',
        accion:'goSettings', btn:'Ir a Ajustes' },
      { hecho:this.state.medications.length > 0, texto:'Añadir el primer medicamento',
        accion:'newMed', btn:'Nuevo medicamento' },
      { hecho:this.state.caregivers.length > 0, texto:'Añadir a quienes cuidan',
        accion:'newCaregiver', btn:'Nuevo cuidador' }
    ];
    if(pasos.every(x => x.hecho)) return '';
    return `<div class="card" style="margin-bottom:18px">
      <b>Primeros pasos</b>
      <p class="muted">La aplicación empieza vacía y no supone nada sobre el paciente.
        Completa estos pasos para ponerla en marcha.</p>
      <ul class="list">
        ${pasos.map(x => `<li>
          <span>${x.hecho ? '<span class="pill">Hecho</span>' : '<span class="pill warn">Pendiente</span>'}

          ${x.hecho ? '' : `<button class="btn small" type="button" data-action="${x.accion}">${escapeHtml(x.btn)}</button>`}
        </li>`).join('')}
      </ul>
      <p class="muted" style="font-size:.84rem;margin:12px 0 0">¿Solo quieres ver cómo funciona?
        Carga los <button class="linklike" type="button" data-action="loadDemo">datos de ejemplo</button>
        y vacíalos cuando termines.</p>
    </div>`;
  }

  agendaHTML(header=true){
    const rows = this.state.agenda.map(a => {
      const m = this.med(a.medId);
      const st = {pending:'Pendiente', administered:'Administrado', skipped:'Omitido', postponed:'Pospuesto'}[a.status];
      return `<div class="card agenda-card">
        <div class="time">${escapeHtml(a.time)}</div>
        <img class="med-icon" src="${safeImage(m.photo)}" alt="">
        <div>
          <b>${escapeHtml(m.name)}</b>
          <div class="muted">${escapeHtml(m.dose)} ${escapeHtml(m.unit)} · ${escapeHtml(m.route)}</div>
          <div class="status"><span class="pill ${a.status==='pending'?'warn':''}">${st}</span>${a.actual?` · Real: ${new Date(a.actual).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})} · ${escapeHtml(a.responsible)}`:''}<br>${escapeHtml(m.notes||m.indication)}</div>
        </div>
        <div class="actions">${a.status==='pending'
          ? `<button class="btn small" type="button" data-action="admin" data-id="${a.id}">Administrar</button>
             <button class="btn secondary small" type="button" data-action="postpone" data-id="${a.id}">Posponer</button>
             <button class="btn danger small" type="button" data-action="skip" data-id="${a.id}">Omitir</button>`
          : `<button class="btn secondary small" type="button" data-action="undo" data-id="${a.id}">Deshacer</button>`}</div>
      </div>`;
    }).join('');
    const head = header ? this.title('Agenda diaria',
      'Dosis programadas para ' + new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}),
      '<button class="btn secondary" type="button" data-action="resetAgenda">Recrear agenda</button>') : '';
    return head + `<div class="agenda">${rows || '<div class="card empty">Aún no hay medicamentos programados.</div>'}</div>`;
  }

  medsHTML(){
