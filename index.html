  host.appendChild(el);
  setTimeout(()=>el.remove(), ms);
}

/* ============================================================
   UI: Modal accesible (aria-modal, foco atrapado, Escape,
       devuelve el foco al abridor). Reemplaza a los modales
       antiguos y a prompt()/alert()/confirm().
   ============================================================ */
const Modal = {
  host: null, dialog: null, lastFocus: null, onKey: null,
  init(){ this.host = document.getElementById('modalHost'); this.dialog = document.getElementById('dialog'); },
  open(html, {onOpen}={}){
    this.lastFocus = document.activeElement;
    this.dialog.innerHTML = html;
    this.host.hidden = false;
    // Cerrar al pulsar fondo o cualquier botón [data-close]
    this.host.onclick = e => { if(e.target === this.host || e.target.closest('[data-close]')) this.close(); };
    // Gestión de teclado: Escape cierra, Tab queda atrapado dentro
    this.onKey = e => {
      if(e.key === 'Escape'){ e.preventDefault(); this.close(); return; }
      if(e.key === 'Tab') this.trap(e);
    };
    document.addEventListener('keydown', this.onKey, true);
    if(onOpen) onOpen(this.dialog);
    // Foco inicial: primer campo o botón útil
    const first = this.dialog.querySelector('input,select,textarea')
      || this.dialog.querySelector('[data-close]') || this.dialog.querySelector('button');
    (first || this.dialog).focus();
  },
  trap(e){
    const f = [...this.dialog.querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])')]
      .filter(el => !el.disabled && el.offsetParent !== null);
    if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  },
  close(){
    this.host.hidden = true;
    this.dialog.innerHTML = '';
    document.removeEventListener('keydown', this.onKey, true);
    if(this.lastFocus && this.lastFocus.focus) this.lastFocus.focus();
  }
};

/* Confirmación accesible → Promise<boolean> (reemplaza confirm) */
function confirmDialog({title='Confirmar', message='', confirmText='Aceptar', cancelText='Cancelar', danger=false}={}){
  return new Promise(resolve => {
    Modal.open(`
      <div class="dialog-inner">
        <h2 id="dialogTitle">${escapeHtml(title)}</h2>
        <p>${escapeHtml(message)}</p>
        <div class="modal-foot">
          <button class="btn secondary" data-close type="button">${escapeHtml(cancelText)}</button>
          <button class="btn ${danger?'danger':''}" id="cfmOk" type="button">${escapeHtml(confirmText)}</button>
        </div>
      </div>`, { onOpen(){ document.querySelector('#dialog').classList.add('sm'); } });
    document.querySelector('#dialog').classList.add('sm');
    const cleanup = v => { Modal.close(); document.querySelector('#dialog')?.classList.remove('sm'); resolve(v); };
    document.getElementById('cfmOk').onclick = ()=>cleanup(true);
    Modal.host.addEventListener('click', function h(e){ if(e.target===Modal.host||e.target.closest('[data-close]')){ Modal.host.removeEventListener('click',h); resolve(false); } });
  });
}

/* Entrada de un dato accesible → Promise<string|null> (reemplaza prompt).
   Soporta type (text/time/number/textarea), valor por defecto y validación. */
function promptDialog({title='', label='', value='', type='text', placeholder='', required=true, validate}={}){
  return new Promise(resolve => {
    const field = type==='textarea'
      ? `<textarea class="input" id="pd" ${required?'required':''} placeholder="${escapeHtml(placeholder)}">${escapeHtml(value)}</textarea>`
      : `<input class="input" id="pd" type="${type}" value="${escapeHtml(value)}" ${required?'required':''} placeholder="${escapeHtml(placeholder)}">`;
    Modal.open(`
      <h2 id="dialogTitle">${escapeHtml(title)}</h2>
      <form id="pdForm" novalidate>
        <label for="pd">${escapeHtml(label)}</label>
        ${field}
        <p class="err" id="pdErr" role="alert" aria-live="assertive"></p>
      </form>
      <div class="modal-foot">
        <button class="btn secondary" data-close type="button">Cancelar</button>
        <button class="btn" id="pdOk" type="submit" form="pdForm">Aceptar</button>
      </div>`, { onOpen(){ document.querySelector('#dialog').classList.add('sm'); } });
    const done = v => { document.querySelector('#dialog')?.classList.remove('sm'); Modal.close(); resolve(v); };
    const submit = e => {
      e.preventDefault();
      const el = document.getElementById('pd'), v = el.value.trim(), err = document.getElementById('pdErr');
      let msg = '';
      if(required && !v) msg = 'Este campo es obligatorio.';
      else if(validate) msg = validate(v) || '';
      if(msg){ el.setAttribute('aria-invalid','true'); err.textContent = msg; el.focus(); return; }
      done(v);
    };
    document.getElementById('pdForm').onsubmit = submit;
    // Cancelar por fondo/Escape resuelve null
    Modal.host.addEventListener('click', function h(e){ if(e.target===Modal.host||e.target.closest('[data-close]')){ Modal.host.removeEventListener('click',h); document.querySelector('#dialog')?.classList.remove('sm'); resolve(null); } });
  });
}

/* Expresión para validar horas HH:MM (00:00–23:59) */
const RE_TIME = /^([01]\d|2[0-3]):[0-5]\d$/;

/* ============================================================
   Controlador principal
   ============================================================ */
class App{
  constructor(){
    Modal.init();
    this.store  = new StorageManager();
    this.notify = new NotificationManager();
    this.pin    = new PinLock(this);
    this.locked = false;
    this.mode   = 'local';   // 'local' = solo este navegador · 'perfil' = perfil cifrado publicado
    this.pass   = null;      // clave de acceso: solo en memoria, nunca se guarda
    this.page   = 'dashboard';
    // Reloj, cambio de día y refresco del panel cada 30 s
    setInterval(() => {
      this.updateClock();
      if(this.state && this.syncAgenda()){
        this.save(); this.render();
        toast('Comenzó un nuevo día: la agenda se actualizó con lo que toca hoy.', 'good', 7000);
      }else{
        this.renderIfDashboard();
      }
    }, 30000);
    this.updateClock();
    // Importación de respaldo
    document.getElementById('importFile').onchange = e => this.handleImport(e);
  }

  /* ============================================================
     ARRANQUE
     Si el sitio tiene un perfil publicado —o este navegador guarda
     una copia cifrada— no se carga ni se pinta NADA hasta que la
     clave de acceso descifre los datos.
     ============================================================ */
  async start(){
    this.published = await Profile.published();
    if(this.published || Profile.cache()){
      this.mode = 'perfil';
      this.initLock();
      this.gate();
      return;
    }
    this.bootLocal();
  }

  /* Modo local: los datos viven solo en este navegador (comportamiento previo) */
  bootLocal(){
    this.mode  = 'local';
    this.state = this.store.load() || this.seed();
    this.migrate();
    this.save();
    this.buildNav();
    this.render();
    this.initLock();
    if(this.pin.enabled()) this.lock(true);
    this.backupReminder();
  }

  /* ============================================================
     MODO FIREBASE · datos centralizados en la nube (Firestore)
     Un ÚNICO registro para todas las cuentas autorizadas: nada por
     sesión ni por dispositivo. El login con Google es la puerta.
     ============================================================ */
  bootAnyway(){ if(this._booted) return; this._booted = true; this.start(); }

  startFirebase(db){
    this.db = db;
    this.mode = 'firebase';
    this._fbIds = {};
    this.initLock();
    db.onAuthError(error => {
      this._firebaseError = this.firebaseErrorText(error);
      this.firebaseGate(this._firebaseError);
    });
    db.onAuth(user => user ? this.firebaseLoad() : this.firebaseGate(this._firebaseError));
  }

  firebaseErrorText(error){
    const code = error?.code || 'sin-código';
    const help = {
      'auth/unauthorized-domain':'Autoriza hectorandrade88.github.io en Firebase Authentication.',
      'auth/operation-not-allowed':'Habilita el proveedor Google en Firebase Authentication.',
      'auth/web-storage-unsupported':'Abre el enlace en Safari, Edge o Chrome, fuera de WhatsApp/Instagram.',
      'auth/unsupported-webview':'Abre el enlace en Safari, Edge o Chrome, fuera de WhatsApp/Instagram.'
    }[code];
    return `No se pudo iniciar sesión (${code}). ${help || error?.message || 'Revisa la configuración de Firebase.'}`;
  }

  firebaseUnavailable(error){
    this.mode = 'firebase';
    this.locked = true;
    document.body.classList.add('locked');
    this.lockEl = document.getElementById('lock');
    this.lockEl.hidden = false;
    const detail = error?.code || error?.message || String(error);
    this.lockEl.querySelector('.lock-box').innerHTML = `
      <div class="lock-logo" aria-hidden="true">!</div>
      <h1 id="lockTitle">No se pudo iniciar Cuida</h1>
      <p class="muted">No se cargó la conexión segura con Firebase. La aplicación no abrirá datos locales ni pedirá una clave alternativa.</p>
      <p class="err" role="alert">Detalle: ${escapeHtml(detail)}</p>
      <div class="lock-foot"><button class="btn" type="button" id="retryFirebase">Reintentar</button></div>`;
    document.getElementById('retryFirebase').onclick = () => location.reload();
  }

  /* Puerta de acceso: login con Google (solo cuentas autorizadas) */
  firebaseGate(mensaje){
    this.locked = true;
    document.body.classList.add('locked');
    this.lockEl = document.getElementById('lock');
    this.lockEl.hidden = false;
    const box = this.lockEl.querySelector('.lock-box');
    box.innerHTML = `
      <div class="lock-logo" aria-hidden="true">✚</div>
      <h1 id="lockTitle">Cuida</h1>
      <p class="muted">Inicia sesión con tu cuenta autorizada para ver la información.</p>
      <p class="err" id="gErr" role="alert" aria-live="assertive">${escapeHtml(mensaje || '')}</p>
      <div class="lock-foot">
        <button class="btn" type="button" id="gGoogle">Entrar con Google</button>
      </div>
      <p class="muted" style="font-size:.8rem;margin-top:16px">
        Los datos están centralizados en la nube y protegidos: solo las cuentas
        autorizadas pueden verlos o modificarlos.</p>`;
    document.getElementById('gGoogle').onclick = () => {
      this._firebaseError = '';
      this.db.signIn().catch(e => {
        this._firebaseError = this.firebaseErrorText(e);
        this.firebaseGate(this._firebaseError);
      });
    };
  }

  /* Carga el registro central y pinta la app */
  async firebaseLoad(){
    try{
      this.state = await this.db.loadState();
    }catch(e){
      this.firebaseGate('No se pudo cargar: ' + (e?.message || e)); return;
    }
    this.migrate();
    this._fbIds = {
      medicamentos: new Set(this.state.medications.map(m => m.id)),
      cuidadores:   new Set(this.state.caregivers.map(c => c.id)),
    };
    this.locked = false;
    this._firebaseError = '';
    document.body.classList.remove('locked');
    this.lockEl.hidden = true;
    this.touch();
    const foot = document.getElementById('sideFoot');
    if(foot) foot.innerHTML = 'Datos centralizados en la nube.<br>Solo cuentas autorizadas.';
    this.buildNav();
    this.render();
  }

  /* Guardado en la nube: se agrupan las ráfagas de cambios */
  firebaseSync(){
    clearTimeout(this._fbTimer);
    this._fbTimer = setTimeout(() => this.firebaseSyncNow(), 800);
  }
  async firebaseSyncNow(){
    const s = this.state, db = this.db, ops = [];
    ops.push(db.savePatient(s.patient), db.saveSettings(s.settings),
             db.saveAgenda(s.agendaDate, s.agenda));
    // Reconciliar medicamentos y cuidadores (altas, cambios y BAJAS)
    const recon = (name, arr, up, del) => {
      const ahora = new Set(arr.map(x => x.id));
      arr.forEach(x => ops.push(up(x)));
      (this._fbIds[name] || new Set()).forEach(id => { if(!ahora.has(id)) ops.push(del(id)); });
      this._fbIds[name] = ahora;
    };
    recon('medicamentos', s.medications, m => db.saveMedication(m), id => db.deleteMedication(id));
    recon('cuidadores',   s.caregivers,  c => db.saveCaregiver(c),  id => db.deleteCaregiver(id));
    // Registros (solo altas)
    s.symptoms.forEach(x => ops.push(db.addSymptom(x)));
    s.rescues .forEach(x => ops.push(db.addRescue(x)));
    s.history .forEach(x => ops.push(db.addHistory(x)));
    try{ await Promise.all(ops); }
    catch(e){ toast('No se pudo guardar en la nube: ' + (e?.message || e), 'bad', 8000); }
  }

  /* Compatibilidad con datos y respaldos de versiones anteriores */
  migrate(){
    this.state.patient    = new Patient(this.state.patient);
    this.state.caregivers = (this.state.caregivers || []).map(c => new Caregiver(c));
    this.state.medications = (this.state.medications || []).map(m => {
      const medication = new Medication(m);
      delete medication.photo;
      delete medication.photoPath;
      return medication;
    });
    this.state.symptoms = this.state.symptoms || [];
    this.state.rescues  = this.state.rescues  || [];
    this.state.history  = this.state.history  || [];
    this.state.agenda   = this.state.agenda   || [];
    // El autobloqueo deja de vivir por dispositivo: si hay un valor heredado
    // en localStorage y el perfil aún no lo trae, se conserva una única vez.
    const settingsPrevias = this.state.settings || {};
    const alHeredado = localStorage.getItem('cuida-autobloqueo');
    if(alHeredado != null && settingsPrevias.autolock == null) settingsPrevias.autolock = +alHeredado;
    this.state.settings = Object.assign(
      { dark:false, large:false, high:false, sound:false, notifications:false,
        autolock:5, medView:'tabla', lastBackup:'', whatsapp:true,
        whatsappGroup:'', whatsappGroupName:'Hermanos' },
      settingsPrevias);

    // El PIN deja de vivir por dispositivo y pasa al perfil central (state.pin).
    // Se importa el heredado una sola vez y se borran las claves por dispositivo.
    const pinHeredado = localStorage.getItem('cuida-pin');
    if(pinHeredado && !this.state.pin){ try{ this.state.pin = JSON.parse(pinHeredado); }catch{} }
    ['cuida-pin','cuida-pin-fallos','cuida-pin-ultimo','cuida-autobloqueo']
      .forEach(k => localStorage.removeItem(k));

    this.syncAgenda();
  }

  /* La agenda pertenece a un día concreto. Si se abre la aplicación otro
     día —o cambia la fecha con ella abierta— se recrea con lo que toca. */
  syncAgenda(){
    const hoy = isoDate();
    if(this.state.agendaDate === hoy) return false;
    this.state.agendaDate = hoy;
    this.state.agenda = MedicationSchedule.today(this.state.medications);
    return true;
  }

  /* ============================================================
     PUERTA DE ENTRADA Y BLOQUEO
     En modo «perfil» el descifrado ES la puerta: mientras no se
     introduzca la clave correcta no hay datos en memoria, así que
     no hay nada que mostrar en ninguna pantalla.
     En modo «local» el PIN protege el acceso visual en el equipo.
     ============================================================ */
  initLock(){
    this.lockEl = document.getElementById('lock');
    document.getElementById('lockForm').onsubmit = e => { e.preventDefault(); this.tryUnlock(); };
    // Actividad del usuario para el autobloqueo
    ['pointerdown','keydown','touchstart','wheel'].forEach(ev =>
      document.addEventListener(ev, () => this.touch(), {passive:true}));
    setInterval(() => this.checkIdle(), 15000);
    this.touch();
  }
  touch(){ this.lastActivity = Date.now(); }

  /* Minutos de inactividad; el ajuste vive dentro del perfil central.
     Sin perfil descifrado en memoria no hay nada abierto que bloquear. */
  autolockMinutes(){
    return (this.state && this.state.settings) ? +this.state.settings.autolock || 0 : 0;
  }
  checkIdle(){
    const min = this.autolockMinutes();
    if(!min || this.locked) return;
    if(this.mode === 'local' && !this.pin.enabled()) return;
    if(Date.now() - this.lastActivity > min * 60000){
      this.lock();
      toast('Bloqueada por inactividad.');
    }
  }

  lock(silencioso){
    if(this.mode === 'perfil'){
      // Se borra de memoria la clave y los datos descifrados
      this.pass = null; this.cacheKey = null; this.state = null;
      this.gate();
      if(!silencioso) this.announce('Aplicación bloqueada.');
      return;
    }
    if(!this.pin.enabled()) return;
    this.locked = true;
    document.body.classList.add('locked');
    this.lockEl.hidden = false;
    this.renderLockBox();
    if(!silencioso) this.announce('Aplicación bloqueada.');
  }
  renderLockBox(){
    const box = this.lockEl.querySelector('.lock-box');
    box.innerHTML = `
      <div class="lock-logo" aria-hidden="true">✚</div>
      <h1 id="lockTitle">Aplicación bloqueada</h1>
      <p class="muted">Introduce el PIN para ver la información.</p>
      <form id="lockForm" novalidate>
        <label class="sr-only" for="lockPin">PIN de acceso</label>
        <input class="input pin" id="lockPin" type="password" inputmode="numeric"
               autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="12" placeholder="••••">
        <p class="err" id="lockErr" role="alert" aria-live="assertive"></p>
        <div class="lock-foot">
          <button class="btn" type="submit" id="lockBtn">Desbloquear</button>
          <button class="btn secondary" type="button" data-forgot>He olvidado el PIN</button>
        </div>
      </form>`;
    document.getElementById('lockForm').onsubmit = e => { e.preventDefault(); this.tryUnlock(); };
    box.querySelector('[data-forgot]').onclick = () => this.forgotPin();
    setTimeout(() => document.getElementById('lockPin')?.focus(), 60);
  }

  /* --- Puerta del perfil cifrado --- */
  gate(mensaje){
    this.locked = true;
    document.body.classList.add('locked');
    this.lockEl = document.getElementById('lock');
    this.lockEl.hidden = false;
    const box = this.lockEl.querySelector('.lock-box');
    box.innerHTML = `
      <div class="lock-logo" aria-hidden="true">✚</div>
      <h1 id="lockTitle">Cuida</h1>
      <p class="muted">Introduce la clave de acceso para descifrar la información.</p>
      ${SECURE ? '' : `<div class="alert bad"><b>No se puede descifrar aquí</b><br>
        <small>Has abierto el archivo directamente. El descifrado necesita https:// o localhost.
        Abre el sitio publicado en lugar del archivo.</small></div>`}
      <form id="gateForm" novalidate>
        <label class="sr-only" for="gatePass">Clave de acceso</label>
        <input class="input" id="gatePass" type="password" autocomplete="current-password"
               autocapitalize="off" spellcheck="false" placeholder="Clave de acceso" ${SECURE?'':'disabled'}>
        <p class="err" id="gateErr" role="alert" aria-live="assertive">${escapeHtml(mensaje || '')}</p>
        <div class="lock-foot">
          <button class="btn" type="submit" id="gateBtn" ${SECURE?'':'disabled'}>Entrar</button>
        </div>
      </form>
      <p class="muted" style="font-size:.8rem;margin-top:16px">
        Los datos están cifrados con AES-GCM. Sin la clave no se descifran ni se muestran,
        en ningún navegador ni dispositivo.</p>`;
    document.getElementById('gateForm').onsubmit = e => { e.preventDefault(); this.tryGate(); };
    setTimeout(() => document.getElementById('gatePass')?.focus(), 60);
  }

  async tryGate(){
    const inp = document.getElementById('gatePass'),
          err = document.getElementById('gateErr'),
          btn = document.getElementById('gateBtn');
    const espera = this.pin.waitMs();
    if(espera > 0){ err.textContent = `Demasiados intentos. Espera ${Math.ceil(espera/1000)} s.`; return; }
    if(!inp.value){ err.textContent = 'Introduce la clave de acceso.'; return; }

    btn.disabled = true; err.textContent = 'Descifrando…';
    const ok = await this.openProfile(inp.value);
    btn.disabled = false;
    if(ok){ this.pin.resetFails(); return; }

    const n = this.pin.addFail();
    inp.value = ''; inp.focus();
    err.textContent = n >= 3
      ? `Clave incorrecta. Espera ${Math.ceil(this.pin.waitMs()/1000)} s antes de reintentar.`
      : `Clave incorrecta. Intento ${n} de 3.`;
  }

  /* Prueba la clave contra la copia local y contra el perfil publicado */
  async openProfile(clave){
    const cache = Profile.cache();
    for(const sobre of [cache, this.published].filter(Boolean)){
      try{
        const key   = await Vault.keyFor(sobre, clave);
        const datos = await Vault.openWith(key, sobre);
        this.pass      = clave;
        this.cacheKey  = key;
        this.cacheSalt = B64.to(sobre.salt);
        this.cacheIter = sobre.iterations || Vault.ITERATIONS;
        this.state     = datos;
        this.migrate();
        this.locked = false;
        document.body.classList.remove('locked');
        this.lockEl.hidden = true;
        this.touch();
        this.buildNav();
        this.render();
        this.afterOpen(sobre === cache);
        return true;
      }catch{ /* esa clave no abre este sobre: se prueba el siguiente */ }
    }
    return false;
  }

  /* Avisos posteriores a la apertura: conflicto entre dispositivos y respaldo */
  afterOpen(desdeCache){
    const pub = this.published;
    if(desdeCache && pub && Profile.when(pub) > new Date(this.state.updatedAt || 0).getTime()){
      toast('El perfil publicado es más reciente que los cambios de este navegador. Puedes cargarlo desde Ajustes.', 'bad', 10000);
    }
    if(!desdeCache) toast('Perfil publicado cargado.', 'good');
    this.backupReminder();
  }

  unlock(){
    this.locked = false;
    document.body.classList.remove('locked');
    this.lockEl.hidden = true;
    this.touch();
    this.render();
  }
  async tryUnlock(){
    const inp = document.getElementById('lockPin'),
          err = document.getElementById('lockErr'),
          btn = document.getElementById('lockBtn');
    const espera = this.pin.waitMs();
    if(espera > 0){ err.textContent = `Demasiados intentos. Espera ${Math.ceil(espera/1000)} s.`; return; }
    if(!inp.value){ err.textContent = 'Introduce el PIN.'; return; }
    btn.disabled = true;
    const ok = await this.pin.verify(inp.value);
    btn.disabled = false;
    if(ok){ this.pin.resetFails(); this.unlock(); toast('Sesión desbloqueada.', 'good'); return; }
    const n = this.pin.addFail();
    inp.value = ''; inp.focus();
    err.textContent = n >= 3
      ? `PIN incorrecto. Espera ${Math.ceil(this.pin.waitMs()/1000)} s antes de reintentar.`
      : `PIN incorrecto. Intento ${n} de 3.`;
  }
  /* PIN olvidado: como no se guarda, no hay forma de recuperarlo.
     La única salida honesta es restaurar un respaldo tras borrar. */
  forgotPin(){
    const box = this.lockEl.querySelector('.lock-box');
    box.innerHTML = `
      <div class="lock-logo" aria-hidden="true">!</div>
      <h1 id="lockTitle">PIN olvidado</h1>
      <p class="muted">El PIN no se guarda en ningún sitio, solo una huella criptográfica,
        así que no puede recuperarse ni mostrarse.</p>
      <p class="muted">Puedes borrar los datos de este navegador y volver a empezar.
        Si tienes un respaldo, podrás restaurarlo después.</p>
      <form id="wipeForm" novalidate>
        <label for="wipeWord">Escribe <b>BORRAR</b> para confirmar</label>
        <input class="input" id="wipeWord" autocomplete="off" placeholder="BORRAR">
        <p class="err" id="wipeErr" role="alert"></p>
        <div class="lock-foot">
          <button class="btn danger" type="submit">Borrar datos de este navegador</button>
          <button class="btn secondary" type="button" id="wipeBack">Volver al PIN</button>
        </div>
      </form>`;
    document.getElementById('wipeBack').onclick = () => location.reload();
    document.getElementById('wipeForm').onsubmit = e => {
      e.preventDefault();
      if(document.getElementById('wipeWord').value.trim().toUpperCase() !== 'BORRAR'){
        document.getElementById('wipeErr').textContent = 'Escribe BORRAR exactamente para confirmar.';
        return;
      }
      for(let i = localStorage.length - 1; i >= 0; i--){
        const k = localStorage.key(i);
        if(k && k.startsWith('cuida')) localStorage.removeItem(k);
      }
      location.reload();
    };
    setTimeout(() => document.getElementById('wipeWord').focus(), 60);
  }

  /* Recordatorio: sin servidor, el respaldo manual es la única red de seguridad */
  backupReminder(){
    const last = this.state.settings.lastBackup;
    const dias = last ? (Date.now() - new Date(last).getTime()) / 864e5 : Infinity;
    if(dias > 7) setTimeout(() => toast(
      last ? `Han pasado ${Math.floor(dias)} días desde el último respaldo. Descarga uno desde Ajustes.`
           : 'Aún no has descargado ningún respaldo. Hazlo desde Ajustes para no perder la información.',
      'bad', 9000), 1500);
  }

  /* Estado inicial: vacío y sin suponer nada sobre el paciente ni su
     situación. La aplicación no inventa datos; se configura al empezar. */
  seed(){
    return {
      patient:new Patient(), medications:[], agenda:[], agendaDate:isoDate(),
      caregivers:[], symptoms:[], rescues:[], history:[],
      settings:{dark:false, large:false, high:false, sound:false, notifications:false}
    };
  }

  /* Datos de ejemplo, solo si se piden expresamente desde Ajustes.
     Sirven para ver cómo queda la aplicación llena antes de usarla. */
  demoData(){
    const meds = [
      new Medication({name:'Morfina', activeIngredient:'Sulfato de morfina', dose:'10', unit:'mg', presentation:'Solución oral', route:'Oral', times:['08:00','14:00','20:00'], indication:'Dolor intenso', notes:'Administrar con jeringa dosificadora.', color:'#805ad5', stock:28, minStock:10, expiry:'2027-05-30', lab:'Ejemplo Farma'}),
      new Medication({name:'Paracetamol', activeIngredient:'Paracetamol', dose:'1', unit:'g', presentation:'Comprimido', route:'Oral', times:['09:00','21:00'], indication:'Dolor o fiebre', color:'#92500a', stock:8, minStock:10, expiry:'2026-10-12', lab:'Ejemplo Farma'}),
      new Medication({name:'Ondansetrón', activeIngredient:'Ondansetrón', dose:'4', unit:'mg', presentation:'Comprimido', route:'Oral', times:['08:00','20:00'], indication:'Náuseas y vómitos', color:'#0f6f52', stock:16, minStock:6, expiry:'2027-01-08', lab:'Ejemplo Farma'}),
      // Ejemplo de medicamento sin horario: solo se controla el inventario
      new Medication({name:'Hioscina', activeIngredient:'Butilbromuro de hioscina', dose:'10', unit:'mg', presentation:'Ampolla', route:'Subcutánea', pattern:'demanda', indication:'Secreciones o cólicos, según necesidad', notes:'Registrar cada aplicación en el momento.', color:'#7a3d00', stock:12, minStock:4, expiry:'2027-03-15', lab:'Ejemplo Farma'})
    ];
    // Cuidadores de ejemplo, cada uno con VARIOS medicamentos asignados
    const caregivers = [
      new Caregiver({name:'Cuidadora de ejemplo', role:'Familiar', phone:'300 123 4567', medIds:meds.map(m=>m.id), notes:'Cuidadora principal · turno de día.'}),
      new Caregiver({name:'Enfermería domiciliaria', role:'Enfermero/a', phone:'', medIds:[meds[0].id, meds[2].id], notes:'Apoyo con la medicación pautada.'})
    ];

      settings:{dark:false, large:false, high:false, sound:false, notifications:false}
    };
  }

  /* Guarda avisando si el navegador se queda sin espacio. */
  save(){
    if(!this.state) return {ok:false};
    this.state.updatedAt = new Date().toISOString();

    if(this.mode === 'firebase'){ this.firebaseSync(); return {ok:true}; }
    if(this.mode === 'perfil'){ this.persistEncrypted(); return {ok:true}; }

    const r = this.store.save(this.state);
    if(!r.ok)
      toast('No se pudo guardar: el almacenamiento del navegador está lleno. Descarga un respaldo y elimina datos que no uses.', 'bad', 10000);
    else if(r.warning === 'copias-liberadas')
      toast('Queda poco espacio: se liberaron las copias locales para poder guardar.', 'bad', 8000);
    return r;
  }

  /* En modo perfil el navegador NUNCA guarda nada legible: solo una copia
     cifrada con la clave de acceso. Se agrupan las ráfagas de cambios. */
  persistEncrypted(){
    if(!this.cacheKey) return;
    clearTimeout(this._persistTimer);
    this._persistTimer = setTimeout(async () => {
      try{
        const sobre = await Vault.sealWith(this.cacheKey, this.state, this.cacheSalt, this.cacheIter);
        if(!Profile.saveCache(sobre))
          toast('Sin espacio para la copia local cifrada. Publica el perfil para no perder los cambios.', 'bad', 9000);
      }catch{
        toast('No se pudo cifrar la copia local de los cambios.', 'bad');
      }
    }, 400);
  }
  applySettings(){
    const s = this.state.settings;
    document.body.classList.toggle('dark', s.dark);
    document.body.classList.toggle('large', s.large);
    document.body.classList.toggle('high', s.high);
  }

  /* --- Navegación (enlaces con aria-current, iconos SVG) --- */
  buildNav(){
    const S = p => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const icons = {
      dashboard:S('<path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/>'),
      medications:S('<path d="M10.5 3.5 3.5 10.5a5 5 0 0 0 7 7l7-7a5 5 0 0 0-7-7Z"/><path d="M7 7l7 7"/>'),
      symptoms:S('<path d="M12 20.5S3.5 15.5 3.5 9.3A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 8.5 2.3C20.5 15.5 12 20.5 12 20.5Z"/>'),
      caregivers:S('<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.3a3.2 3.2 0 0 1 0 6.1"/><path d="M17.5 14.6a5.5 5.5 0 0 1 3.2 5.4"/>'),
      settings:S('<circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9 2 2 0 1 1-2.8 2.8 1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2 2 2 0 1 1-2.8-2.8 1.7 1.7 0 0 0-1.2-2.9 2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9A2 2 0 1 1 7.3 3.9 1.7 1.7 0 0 0 10.2 2.7a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2 2 2 0 1 1 2.8 2.8 1.7 1.7 0 0 0 1.2 2.9 2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.7 1.7Z"/>')
    };
    const items = [['dashboard','Hoy'],['medications','Tratamiento'],['symptoms','Registro'],['caregivers','Cuidadores'],['settings','Ajustes']];
    this.navItems = items;
    const nav = document.getElementById('nav');
    nav.innerHTML = items.map(([id,label]) =>
      `<a href="#${id}" data-page="${id}"><span class="ic" aria-hidden="true">${icons[id]}</span><span>${label}</span></a>`).join('');
    nav.onclick = e => { const a = e.target.closest('a'); if(a){ e.preventDefault(); this.go(a.dataset.page); } };
  }
  go(page){ this.page = page; this.render(); this.announce('Sección: ' + this.pageLabel(page)); }
  pageLabel(p){ return (this.navItems.find(i=>i[0]===p)||['',''])[1]; }
  markActive(){
    document.querySelectorAll('#nav a').forEach(a =>
      a.dataset.page===this.page ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  }
  announce(msg){ const l=document.getElementById('live'); l.textContent=''; setTimeout(()=>l.textContent=msg, 30); }

  /* --- Render principal --- */
  render(){
    this.applySettings();
    const html = {
      dashboard:this.homeHTML(), medications:this.treatmentHTML(),
      symptoms:this.recordHTML(), caregivers:this.caregiversHTML(), settings:this.settingsHTML()
    }[this.page];
    const main = document.getElementById('main');
    main.innerHTML = `<div class="page">${html}</div>`;
    this.markActive();
    this.bind();
    this.updateTopPatient();
    // En modo Firebase, bloquear equivale a cerrar la sesión de Google.
    const tl = document.getElementById('topLock');
    if(tl){
      tl.hidden = this.mode !== 'firebase';
      tl.textContent = 'Bloquear';
      tl.onclick = this.mode === 'firebase' ? () => this.firebaseLock() : null;
    }
    main.focus({preventScroll:true});
  }
  async firebaseLock(){
    try{
      await this.db.signOut();
      toast('Sesión cerrada. Inicia sesión con Google para volver a entrar.', 'good');
    }catch(e){
      toast('No se pudo bloquear la sesión: ' + (e?.message || e), 'bad');
    }
  }
  renderIfDashboard(){ if(this.page==='dashboard') this.render(); }

  updateClock(){
    const c = document.getElementById('clock');
    if(c) c.textContent = new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  }

  /* El paciente es el centro de la aplicación: se ve en todas las
     secciones, no solo en el panel de inicio. */
  updateTopPatient(){
    const el = document.getElementById('topPatient');
    if(!el || !this.state) return;
    const p = this.state.patient;
    el.innerHTML = p.registrado
      ? `<button class="linklike" type="button" data-action="goSettings"
                 title="Editar los datos del paciente">${escapeHtml(p.name)}</button>`
      : `<button class="linklike warnlike" type="button" data-action="goSettings">
           Sin paciente registrado · pulsa para configurarlo</button>`;
    el.onclick = e => { if(e.target.closest('[data-action="goSettings"]')) this.go('settings'); };
  }

  /* Saludo según la hora, sin suponer nada del paciente */
  greeting(){
    const h = new Date().getHours();
    const momento = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
    const p = this.state.patient;
    return p.registrado ? `${momento}, ${String(p.name).trim().split(/\s+/)[0]}` : momento;
  }

  /* --- Fragmentos reutilizables --- */
  title(t, sub, button=''){ return `<div class="title-row"><div><h1>${escapeHtml(t)}</h1><p class="sub">${escapeHtml(sub)}</p></div>${button}</div>`; }
  section(title, content, action=''){ return `<div class="section-head"><h2>${escapeHtml(title)}</h2>${action}</div>${content}`; }
  med(id){ return this.state.medications.find(m=>m.id===id); }
  caregiver(id){ return this.state.caregivers.find(c=>c.id===id); }
  caregiversFor(medId){ return this.state.caregivers.filter(c=>c.medIds.includes(medId)); }
  initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase(); }

  todayDone(){ return this.state.agenda.filter(a=>a.status==='administered').length; }
  pending(){ return this.state.agenda.filter(a=>a.status==='pending').length; }
  next(){
    const now = new Date().toTimeString().slice(0,5);
    return this.state.agenda.find(a=>a.status==='pending' && a.time>=now)
        || this.state.agenda.find(a=>a.status==='pending');
  }
  /* Primer medicamento que toca a partir de mañana (para las pautas no diarias) */
  nextScheduled(){
    const manana = addDays(isoDate(), 1);
    let mejor = null;
    for(const m of this.state.medications.filter(x => x.active && x.times.length)){
      const f = MedicationSchedule.nextDate(m, manana);
      if(f && (!mejor || f < mejor.date)) mejor = { date:f, med:m };
    }
    return mejor;
  }

  /* --- Vistas --- */
  homeHTML(){
    return this.dashboardHTML() + `
      <details class="fold" open style="margin-top:22px">
        <summary>Agenda de hoy</summary>
        <div class="fold-body">
          ${this.agendaHTML(false)}
          <div style="margin-top:12px">
            <button class="btn secondary small" type="button" data-action="resetAgenda">Recrear agenda</button>
          </div>
        </div>
      </details>`;
  }
  treatmentHTML(){ return this.medsHTML() + this.section('Inventario', this.inventoryHTML()); }
  recordHTML(){ return this.symptomsHTML()
    + this.section('Resumen por día', this.calendarSection())
    + this.section('Historial reciente', this.historyHTML(),
    '<button class="btn secondary small" type="button" data-action="exportCSV">Exportar CSV</button>'); }

  dashboardHTML(){
    const n = this.next(), m = n && this.med(n.medId);
    const total = this.state.agenda.length, done = this.todayDone();
    const alerts = this.state.medications.filter(x => Inventory.level(x)==='low' ||
      (x.expiry && new Date(x.expiry) < new Date(Date.now()+90*864e5)));
    // Comparación en fecha local: con UTC, a partir de las 7 p. m. contaba mal
    const symToday = this.state.symptoms.filter(x => isoDate(new Date(x.date)) === isoDate()).length;
    const fecha = new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
    const fechaCap = fecha.charAt(0).toUpperCase() + fecha.slice(1);
    const nombre = this.state.patient.name || 'Panel de hoy';
    return `<header class="title-row compact-head">
        <div>
          <h1 class="dash-h1">${escapeHtml(nombre)}</h1>
          <p class="sub">${escapeHtml(fechaCap)}</p>
        </div>
        <details class="patient-info">
          <summary aria-label="Información del paciente" title="Información del paciente">ⓘ</summary>
          <div class="pop">
            <b style="display:block;margin-bottom:8px">Información del paciente</b>
            <ul class="list">
              <li><span>Nombre</span><b>${escapeHtml(this.state.patient.name || 'Sin registrar')}</b></li>
              <li><span>Edad</span><b>${this.state.patient.age ? escapeHtml(this.state.patient.age) + ' años' : '—'}</b></li>
              <li><span>Diagnóstico</span><b>${escapeHtml(this.state.patient.diagnosis || '—')}</b></li>
            </ul>
            <button class="btn secondary small" type="button" data-action="goSettings" style="margin-top:10px;width:100%">Editar paciente</button>
          </div>
        </details>
      </header>`
      + this.onboardingHTML() + `
      <div class="metrics">
        <div class="stat-mini warn"><span class="icon">${svgIcon('clock')}</span><div><div class="n">${this.pending()}</div><div class="label">Pendientes hoy</div></div></div>
        <div class="stat-mini good"><span class="icon">${svgIcon('check')}</span><div><div class="n">${done}</div><div class="label">Administrados</div></div></div>
        <div class="stat-mini bad"><span class="icon">${svgIcon('alert')}</span><div><div class="n">${alerts.length}</div><div class="label">Alertas</div></div></div>
        <div class="stat-mini"><span class="icon">${svgIcon('heart')}</span><div><div class="n">${symToday}</div><div class="label">Síntomas hoy</div></div></div>
      </div>
      <div class="dash-grid" style="margin-top:18px">
        <div class="card">
          <b>Próxima medicación</b>
          ${m ? `<div class="hero" style="margin-top:14px">
                   <div>
                     <div class="hero-name">${escapeHtml(m.name)}</div>
                     <p class="muted" style="margin:4px 0 8px">${escapeHtml(m.dose)} ${escapeHtml(m.unit)} · ${escapeHtml(m.presentation)} · ${escapeHtml(m.route)}</p>
                     <p style="margin:0 0 10px"><span class="pill warn">Pendiente · ${escapeHtml(n.time)}</span></p>
                     ${m.indication ? `<p class="muted" style="margin:0 0 12px">${escapeHtml(m.indication)}</p>` : ''}
                     <div class="actions">
                       <button class="btn" type="button" data-action="admin" data-id="${n.id}">Administrar</button>
                       <button class="btn secondary" type="button" data-action="viewMed" data-id="${m.id}">Ver ficha</button>
                     </div>
                   </div>
                 </div>`
                 : (() => {
                     const sig = this.nextScheduled();
                     return `<div class="empty">
                       ${this.state.agenda.length ? 'Todas las dosis de hoy están registradas.'
                                                  : 'Hoy no corresponde ningún medicamento.'}
                       ${sig ? `<div style="margin-top:10px">Próxima: <b>${escapeHtml(sig.med.name)}</b>
                                  el ${escapeHtml(prettyDate(sig.date))} a las ${escapeHtml(sig.med.times[0] || '—')}</div>` : ''}
                     </div>`;
                   })()}
        </div>
        <div class="dash-side">
          <div class="card">
            <b>Progreso del día</b>
            <div class="n" style="font-size:1.5rem">${done} de ${total}</div>
            <div class="progress"><i style="width:${total ? done/total*100 : 0}%"></i></div>
            <p class="muted">${this.pending()} dosis aún por registrar</p>
          </div>
          <div class="card">
            <b>Alertas de inventario</b>
            ${alerts.length ? alerts.map(x => `<div class="alert ${Inventory.level(x)==='low'?'bad':''}"><b>${escapeHtml(x.name)}</b><br><small>${Inventory.level(x)==='low' ? `Stock bajo: quedan ${x.stock}` : `Vencimiento próximo: ${escapeHtml(x.expiry)}`}</small></div>`).join('')
                            : '<div class="notice">Todo el inventario está en orden.</div>'}
          </div>
        </div>
      </div>
      ${(() => {
          const puntuales = this.state.medications.filter(x => x.active && MedicationSchedule.onDemand(x));
          if(!puntuales.length) return '';
          return `<details class="fold" style="margin-top:16px">
            <summary>Según necesidad · ${puntuales.length}</summary>
            <div class="fold-body">
              <p class="muted" style="font-size:.84rem;margin:0 0 8px">No tienen horario: se registran en el momento en que se administran.</p>
              <ul class="list">
                ${puntuales.map(x => `<li>
                  <span class="car-line">
                    <span><b>${escapeHtml(x.name)}</b><br>
                      <small class="muted">${escapeHtml(x.dose)} ${escapeHtml(x.unit)} · quedan ${x.stock}${Inventory.level(x)==='low'?' (bajo mínimo)':''}</small></span>
                  </span>
                  <button class="btn small" type="button" data-action="takeNow" data-id="${x.id}">Registrar</button>
                </li>`).join('')}
              </ul>
            </div>
          </details>`;
        })()}`;
  }

  /* Primeros pasos: se muestra solo mientras falte lo esencial */
  onboardingHTML(){
    const pasos = [
      { hecho:this.state.patient.registrado, texto:'Registrar al paciente',
        accion:'goSettings', btn:'Ir a Ajustes' },
      { hecho:this.state.medications.length > 0, texto:'Añadir el primer medicamento',
        accion:'newMed', btn:'Nuevo medicamento' },
      { hecho:this.state.caregivers.length > 0, texto:'Añadir a quienes cuidan',
        accion:'newCaregiver', btn:'Nuevo cuidador' }
    ];
    if(pasos.every(x => x.hecho)) return '';
    return `<div class="card" style="margin-bottom:18px">
      <b>Primeros pasos</b>
      <p class="muted">La aplicación empieza vacía y no supone nada sobre el paciente.
        Completa estos pasos para ponerla en marcha.</p>
      <ul class="list">
        ${pasos.map(x => `<li>
          <span>${x.hecho ? '<span class="pill">Hecho</span>' : '<span class="pill warn">Pendiente</span>'}
            ${escapeHtml(x.texto)}</span>
          ${x.hecho ? '' : `<button class="btn small" type="button" data-action="${x.accion}">${escapeHtml(x.btn)}</button>`}
        </li>`).join('')}
      </ul>
    </div>`;
  }

  agendaHTML(header=true){
    const rows = this.state.agenda.map(a => {
      const m = this.med(a.medId);
      const st = {pending:'Pendiente', administered:'Administrado', skipped:'Omitido', postponed:'Pospuesto'}[a.status];
      return `<div class="card agenda-card">
        <div class="time">${escapeHtml(a.time)}</div>
        <div>
          <b>${escapeHtml(m.name)}</b>
          <div class="muted">${escapeHtml(m.dose)} ${escapeHtml(m.unit)} · ${escapeHtml(m.route)}</div>
          <div class="status"><span class="pill ${a.status==='pending'?'warn':''}">${st}</span>${a.actual?` · Real: ${new Date(a.actual).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})} · ${escapeHtml(a.responsible)}`:''}<br>${escapeHtml(m.notes||m.indication)}</div>
        </div>
        <div class="actions">${a.status==='pending'
          ? `<button class="btn small" type="button" data-action="admin" data-id="${a.id}">Administrar</button>
             <button class="btn secondary small" type="button" data-action="postpone" data-id="${a.id}">Posponer</button>
             <button class="btn danger small" type="button" data-action="skip" data-id="${a.id}">Omitir</button>`
          : `<button class="btn secondary small" type="button" data-action="undo" data-id="${a.id}">Deshacer</button>`}</div>
      </div>`;
    }).join('');
    const head = header ? this.title('Agenda diaria',
      'Dosis programadas para ' + new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}),
      '<button class="btn secondary" type="button" data-action="resetAgenda">Recrear agenda</button>') : '';
    return head + `<div class="agenda">${rows || '<div class="card empty">Aún no hay medicamentos programados.</div>'}</div>`;
  }

  medsHTML(){
    const rows = this.state.medications.map(m => `<tr>
      <td data-label="Medicamento"><div class="med-row"><div><b>${escapeHtml(m.name)}</b><br><small class="muted">${escapeHtml(m.activeIngredient||'Sin principio activo')}</small>${this.caregiversFor(m.id).length?`<div class="chips mini">${this.caregiversFor(m.id).map(c=>`<span class="chip">${escapeHtml(c.name)}</span>`).join('')}</div>`:''}</div></div></td>
      <td data-label="Dosis">${escapeHtml(m.dose)} ${escapeHtml(m.unit)}</td>
      <td data-label="Pauta">${m.times.map(escapeHtml).join(', ')||'—'}<br>
        <small class="muted">${escapeHtml(MedicationSchedule.describe(m))}</small></td>
      <td data-label="Inventario">${m.stock} <small class="muted">(${escapeHtml(Inventory.daysText(m))})</small></td>
      <td data-label="Estado"><span class="pill ${Inventory.level(m)==='low'?'bad':''}">${m.active?'Activo':'Inactivo'}</span></td>
      <td data-label="Acción"><div class="actions">
        ${MedicationSchedule.onDemand(m) ? `<button class="btn small" type="button" data-action="takeNow" data-id="${m.id}">Registrar toma</button>` : ''}
        <button class="btn secondary small" type="button" data-action="viewMed" data-id="${m.id}">Ver</button>
        <button class="btn secondary small" type="button" data-action="editMed" data-id="${m.id}">Editar</button></div></td>
    </tr>`).join('');

    const galeria = this.state.medications.map(m => {
      const cuidadores = this.caregiversFor(m.id);
      return `<div class="card gcard hover"><div class="gbody">
          <div>
            <b>${escapeHtml(m.name)}</b>
            <div class="muted">${escapeHtml(m.dose)} ${escapeHtml(m.unit)} · ${escapeHtml(m.presentation)}</div>
            <div class="muted" style="font-size:.82rem">${escapeHtml(MedicationSchedule.describe(m))}${m.times.length?' · '+escapeHtml(m.times.join(', ')):''}</div>
          </div>
          <div>
            <span class="pill ${Inventory.level(m)==='low'?'bad':''}">${Inventory.level(m)==='low'?'Stock bajo':'Stock correcto'}</span>
            <span class="pill">${MedicationSchedule.onDemand(m) ? 'Según necesidad'
              : MedicationSchedule.appliesOn(m) ? 'Hoy toca' : 'Hoy no toca'}</span>
          </div>
          ${cuidadores.length ? `<div class="chips mini">${cuidadores.map(c=>`<span class="chip">${escapeHtml(c.name)}</span>`).join('')}</div>` : ''}
          <div class="actions">
            ${MedicationSchedule.onDemand(m) ? `<button class="btn small" type="button" data-action="takeNow" data-id="${m.id}">Registrar toma</button>` : ''}
            <button class="btn secondary small" type="button" data-action="viewMed" data-id="${m.id}">Ver ficha</button>
            <button class="btn secondary small" type="button" data-action="editMed" data-id="${m.id}">Editar</button>
          </div>
        </div>
      </div>`;
    }).join('');

    const esGaleria = this.state.settings.medView === 'galeria';
    const vista = esGaleria
      ? `<div class="grid gallery" id="medRows">${galeria || '<div class="card empty">Aún no hay medicamentos.</div>'}</div>`
      : `<div class="card table-wrap"><table class="table">
          <caption class="sr-only">Lista de medicamentos</caption>
          <thead><tr><th>Medicamento</th><th>Dosis</th><th>Pauta</th><th>Inventario</th><th>Estado</th><th><span class="sr-only">Acciones</span></th></tr></thead>
          <tbody id="medRows">${rows}</tbody>
        </table></div>`;

    return this.title('Tratamiento', 'Medicamentos, horarios e inventario en un solo lugar.',
      '<button class="btn" type="button" data-action="newMed">+ Nuevo medicamento</button>') + `
      <div class="toolbar">
        <label class="sr-only" for="medSearch">Buscar medicamento</label>
        <input class="input search" id="medSearch" type="search" placeholder="Buscar medicamento o principio activo">
        <div class="seg" role="group" aria-label="Forma de ver los medicamentos">
          <button type="button" data-action="viewMode" data-id="tabla"   aria-pressed="${!esGaleria}">Tabla</button>
          <button type="button" data-action="viewMode" data-id="galeria" aria-pressed="${esGaleria}">Galería</button>
        </div>
      </div>
      ${vista}`;
  }

  inventoryHTML(){
    const rows = this.state.medications.map(m => `<tr>
      <td data-label="Medicamento"><div class="med-row"><b>${escapeHtml(m.name)}</b></div></td>
      <td data-label="Restante"><b>${m.stock}</b> unidades</td>
      <td data-label="Consumo">${MedicationSchedule.onDemand(m) ? '—' : (Math.round(MedicationSchedule.dosesPerDay(m)*100)/100) + '/día'}<br>
        <small class="muted">${escapeHtml(MedicationSchedule.describe(m))}</small></td>
      <td data-label="Duración">${escapeHtml(Inventory.daysText(m))}</td>
      <td data-label="Vencimiento">${escapeHtml(m.expiry)||'—'}</td>
      <td data-label="Alerta">${Inventory.level(m)==='low' ? '<span class="pill bad">Stock bajo</span>' : '<span class="pill">Correcto</span>'}</td>
      <td data-label="Acción"><button class="btn secondary small" type="button" data-action="stock" data-id="${m.id}">Ajustar</button></td>
    </tr>`).join('');
    return `<div class="card table-wrap"><table class="table">
      <caption class="sr-only">Inventario de medicamentos</caption>
      <thead><tr><th>Medicamento</th><th>Restante</th><th>Consumo</th><th>Duración</th><th>Vencimiento</th><th>Alerta</th><th><span class="sr-only">Acciones</span></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }

  /* Ambas listas se paginan con el MISMO tamaño de página: antes una
     mostraba 10 y la otra 4, así que las tarjetas quedaban descompensadas
     y el resto de registros era inaccesible. */
  symptomsHTML(){
    const buttons = `<div class="actions">
      <button class="btn secondary" type="button" data-action="rescue">+ Dosis de rescate</button>
      <button class="btn" type="button" data-action="symptom">+ Registrar síntomas</button></div>`;
    return this.title('Registro clínico', 'Síntomas, rescates e historial en un solo lugar.', buttons) + `
      <div class="grid two">
        <div class="card rec-card"><b>Registros recientes</b><div id="symptomsBody">${this.symptomsBodyHTML()}</div></div>
        <div class="card rec-card"><b>Medicación de rescate</b><div id="rescuesBody">${this.rescuesBodyHTML()}</div></div>
      </div>`;
  }

  symptomsBodyHTML(){
    const PER = 5;
    const list = this.state.symptoms;
    const paginas = Math.max(1, Math.ceil(list.length / PER));
    this.symPage = Math.min(Math.max(this.symPage || 0, 0), paginas - 1);
    const desde = this.symPage * PER;
    const trozo = list.slice(desde, desde + PER);
    const rows = trozo.map(s =>
      `<li><div><b>${new Date(s.date).toLocaleString('es-CO')}</b><br><span class="muted">Dolor ${escapeHtml(s.pain)}/10 · T° ${escapeHtml(s.temp)||'—'} °C · ${escapeHtml(s.notes)||'Sin observaciones'}</span></div><span class="pill ${+s.pain>=7?'bad':''}">${+s.pain>=7?'Atención':'Registrado'}</span></li>`
    ).join('') || '<li class="empty">Aún no se han registrado síntomas.</li>';
    return `<ul class="list">${rows}</ul>` + this.pagerHTML({ page:this.symPage, paginas, desde,
      mostrados:trozo.length, total:list.length, per:PER, accion:'sym', que:'de los registros' });
  }

  rescuesBodyHTML(){
    const PER = 5;
    const list = this.state.rescues;
    const paginas = Math.max(1, Math.ceil(list.length / PER));
    this.rescPage = Math.min(Math.max(this.rescPage || 0, 0), paginas - 1);
    const desde = this.rescPage * PER;
    const trozo = list.slice(desde, desde + PER);
    const rows = trozo.map(x =>
      `<li><div><b>${escapeHtml(x.medication)}</b> · ${escapeHtml(x.amount)}<br><span class="muted">${escapeHtml(x.reason)} — ${escapeHtml(x.result)||'sin resultado'}</span></div><small>${new Date(x.date).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}</small></li>`
    ).join('') || '<li class="empty">Sin dosis de rescate.</li>';
    return `<ul class="list">${rows}</ul>` + this.pagerHTML({ page:this.rescPage, paginas, desde,
      mostrados:trozo.length, total:list.length, per:PER, accion:'resc', que:'de los rescates' });
  }

  symGo(n){
    this.symPage = (this.symPage || 0) + n;
    const el = document.getElementById('symptomsBody');
    if(el) el.innerHTML = this.symptomsBodyHTML();
    this.announce(`Registros recientes, página ${this.symPage + 1}`);
  }
  rescGo(n){
    this.rescPage = (this.rescPage || 0) + n;
    const el = document.getElementById('rescuesBody');
    if(el) el.innerHTML = this.rescuesBodyHTML();
    this.announce(`Medicación de rescate, página ${this.rescPage + 1}`);
  }

  /* Buscador fuera del bloque que se repinta: así el foco no se pierde
     al escribir. Solo #historyBody se vuelve a dibujar. */
  historyHTML(){
    return `<div class="toolbar"><label class="sr-only" for="historySearch">Buscar en historial</label>
        <input class="input search" id="historySearch" type="search" placeholder="Buscar en historial"
          value="${escapeHtml(this.histQuery || '')}"></div>
      <div class="card" id="historyBody">${this.historyBodyHTML()}</div>`;
  }
  renderHistory(){
    const el = document.getElementById('historyBody');
    if(el) el.innerHTML = this.historyBodyHTML();
  }
  /* La búsqueda filtra TODO el historial, no solo la página visible;
     por eso se filtra y pagina aquí y no ocultando filas ya pintadas. */
  historyBodyHTML(){
    const PER = 8;
    // Cada dosis ya queda registrada al administrarla u omitirla: no se
    // vuelve a mezclar la agenda, que duplicaba todas las entradas del día.
    const todo = [...this.state.history].sort((a,b)=>b.date.localeCompare(a.date));
    const q = (this.histQuery || '').trim().toLowerCase();
    const list = q
      ? todo.filter(x => `${x.text} ${x.type}`.toLowerCase().includes(q))
      : todo;

    const paginas = Math.max(1, Math.ceil(list.length / PER));
    this.histPage = Math.min(Math.max(this.histPage || 0, 0), paginas - 1);
    const desde = this.histPage * PER;
    const trozo = list.slice(desde, desde + PER);

    const rows = trozo.map(x =>
      `<li><div><b>${escapeHtml(x.text)}</b><br><small class="muted">${new Date(x.date).toLocaleString('es-CO')}</small></div><span class="pill">${escapeHtml(x.type)}</span></li>`
    ).join('') || `<li class="empty">${q ? 'Ningún evento coincide con la búsqueda.' : 'No hay eventos aún.'}</li>`;

    const pager = this.pagerHTML({ page:this.histPage, paginas, desde,
      mostrados:trozo.length, total:list.length, per:PER, accion:'hist', que:'del historial' });

    return `<ul class="list" id="historyRows">${rows}</ul>${pager}`;
  }

  /* Paginador reutilizable (historial, síntomas, rescates). Se oculta
     por completo cuando todo cabe en una página. */
  pagerHTML({ page, paginas, desde, mostrados, total, per, accion, que }){
    if(total <= per) return '';
    return `<div class="pager">
        <button class="btn secondary small" type="button" data-action="${accion}Prev"
          ${page === 0 ? 'disabled' : ''} aria-label="Página anterior ${que}">${svgIcon('left', 16)} Anterior</button>
        <span class="pager-info">${desde + 1}–${desde + mostrados} de ${total}</span>
        <button class="btn secondary small" type="button" data-action="${accion}Next"
          ${page >= paginas - 1 ? 'disabled' : ''} aria-label="Página siguiente ${que}">Siguiente ${svgIcon('right', 16)}</button>
      </div>`;
  }
  histGo(n){
    this.histPage = (this.histPage || 0) + n;
    this.renderHistory();
    this.announce(`Historial, página ${this.histPage + 1}`);
    document.getElementById('historyBody')?.scrollIntoView({ block:'nearest' });
  }

  /* ============================================================
     RESUMEN POR DÍA (calendario)
     Fuente única: state.history, donde YA se registran todos los
     eventos (medicación, síntomas, rescates, avisos, inventario,
     cuidadores, configuración) con su fecha ISO y su tipo. Se elige
     un día en el calendario y se ve, en línea de tiempo, qué pasó.
     ============================================================ */
  /* Clasifica un evento del historial en un tipo visual coherente. */
  kindMeta(h){
    const t = h.type, x = h.text || '';
    if(t === 'medicación') return /omit/i.test(x)
      ? { icon:'alert',  sev:'bad',   label:'Omitido',       key:'skip',    dot:'bad'  }
      : { icon:'check',  sev:'good',  label:'Administrado',  key:'admin',   dot:'good' };
    if(t === 'síntomas')   return { icon:'heart',  sev:'warn',  label:'Síntomas',      key:'symptom', dot:'warn' };
    if(t === 'rescate')    return { icon:'rescue', sev:'bad',   label:'Rescate',       key:'rescue',  dot:'bad'  };
    if(t === 'aviso')      return { icon:'send',   sev:'muted', label:'Aviso',         key:'notice',  dot:''     };
    if(t === 'inventario') return { icon:'box',    sev:'muted', label:'Inventario',    key:'other',   dot:''     };
    if(t === 'cuidador')   return { icon:'user',   sev:'muted', label:'Cuidador',      key:'other',   dot:''     };
    return                        { icon:'gear',   sev:'muted', label:'Configuración', key:'other',   dot:''     };
  }
  /* Agrupa el historial por día local (YYYY-MM-DD). */
  eventsByDay(){
    const by = {};
    for(const h of this.state.history){
      const d = isoDate(new Date(h.date));
      (by[d] = by[d] || []).push(h);
    }
    return by;
  }
  /* Contenedor estable: renderCalendar() solo reemplaza su interior. */
  calendarSection(){ return `<div id="calWrap" class="cal">${this.calendarInner()}</div>`; }
  renderCalendar(){ const w = document.getElementById('calWrap'); if(w) w.innerHTML = this.calendarInner(); }
  shiftMonth(n){
    const [y, mo] = this.calMonth.split('-').map(Number);
    const d = new Date(y, mo - 1 + n, 1);
    this.calMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    this.renderCalendar();
  }
  selectDay(iso){ this.calDay = iso; this.calMonth = iso.slice(0,7); this.renderCalendar(); }

  calendarInner(){
    if(!this.calDay)   this.calDay   = isoDate();
    if(!this.calMonth) this.calMonth = this.calDay.slice(0,7);
    const by = this.eventsByDay();

    /* --- Rejilla del mes (lunes primero) --- */
    const [y, mo] = this.calMonth.split('-').map(Number);
    const first   = new Date(y, mo - 1, 1);
    const offset  = (first.getDay() + 6) % 7;            // 0=lunes
    const total   = new Date(y, mo, 0).getDate();
    const hoy     = isoDate();
    const dow     = ['L','M','X','J','V','S','D'];
    const mesNom  = first.toLocaleDateString('es-CO', { month:'long', year:'numeric' });
    const mesCap  = mesNom.charAt(0).toUpperCase() + mesNom.slice(1);

    let celdas = '';
    for(let i = 0; i < offset; i++)
      celdas += '<span class="cal-cell empty" aria-hidden="true"></span>';
    for(let d = 1; d <= total; d++){
      const iso  = `${this.calMonth}-${String(d).padStart(2,'0')}`;
      const evs  = by[iso] || [];
      const sel  = iso === this.calDay;
      const esHoy = iso === hoy;
      let dotCls = '';
      if(evs.length){
        const dots = evs.map(e => this.kindMeta(e).dot);
        dotCls = dots.includes('bad') ? 'bad' : dots.includes('warn') ? 'warn' : dots.includes('good') ? 'good' : '';
      }
      const dot   = evs.length ? `<span class="dot ${dotCls}"></span>` : '';
      const aria  = `${d} de ${mesNom}: ${evs.length ? evs.length + (evs.length === 1 ? ' registro' : ' registros') : 'sin registros'}`;
      celdas += `<button class="cal-cell${sel ? ' sel' : ''}${esHoy ? ' today' : ''}" type="button"
        data-action="calDay" data-id="${iso}"${sel ? ' aria-current="date"' : ''} aria-label="${aria}">${d}${dot}</button>`;
    }

    const panel = `<div class="cal-panel">
      <div class="cal-head">
        <span class="cal-title">${escapeHtml(mesCap)}</span>
        <span class="cal-nav">
          <button type="button" data-action="calPrev" aria-label="Mes anterior">${svgIcon('left', 18)}</button>
          <button type="button" data-action="calNext" aria-label="Mes siguiente">${svgIcon('right', 18)}</button>
        </span>
      </div>
      <div class="cal-grid">
        ${dow.map(d => `<span class="cal-dow">${d}</span>`).join('')}
        ${celdas}
      </div>
    </div>`;

    return panel + this.daySummaryHTML(by[this.calDay] || []);
  }

  daySummaryHTML(eventos){
    const evs = eventos.slice().sort((a, b) => a.date.localeCompare(b.date)); // mañana → noche
    const fecha = prettyDate(this.calDay);
    const fechaCap = fecha.charAt(0).toUpperCase() + fecha.slice(1);

    /* Resumen en píldoras (solo las categorías con eventos) */
    const c = { admin:0, skip:0, symptom:0, rescue:0 };
    evs.forEach(e => { const k = this.kindMeta(e).key; if(k in c) c[k]++; });
    const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
    const chips = [];
    if(c.admin)   chips.push(`<span class="pill">${plural(c.admin, 'administrada', 'administradas')}</span>`);
    if(c.skip)    chips.push(`<span class="pill bad">${plural(c.skip, 'omitida', 'omitidas')}</span>`);
    if(c.symptom) chips.push(`<span class="pill warn">${plural(c.symptom, 'síntoma', 'síntomas')}</span>`);
    if(c.rescue)  chips.push(`<span class="pill bad">${plural(c.rescue, 'rescate', 'rescates')}</span>`);

    const items = evs.map(e => {
      const m = this.kindMeta(e);
      const hora = new Date(e.date).toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
      return `<div class="tl-item">
        <span class="tl-ic ${m.sev}">${svgIcon(m.icon, 18)}</span>
        <div class="tl-body">
          <div class="tl-meta"><span class="tl-time">${hora}</span><span class="tl-kind">${escapeHtml(m.label)}</span></div>
          <div class="tl-text">${escapeHtml(e.text)}</div>
        </div>
      </div>`;
    }).join('');

    return `<div class="day">
      <div class="day-head">
        <div>
          <p class="day-date">${escapeHtml(fechaCap)}</p>
          <p class="day-count">${plural(evs.length, 'registro', 'registros')}</p>
        </div>
        ${chips.length ? `<div class="day-chips">${chips.join('')}</div>` : ''}
      </div>
      ${evs.length
        ? `<div class="tl">${items}</div>`
        : '<p class="empty">Sin registros este día. Elige otra fecha marcada con un punto en el calendario.</p>'}
    </div>`;
  }

  /* --- Ajustes · Perfil cifrado compartido ------------------- */
  profileHTML(){

      new Date(this.state.updatedAt || 0).getTime() > Profile.when(pub);
    return `
      <div class="card">
        <b>Perfil compartido entre dispositivos</b>
        <div class="sec-state">
          <span class="dot-state ${enPerfil?'on':''}" aria-hidden="true"></span>
          <span>${enPerfil
            ? 'Perfil cifrado activo · la clave protege el acceso en cualquier navegador'
            : 'Solo este navegador · los datos no se comparten'}</span>
        </div>

        ${enPerfil ? `
          <ul class="list" style="margin-top:8px">
            <li><span>Última publicación</span><b>${pub ? new Date(pub.createdAt).toLocaleString('es-CO') : 'Sin publicar todavía'}</b></li>
            <li><span>Último cambio en este equipo</span><b>${this.state.updatedAt ? new Date(this.state.updatedAt).toLocaleString('es-CO') : '—'}</b></li>
          </ul>
          ${cambios ? '<div class="alert">Hay cambios sin publicar. Los demás dispositivos aún no los ven.</div>' : ''}
          <div class="actions" style="margin-top:14px">
            <button class="btn" type="button" data-action="publishProfile">Generar perfil.json</button>
            ${pub ? '<button class="btn secondary" type="button" data-action="loadPublished">Cargar el perfil publicado</button>' : ''}
            <button class="btn secondary" type="button" data-action="changeKey">Cambiar la clave</button>
            <button class="btn secondary" type="button" data-action="lockNow">Bloquear ahora</button>
          </div>
          <p class="muted" style="font-size:.82rem;margin-top:14px">
            Para que los demás vean los cambios: pulsa <b>Generar perfil.json</b>, reemplaza el archivo
            del repositorio con el que se descarga y súbelo. Mientras tanto, este navegador guarda los
            cambios en una copia cifrada con tu misma clave.</p>
        ` : `
          <p class="muted">Publica un perfil cifrado para tener la misma información en todos los
            dispositivos y que la aplicación pida clave en cualquier navegador. El archivo se sube al

          una frase larga, no una palabra.</p>
      </div>`;
