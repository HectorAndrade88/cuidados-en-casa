      <td data-label="Medicamento"><div class="med-row"><img class="thumb" src="${safeImage(m.photo)}" alt=""><div><b>${escapeHtml(m.name)}</b><br><small class="muted">${escapeHtml(m.activeIngredient||'Sin principio activo')}</small>${this.caregiversFor(m.id).length?`<div class="chips mini">${this.caregiversFor(m.id).map(c=>`<span class="chip">${escapeHtml(c.name)}</span>`).join('')}</div>`:''}</div></div></td>
      <td data-label="Dosis">${escapeHtml(m.dose)} ${escapeHtml(m.unit)}</td>
      <td data-label="Pauta">${m.times.map(escapeHtml).join(', ')||'—'}<br>
        <small class="muted">${escapeHtml(MedicationSchedule.describe(m))}</small></td>
      <td data-label="Inventario">${m.stock} <small class="muted">(${escapeHtml(Inventory.daysText(m))})</small></td>
      <td data-label="Estado"><span class="pill ${Inventory.level(m)==='low'?'bad':''}">${m.active?'Activo':'Inactivo'}</span></td>
      <td data-label="Acción"><div class="actions">
        ${MedicationSchedule.onDemand(m) ? `<button class="btn small" type="button" data-action="takeNow" data-id="${m.id}">Registrar toma</button>` : ''}
        <button class="btn secondary small" type="button" data-action="viewMed" data-id="${m.id}">Ver</button>
        <button class="btn secondary small" type="button" data-action="editMed" data-id="${m.id}">Editar</button></div></td>
    </tr>`).join('');

    const galeria = this.state.medications.map(m => {
      const cuidadores = this.caregiversFor(m.id);
      return `<div class="card gcard hover">
        <img src="${safeImage(m.photo)}" alt="Foto de ${escapeHtml(m.name)}"
             data-action="viewPhoto" data-id="${m.id}" tabindex="0" role="button">

          <tbody id="medRows">${rows}</tbody>

    return this.title('Tratamiento', 'Medicamentos, horarios e inventario en un solo lugar.',

        <label class="sr-only" for="medSearch">Buscar medicamento</label>

  inventoryHTML(){

      <td data-label="Medicamento"><div class="med-row"><img class="thumb" src="${safeImage(m.photo)}" alt=""><b>${escapeHtml(m.name)}</b></div></td>
      <td data-label="Restante"><b>${m.stock}</b> unidades</td>
      <td data-label="Consumo">${MedicationSchedule.onDemand(m) ? '—' : (Math.round(MedicationSchedule.dosesPerDay(m)*100)/100) + '/día'}<br>

  symptomsHTML(){
    const rows = this.state.symptoms.slice(0,10).map(s =>
      `<li><div><b>${new Date(s.date).toLocaleString('es-CO')}</b><br><span class="muted">Dolor ${escapeHtml(s.pain)}/10 · T° ${escapeHtml(s.temp)||'—'} °C · ${escapeHtml(s.notes)||'Sin observaciones'}</span></div><span class="pill ${+s.pain>=7?'bad':''}">${+s.pain>=7?'Atención':'Registrado'}</span></li>`
    ).join('') || '<li class="empty">Aún no se han registrado síntomas.</li>';
    const rescue = this.state.rescues.slice(0,4).map(x =>
      `<li><div><b>${escapeHtml(x.medication)}</b> · ${escapeHtml(x.amount)}<br><span class="muted">${escapeHtml(x.reason)} — ${escapeHtml(x.result)||'sin resultado'}</span></div><small>${new Date(x.date).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}</small></li>`

  historyHTML(){

    const merged = [...this.state.history].sort((a,b)=>b.date.localeCompare(a.date));

      `<li><div><b>${escapeHtml(x.text)}</b><br><small class="muted">${new Date(x.date).toLocaleString('es-CO')}</small></div><span class="pill">${escapeHtml(x.type)}</span></li>`

  /* --- Ajustes · Perfil cifrado compartido ------------------- */
  profileHTML(){

        ${enPerfil ? `
          <ul class="list" style="margin-top:8px">

            <li><span>Último cambio en este equipo</span><b>${this.state.updatedAt ? new Date(this.state.updatedAt).toLocaleString('es-CO') : '—'}</b></li>
          </ul>

            cambios en una copia cifrada con tu misma clave.</p>
        ` : `
          <p class="muted">Publica un perfil cifrado para tener la misma información en todos los
            dispositivos y que la aplicación pida clave en cualquier navegador. El archivo se sube al

          <div class="actions" style="margin-top:12px">
            <button class="btn" type="button" data-action="publishProfile" ${SECURE?'':'disabled'}>Crear perfil cifrado</button>
          </div>
        `}

        <p class="muted" style="font-size:.82rem;margin-top:14px">
          Sé consciente del riesgo: el archivo es público, así que alguien puede descargarlo e intentar
          adivinar la clave sin conexión. Por eso se exigen 12 caracteres como mínimo y conviene usar
          una frase larga, no una palabra.</p>

  /* --- Ajustes · Seguridad ---------------------------------- */
  securityHTML(){
    if(this.mode === 'perfil'){
      const min = this.autolockMinutes();
      const opciones = [[0,'Nunca'],[1,'1 minuto'],[5,'5 minutos'],[15,'15 minutos'],[30,'30 minutos']];
      return `
        <div class="card">
          <b>Seguridad</b>
          <div class="sec-state">
            <span class="dot-state on" aria-hidden="true"></span>
            <span>Datos cifrados en reposo con la clave de acceso</span>
          </div>
          <p class="muted">Nada se guarda legible en este navegador: la copia local va cifrada con
            AES-GCM y la clave solo existe en memoria mientras la sesión está abierta. Al bloquear,
            los datos descifrados se descartan.</p>
          <label class="switch" style="margin-top:14px">
            <span>Bloquear tras inactividad</span>
            <select class="input" id="autolock" style="max-width:170px">
              ${opciones.map(([v,t]) => `<option value="${v}" ${min===v?'selected':''}>${t}</option>`).join('')}
            </select>
          </label>
          <div class="actions" style="margin-top:14px">
            <button class="btn secondary" type="button" data-action="lockNow">Bloquear ahora</button>
          </div>
        </div>`;
    }
    const activo = this.pin.enabled();
    const min = +this.state.settings.autolock || 0;
    const opciones = [[0,'Nunca'],[1,'1 minuto'],[5,'5 minutos'],[15,'15 minutos'],[30,'30 minutos']];
    return `
      <div class="card">
        <b>Seguridad</b>
        <div class="sec-state">
          <span class="dot-state ${activo?'on':''}" aria-hidden="true"></span>
          <span>${activo ? 'Bloqueo con PIN activado' : 'Bloqueo con PIN desactivado'}</span>
        </div>
        <p class="muted">El PIN protege el acceso a la información en este dispositivo.
          No se guarda en ningún sitio: solo una huella PBKDF2-SHA256 con sal, imposible de revertir.</p>
        ${SECURE ? '' : `<div class="alert bad"><b>Funciones de seguridad no disponibles</b><br>
          <small>Has abierto el archivo directamente (file://). El PIN y el respaldo cifrado necesitan
          https:// o localhost. Publica el sitio en GitHub Pages o ábrelo con un servidor local.</small></div>`}
        <div class="actions" style="margin-top:12px">
          ${activo
            ? `<button class="btn secondary" type="button" data-action="changePin" ${SECURE?'':'disabled'}>Cambiar PIN</button>
               <button class="btn secondary" type="button" data-action="lockNow">Bloquear ahora</button>
               <button class="btn danger" type="button" data-action="removePin">Quitar PIN</button>`
            : `<button class="btn" type="button" data-action="setPin" ${SECURE?'':'disabled'}>Activar bloqueo con PIN</button>`}
        </div>
        <label class="switch" style="margin-top:14px">
          <span>Bloquear tras inactividad</span>
          <select class="input" id="autolock" style="max-width:170px" ${activo?'':'disabled'}>
            ${opciones.map(([v,t]) => `<option value="${v}" ${min===v?'selected':''}>${t}</option>`).join('')}
          </select>
        </label>
        <p class="muted" style="font-size:.82rem;margin-top:12px">
          Qué protege y qué no: el PIN impide que alguien con acceso al equipo vea la información desde la app,
          y el respaldo sale siempre cifrado. Los datos guardados en el navegador quedan sin cifrar,
          así que en un equipo compartido conviene usar además el bloqueo de sesión del sistema operativo.</p>
      </div>`;
  }

  /* --- Ajustes · Datos y respaldo --------------------------- */
  backupHTML(){
    const usado = this.store.usedBytes();
    const pct = Math.min(100, Math.round(usado / (5 * 1024 * 1024) * 100));
    const fotos = this.state.medications.reduce((n,m) => n + ImageTools.bytes(m.photo), 0);
    const copias = this.store.snapshots();
    const last = this.state.settings.lastBackup;
    return `
      <div class="card">
        <b>Datos y respaldo</b>
        <p class="muted">Todo se guarda en este navegador; no hay servidor ni base de datos externa.
          El archivo de respaldo sale siempre cifrado con la contraseña que elijas.</p>

        <ul class="list" style="margin-top:8px">
          <li><span>Espacio ocupado</span><b>${this.formatBytes(usado)} <small class="muted">(~${pct} % del límite)</small></b></li>
          <li><span>De ello, fotos</span><b>${this.formatBytes(fotos)}</b></li>
          <li><span>Último respaldo descargado</span><b>${last ? new Date(last).toLocaleString('es-CO') : 'Nunca'}</b></li>
        </ul>
        <div class="meter ${pct<60?'ok':pct<85?'mid':''}" aria-hidden="true"><i style="width:${pct}%"></i></div>

        <div class="actions" style="margin-top:16px">
          <button class="btn" type="button" data-action="exportJSON" ${SECURE?'':'disabled'}>Descargar respaldo cifrado</button>
          <button class="btn secondary" type="button" data-action="import">Restaurar respaldo</button>
          <button class="btn secondary" type="button" data-action="loadDemo">Cargar datos de ejemplo</button>
          <button class="btn danger" type="button" data-action="reset">Vaciar todo</button>
        </div>

        <div style="margin-top:20px" ${this.mode === 'perfil' ? 'hidden' : ''}>
          <b>Copias automáticas en este navegador</b>
          <p class="muted" style="font-size:.84rem">Copia del estado anterior y hasta 5 copias diarias.
            Las diarias se guardan sin fotos para ocupar poco espacio.</p>
          <ul class="list">
            ${this.store.previous() ? `<li><span>Estado anterior <small class="muted">(completo, con fotos)</small></span>
              <button class="btn secondary small" type="button" data-action="restorePrev">Restaurar</button></li>` : ''}
            ${copias.length ? copias.map((c,i) => `<li>
                <span>${new Date(c.at).toLocaleString('es-CO')} <small class="muted">(${this.formatBytes(c.data.length*2)}, sin fotos)</small></span>
                <button class="btn secondary small" type="button" data-action="restoreSnap" data-id="${i}">Restaurar</button></li>`).join('')
              : '<li class="empty">Aún no hay copias diarias.</li>'}
          </ul>
        </div>
      </div>`;
  }

  formatBytes(n){
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
    return (n/1024/1024).toFixed(2) + ' MB';
  }

  /* --- Enlazado de eventos tras cada render --- */
  bind(){
    const main = document.getElementById('main');
    main.onclick = e => this.action(e);

    // Buscadores en vivo
    const filter = (input, selector) => {
      if(!input) return;
      input.oninput = () => {
        const q = input.value.toLowerCase();
        document.querySelectorAll(selector).forEach(r => r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none');
      };
    };
    filter(document.getElementById('medSearch'), '#medRows > *');
    filter(document.getElementById('historySearch'), '#historyRows li');

    // Formulario del paciente (submit accesible en vez de botón suelto)
    const pf = document.getElementById('patientForm');
    if(pf) pf.onsubmit = e => { e.preventDefault(); this.savePatient(); };

    // Tiempo de autobloqueo
    const al = document.getElementById('autolock');
    if(al) al.onchange = () => {
      this.state.settings.autolock = +al.value;
      this.save(); this.touch();
      toast(+al.value ? `Se bloqueará tras ${al.options[al.selectedIndex].text.toLowerCase()} sin actividad.` : 'Autobloqueo desactivado.');
    };

    // Activar con Enter/Espacio las fotos que abren el visor
    document.querySelectorAll('[data-action="viewPhoto"]').forEach(img => {
      img.onkeydown = e => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); this.photoViewer(img.dataset.id); }
      };
    });

    // Interruptores de ajustes
    document.querySelectorAll('[data-setting]').forEach(x => x.onchange = () => {
      this.state.settings[x.dataset.setting] = x.checked;
      if(x.dataset.setting==='notifications' && x.checked && 'Notification' in window && Notification.permission==='default')
        Notification.requestPermission();
      this.save(); this.applySettings();
    });
  }

  /* --- Enrutado de acciones (delegación) --- */
  action(e){
    const b = e.target.closest('[data-action]'); if(!b) return;
    const a = b.dataset.action, id = b.dataset.id;
    switch(a){
      case 'admin': case 'skip': case 'postpone': case 'undo': return this.dose(a, id);
      case 'newMed': return this.medDialog();
      case 'editMed': return this.medDialog(this.med(id));
      case 'stock': return this.stockDialog(this.med(id));
      case 'symptom': return this.symptomDialog();
      case 'rescue': return this.rescueDialog();
      case 'newCaregiver': return this.caregiverDialog();
      case 'editCaregiver': return this.caregiverDialog(this.caregiver(id));
      case 'delCaregiver': return this.deleteCaregiver(id);
      case 'takeNow': return this.takeDose(id);
      case 'viewMed': return this.medDetail(id);
      case 'viewPhoto': return this.photoViewer(id);
      case 'viewMode':
        this.state.settings.medView = id;
        this.save(); return this.render();
      case 'publishProfile': return this.publishProfile(false);
      case 'changeKey': return this.publishProfile(true);
      case 'loadPublished': return this.loadPublished();
      case 'setPin': case 'changePin': return this.pinDialog(a === 'changePin');
      case 'removePin': return this.removePin();
      case 'lockNow': return this.lock();
      case 'exportJSON': return this.exportBackup();
      case 'exportCSV': return this.exportCSV();
      case 'import': return document.getElementById('importFile').click();
      case 'restorePrev': return this.restorePrevious();
      case 'restoreSnap': return this.restoreSnapshot(+id);
      case 'reset': return this.resetData();
      case 'loadDemo': return this.loadDemo();
      case 'goSettings': return this.go('settings');
      case 'resetAgenda':
        this.state.agenda = MedicationSchedule.today(this.state.medications);
        this.state.agendaDate = isoDate();
        this.save(); this.render();
        return toast(this.state.agenda.length
          ? 'Agenda recreada con lo que toca hoy.'
          : 'Hoy no corresponde ningún medicamento según las pautas.', 'good');
    }
  }

  /* --- Acciones sobre dosis (con diálogos accesibles) --- */
  async dose(action, id){
    const a = this.state.agenda.find(x=>x.id===id); if(!a) return;
    const m = this.med(a.medId);
    let aviso = null;
    if(action==='admin'){
      const who = await this.pickResponsible(m);
      if(who===null) return;
      a.status='administered'; a.actual=new Date().toISOString(); a.responsible=who;
      m.stock = Math.max(0, m.stock-1);
      new HistoryManager().add(this.state,'medicación',`${m.name} administrado`,{responsible:who});
      toast(`${m.name} administrado.`, 'good');
      aviso = { a, m, who };   // el aviso se ofrece después de repintar
    } else if(action==='skip'){
      const motivo = await promptDialog({title:'Omitir dosis', label:'Motivo de la omisión', type:'textarea', required:false, placeholder:'Opcional'});
      if(motivo===null) return;
      a.status='skipped'; a.actual=new Date().toISOString(); a.note=motivo;
      new HistoryManager().add(this.state,'medicación',`${m.name} omitido${motivo?': '+motivo:''}`);
      toast(`${m.name} omitido.`);
    } else if(action==='postpone'){
      const t = await promptDialog({title:'Posponer dosis', label:'Nueva hora', type:'time', value:a.time,
        validate:v => RE_TIME.test(v) ? '' : 'Use una hora válida (HH:MM).'});
      if(t===null) return;
      a.time=t; a.status='postponed'; a.note='Pospuesto';
      this.state.agenda.sort((x,y)=>x.time.localeCompare(y.time));
      toast(`Dosis pospuesta a las ${t}.`);
    } else { // undo
      a.status='pending'; a.actual=''; a.responsible='';
    }
    this.save(); this.render();
    if(aviso) this.whatsappNotice(aviso.a, aviso.m, aviso.who);
  }

  /* ============================================================
     AVISO POR WHATSAPP TRAS ADMINISTRAR UNA DOSIS
     Sin API ni credenciales: se construye un enlace wa.me con el
     mensaje ya escrito. Avisa a los cuidadores de ese medicamento
     que tengan celular, excepto a quien acaba de administrarla.
     ============================================================ */
  waMessage(m, a, quien){
    const p = this.state.patient;
    const momento = a.actual
      ? new Date(a.actual).toLocaleString('es-CO', {dateStyle:'short', timeStyle:'short'})
      : new Date().toLocaleString('es-CO');
    return [
      'Cuida · Registro de medicación',
      `Paciente: ${p.name || 'sin registrar'}`,
      `Medicamento: ${m.name} ${m.dose} ${m.unit} (${m.route})`,
      `Hora programada: ${a.time}`,
      `Administrado: ${momento}`,
      `Responsable: ${quien}`,
      m.notes ? `Nota: ${m.notes}` : ''
    ].filter(Boolean).join('\n');
  }

  /* Destinatarios: primero los responsables del medicamento */
  waRecipients(m, quien){
    const conTel = c => Phone.valid(c.phone) && c.name !== quien;
    const asignados = this.caregiversFor(m.id).filter(conTel);
    const otros = this.state.caregivers.filter(c => conTel(c) && !asignados.includes(c));
    return { asignados, otros };
  }

  whatsappNotice(a, m, quien){
    if(this.state.settings.whatsapp === false) return;
    const { asignados, otros } = this.waRecipients(m, quien);
    const lista = asignados.concat(otros);
    if(!lista.length) return;

    const texto = this.waMessage(m, a, quien);
    const fila = (c, esResponsable) => `
      <li>
        <span class="car-line">
          <span class="avatar sm" aria-hidden="true">${escapeHtml(this.initials(c.name))}</span>
          <span>
            <b>${escapeHtml(c.name)}</b>
            ${esResponsable ? '<span class="pill" style="margin-left:6px">A cargo</span>' : ''}
            <br><small class="muted">${escapeHtml(c.role)} · ${escapeHtml(Phone.pretty(c.phone))}</small>
          </span>
        </span>
        <a class="btn wa small" target="_blank" rel="noopener noreferrer"
           data-wa="${escapeHtml(c.phone)}" data-name="${escapeHtml(c.name)}"
           href="${escapeHtml(Phone.waLink(c.phone, texto))}"
           aria-label="Avisar a ${escapeHtml(c.name)} por WhatsApp">Enviar</a>
      </li>`;

    Modal.open(`
      <h2 id="dialogTitle">Dosis registrada</h2>
      <p class="muted">${escapeHtml(m.name)} ${escapeHtml(m.dose)} ${escapeHtml(m.unit)} ·
        ${escapeHtml(a.time)} · registrado por ${escapeHtml(quien)}</p>

      <label for="waText" style="display:block;margin-top:14px">Mensaje que se enviará</label>
      <textarea class="input" id="waText" rows="7">${escapeHtml(texto)}</textarea>
      <p class="hint">Se abre WhatsApp con el mensaje ya escrito; el envío lo confirmas tú desde la
        aplicación. Cuida no manda nada por su cuenta ni usa ningún servicio externo.</p>

      <div style="margin-top:18px"><b>Avisar a</b>
        <ul class="list" id="waList">
          ${asignados.map(c => fila(c, true)).join('')}
          ${otros.map(c => fila(c, false)).join('')}
        </ul>
      </div>
      <div class="modal-foot">
        <button class="btn secondary" type="button" data-close>Ahora no</button>
      </div>`);

    // El mensaje es editable: los enlaces se rehacen al escribir
    const caja = document.getElementById('waText');
    const sincronizar = () => Modal.dialog.querySelectorAll('[data-wa]').forEach(el => {
      el.href = Phone.waLink(el.dataset.wa, caja.value);
    });
    caja.oninput = sincronizar;

    // Se deja constancia en el historial de a quién se avisó
    Modal.dialog.querySelectorAll('[data-wa]').forEach(el => el.addEventListener('click', () => {
      new HistoryManager().add(this.state, 'aviso', `${m.name}: aviso de administración enviado a ${el.dataset.name}`);
      this.save();
      toast(`WhatsApp abierto para avisar a ${el.dataset.name}.`, 'good');
      setTimeout(() => { Modal.close(); this.render(); }, 300);
    }));
  }

  /* Toma puntual de un medicamento sin horario: no viene de la agenda,
     así que se registra en el momento, descuenta inventario y avisa igual. */
  async takeDose(id){
    const m = this.med(id); if(!m) return;
    const who = await this.pickResponsible(m);
    if(who === null) return;
    const registro = {
      id:uuid(), medId:m.id, time:new Date().toTimeString().slice(0,5),
      status:'administered', actual:new Date().toISOString(),
      responsible:who, note:'Según necesidad'
    };
    m.stock = Math.max(0, m.stock - 1);
    new HistoryManager().add(this.state, 'medicación',
      `${m.name} administrado según necesidad`, {responsible:who});
    this.save(); this.render();
    toast(`${m.name} registrado. Quedan ${m.stock} en inventario.`, 'good', 6000);
    if(Inventory.level(m) === 'low')
      toast(`Atención: quedan ${m.stock} de ${m.name}, por debajo del mínimo.`, 'bad', 8000);
    this.whatsappNotice(registro, m, who);
  }

        </label>

          <legend>Días de la semana <span class="hint">(marca uno o varios)</span></legend>
          ${MedicationSchedule.DIAS.map((d,i) => `

          <p class="err" data-err="weekdays" role="alert" style="width:100%"></p>

        <label class="full">Indicación<input class="input" name="indication" value="${escapeHtml(m.indication)}"></label>
        <label class="full">Observaciones<textarea class="input" name="notes">${escapeHtml(m.notes)}</textarea></label>
        <div class="full drop" id="drop">
          <p><b>Foto del medicamento</b><br>
            <span class="muted">Arrastra una imagen aquí o selecciónala. Se usa en la portada y en la ficha.</span></p>
          <input type="file" id="photoFile" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" aria-label="Foto del medicamento">
          <p class="hint">JPG, PNG, WEBP, GIF o BMP · máximo 8 MB. Se reduce a 720 px y se eliminan
            los metadatos (EXIF y ubicación) antes de guardarla.</p>
          <p class="err" id="photoErr" role="alert"></p>

        </div>
      </form>

        <button class="btn secondary" type="button" data-close>Cancelar</button>
        <button class="btn" type="submit" form="medForm" id="saveMed">Guardar medicamento</button>
      </div>`, { onOpen:() => {
        // Solo se muestran los campos que la pauta elegida necesita.
        // «Según necesidad» oculta todo lo temporal: no hay fecha ni horario.
        const sel = document.getElementById('patternSel');
        const syncPauta = () => {
          const demanda = sel.value === 'demanda';
          document.getElementById('everyWrap').hidden  = sel.value !== 'cada';
          document.getElementById('weekWrap').hidden   = sel.value !== 'semana';
          document.getElementById('timesWrap').hidden  = demanda;
          document.getElementById('startWrap').hidden  = demanda;
          document.getElementById('endWrap').hidden    = demanda;
          document.getElementById('demandaHint').hidden = !demanda;
        };
        sel.onchange = syncPauta; syncPauta();

        const drop  = document.getElementById('drop');
        const box   = document.getElementById('imgState');
        const errEl = document.getElementById('photoErr');

        /* Muestra la vista previa con su peso real ya comprimido */
        const preview = () => {
          if(!image){ box.innerHTML = ''; return; }
          box.innerHTML = `
            <img class="photo-preview" src="${safeImage(image)}" alt="Vista previa de la foto">
            <p class="photo-meta">Guardada como JPEG · ${ImageTools.kb(image)} KB</p>
            <button class="btn secondary small" type="button" id="photoDel">Quitar foto</button>`;
          document.getElementById('photoDel').onclick = () => { image = ''; errEl.textContent = ''; preview(); };
        };
        preview();

        /* Procesa el archivo: valida, redimensiona y limpia metadatos */
        const load = async f => {
          errEl.textContent = '';
          try{
            const r = await ImageTools.fromFile(f);
            image = r.dataUrl;
            preview();
            toast(`Foto lista: ${r.width}×${r.height} px, ${ImageTools.kb(image)} KB.`, 'good');
          }catch(ex){
            errEl.textContent = ex.message;
          }
        };
        document.getElementById('photoFile').onchange = e => load(e.target.files[0]);
        drop.ondragover  = e => { e.preventDefault(); drop.classList.add('over'); };
        drop.ondragleave = () => drop.classList.remove('over');
        drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); };
      }});

    // Guardado con validación accesible inline
    const form = document.getElementById('medForm');
    const showErr = (name, msg) => {
      const field = form.elements[name], box = form.querySelector(`[data-err="${name}"]`);
      if(box) box.textContent = msg;
      if(field && field.setAttribute) field.setAttribute('aria-invalid', msg ? 'true' : 'false');
    };
    form.onsubmit = e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(form));
      delete f.weekday;               // las casillas se leen aparte
      let firstBad = null;
      ['name','dose','times','everyDays','weekdays','endDate'].forEach(k => showErr(k,''));

      if(!f.name.trim()){ showErr('name','El nombre es obligatorio.'); firstBad ??= 'name'; }
      if(!f.dose.trim()){ showErr('dose','La dosis es obligatoria.'); firstBad ??= 'dose'; }

      // --- Validación de la pauta ---
      const pattern  = ['diaria','cada','semana','demanda'].includes(f.pattern) ? f.pattern : 'diaria';
      const demanda  = pattern === 'demanda';
      // Sin horario de aplicación no se exigen horas: solo se controla el inventario
      const times = demanda ? [] : (f.times || '').split(',').map(x=>x.trim()).filter(Boolean);
      if(!demanda && !(times.length && times.every(x => RE_TIME.test(x)))){
        showErr('times','Use horarios válidos, por ejemplo: 08:00, 20:00.'); firstBad ??= 'times';
      }
      const weekdays = [...form.querySelectorAll('input[name="weekday"]:checked')].map(i => +i.value);
      const cada     = Math.min(60, Math.max(1, +f.everyDays || 1));
      if(pattern === 'cada' && !(+f.everyDays >= 1 && +f.everyDays <= 60)){
        showErr('everyDays','Indica un intervalo entre 1 y 60 días.'); firstBad ??= 'everyDays';
      }
      if(pattern === 'semana' && !weekdays.length){
        showErr('weekdays','Marca al menos un día de la semana.'); firstBad ??= 'pattern';
      }
      if(!demanda && f.endDate && f.startDate && f.endDate < f.startDate){
        showErr('endDate','El fin del tratamiento no puede ser anterior al inicio.'); firstBad ??= 'endDate';
      }
      if(firstBad){ form.elements[firstBad]?.focus?.(); return; }

      Object.assign(m, f);
      m.times = times; m.stock = +f.stock || 0; m.minStock = +f.minStock || 0; m.photo = image;
      m.pattern   = pattern;
      m.everyDays = cada;
      m.weekdays  = weekdays;
      // Según necesidad: sin fecha de aplicación ni fin programado
      m.startDate = demanda ? '' : (f.startDate || isoDate());
      m.endDate   = demanda ? '' : (f.endDate || '');
      if(!edit) this.state.medications.push(m);
      // Se recalcula la agenda conservando las dosis ya registradas hoy
      this.state.agenda = MedicationSchedule.merge(
        this.state.agenda, MedicationSchedule.today(this.state.medications));
      this.state.agendaDate = isoDate();
      new HistoryManager().add(this.state,'configuración',
        `${m.name} ${edit?'actualizado':'creado'} · ${MedicationSchedule.describe(m)}`);
      this.save(); Modal.close(); this.render();
      toast(`${m.name} ${edit?'actualizado':'creado'}. ${MedicationSchedule.describe(m)}.`, 'good', 6000);
    };
  }

  pickResponsible(m){
    return new Promise(resolve => {
      const list = this.state.caregivers;

      const others = list.filter(c=>!c.medIds.includes(m.id));
      const opt = c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}${c.role?' · '+escapeHtml(c.role):''}</option>`;
      const groups =
        (assigned.length ? `<optgroup label="Responsables de ${escapeHtml(m.name)}">${assigned.map(opt).join('')}</optgroup>` : '') +
        (others.length ? `<optgroup label="Otros cuidadores">${others.map(opt).join('')}</optgroup>` : '');
      Modal.open(`
        <h2 id="dialogTitle">Registrar administración</h2>
        <p class="muted">${escapeHtml(m.name)} · ${escapeHtml(m.dose)} ${escapeHtml(m.unit)}</p>
        <form id="admForm" novalidate>
          <label for="admWho">Responsable de la administración</label>
          <select class="input" id="admWho" name="who">
            ${groups}
            <option value="__custom__">Otro/a (escribir)…</option>
          </select>
          <div id="admCustomWrap" hidden style="margin-top:12px">
            <label for="admCustom">Nombre del responsable</label>
            <input class="input" id="admCustom" placeholder="Nombre" autocomplete="name">
          </div>
          <p class="err" id="admErr" role="alert"></p>
        </form>
        <div class="modal-foot">
          <button class="btn secondary" type="button" data-close>Cancelar</button>
          <button class="btn" type="submit" form="admForm">Registrar</button>
        </div>`, { onOpen(){ document.querySelector('#dialog').classList.add('sm'); } });
      const sel = document.getElementById('admWho'), wrap = document.getElementById('admCustomWrap'), custom = document.getElementById('admCustom');
      const sync = () => { const isC = sel.value==='__custom__'; wrap.hidden = !isC; if(isC) custom.focus(); };
      if(!list.length) sel.value = '__custom__';
      sel.onchange = sync; sync();
      const finish = v => { document.querySelector('#dialog')?.classList.remove('sm'); Modal.close(); resolve(v); };
      document.getElementById('admForm').onsubmit = e => {
        e.preventDefault();
        const who = sel.value==='__custom__' ? custom.value.trim() : sel.value;
        if(!who){ document.getElementById('admErr').textContent = 'Indique el responsable.'; custom.focus(); return; }
        finish(who);
      };

        if(e.target===Modal.host || e.target.closest('[data-close]')){
          Modal.host.removeEventListener('click', h);
          document.querySelector('#dialog')?.classList.remove('sm');
          resolve(null);
        }

    });

  pinDialog(cambiar){
    Modal.open(`
      <h2 id="dialogTitle">${cambiar ? 'Cambiar' : 'Activar'} el PIN</h2>
      <p class="muted">Entre 4 y 12 caracteres. Se guarda derivado con PBKDF2-SHA256 y sal aleatoria,
        nunca en claro. Si lo olvidas no hay forma de recuperarlo.</p>
      <form id="pinForm" novalidate>
        ${cambiar ? `<label for="pinOld">PIN actual</label>
          <input class="input pin" id="pinOld" type="password" inputmode="numeric" autocomplete="off" maxlength="12">` : ''}
        <label for="pinNew" style="display:block;margin-top:12px">PIN nuevo</label>
        <input class="input pin" id="pinNew" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12">
        <label for="pinRep" style="display:block;margin-top:12px">Repite el PIN nuevo</label>
        <input class="input pin" id="pinRep" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12">
        <p class="err" id="pinErr" role="alert"></p>
      </form>
      <div class="modal-foot">
        <button class="btn secondary" type="button" data-close>Cancelar</button>
        <button class="btn" type="submit" form="pinForm">Guardar PIN</button>
      </div>`, { onOpen(){ document.querySelector('#dialog').classList.add('sm'); } });

    document.getElementById('pinForm').onsubmit = async e => {
      e.preventDefault();
      const err = document.getElementById('pinErr');
      const nuevo = document.getElementById('pinNew').value.trim();
      const rep   = document.getElementById('pinRep').value.trim();
      if(cambiar && !await this.pin.verify(document.getElementById('pinOld').value.trim())){
        err.textContent = 'El PIN actual no es correcto.'; return;
      }
      if(nuevo.length < 4 || nuevo.length > 12){ err.textContent = 'El PIN debe tener entre 4 y 12 caracteres.'; return; }
      if(nuevo !== rep){ err.textContent = 'Los dos PIN no coinciden.'; return; }
      await this.pin.set(nuevo);
      document.querySelector('#dialog')?.classList.remove('sm');
      Modal.close(); this.render();
      toast(cambiar ? 'PIN actualizado.' : 'Bloqueo con PIN activado.', 'good');
    };

  /* ============================================================
     RESPALDO CIFRADO
     Exportar: AES-GCM 256 + PBKDF2-SHA256 (310 000 iteraciones).
     Importar: acepta el formato cifrado y, por compatibilidad,
     los respaldos antiguos en claro (avisando de ello).
     ============================================================ */
  download(name, data, type){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], {type}));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  }

  /* ============================================================
     PERFIL CIFRADO: GENERAR, PUBLICAR Y RECARGAR
     ============================================================ */
  async publishProfile(cambiarClave){
    if(!SECURE){ toast('El cifrado necesita https:// o localhost.', 'bad'); return; }
    const primeraVez = this.mode !== 'perfil';
    let clave = cambiarClave ? null : this.pass;

    if(!clave){
      clave = await this.newPasswordDialog({
        title: cambiarClave ? 'Nueva clave de acceso' : 'Clave de acceso del perfil',
        intro: 'Con esta clave se descifra la información en cualquier navegador y dispositivo. ' +
               'No se guarda en ningún sitio y no puede recuperarse. Como el archivo es público, ' +
               'usa una frase larga: mínimo 12 caracteres.',
        min: 12,
        submit: 'Cifrar y descargar'
      });
      if(clave === null) return;
    }

    toast('Cifrando el perfil…');
    try{
      const sobre = await Vault.encrypt(this.state, clave);
      this.download(Profile.FILE, JSON.stringify(sobre, null, 2), 'application/json');

      // Este navegador pasa a trabajar con el perfil cifrado
      this.pass      = clave;
      this.cacheKey  = await Vault.keyFor(sobre, clave);
      this.cacheSalt = B64.to(sobre.salt);
      this.cacheIter = sobre.iterations;
      this.mode      = 'perfil';
      this.published = sobre;
      if(primeraVez) this.store.wipePlain();   // no queda nada legible
      Profile.saveCache(sobre);
      this.save();
      this.render();
      this.publishHelp(primeraVez);
    }catch{
      toast('No se pudo cifrar el perfil.', 'bad');
    }
  }

  /* Contraseña nueva, con confirmación y medidor de robustez */
  newPasswordDialog({title = 'Contraseña del respaldo', intro = '', min = 8, submit = 'Cifrar y descargar'} = {}){
    const texto = intro || `El archivo se cifra con AES-GCM 256. Nadie podrá abrirlo sin esta contraseña,
      y no existe forma de recuperarla: anótala en un lugar seguro.`;
    return new Promise(resolve => {
      Modal.open(`
        <h2 id="dialogTitle">${escapeHtml(title)}</h2>
        <p class="muted">${escapeHtml(texto)}</p>
        <form id="pwForm" novalidate>
          <label for="pw1">Contraseña</label>
          <input class="input" id="pw1" type="password" autocomplete="new-password">
          <div class="meter" id="pwMeter" aria-hidden="true"><i></i></div>
          <p class="hint" id="pwHint">Mínimo ${min} caracteres. Mezcla mayúsculas, minúsculas, números y símbolos.</p>
          <label for="pw2" style="display:block;margin-top:12px">Repite la contraseña</label>
          <input class="input" id="pw2" type="password" autocomplete="new-password">
          <p class="err" id="pwErr" role="alert"></p>
        </form>
        <div class="modal-foot">
          <button class="btn secondary" type="button" data-close>Cancelar</button>
          <button class="btn" type="submit" form="pwForm">${escapeHtml(submit)}</button>
        </div>`, { onOpen(){ document.querySelector('#dialog').classList.add('sm'); } });

      const p1 = document.getElementById('pw1'), meter = document.getElementById('pwMeter');
      const hint = document.getElementById('pwHint');
      p1.oninput = () => {
        const v = p1.value;
        let s = 0;
        if(v.length >= min) s++; if(v.length >= min + 6) s++;
        if(/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
        if(/\d/.test(v)) s++; if(/[^\w\s]/.test(v)) s++;
        meter.className = 'meter' + (s >= 4 ? ' ok' : s >= 3 ? ' mid' : '');
        meter.querySelector('i').style.width = Math.min(100, s * 20) + '%';
        hint.textContent = v.length < min ? `Mínimo ${min} caracteres.`
          : s >= 4 ? 'Contraseña robusta.' : 'Añade mayúsculas, números o símbolos para reforzarla.';
      };
      const cerrar = v => { document.querySelector('#dialog')?.classList.remove('sm'); Modal.close(); resolve(v); };
      document.getElementById('pwForm').onsubmit = e => {
        e.preventDefault();
        const err = document.getElementById('pwErr'), a = p1.value, b = document.getElementById('pw2').value;
        if(a.length < min){ err.textContent = `Usa al menos ${min} caracteres.`; p1.focus(); return; }
        if(a !== b){ err.textContent = 'Las contraseñas no coinciden.'; return; }
        cerrar(a);
      };
      Modal.host.addEventListener('click', function h(e){
        if(e.target === Modal.host || e.target.closest('[data-close]')){
          Modal.host.removeEventListener('click', h);
          document.querySelector('#dialog')?.classList.remove('sm');
          resolve(null);
        }
      });
    });
  }

  /* --- Restauración desde archivo --- */
  handleImport(e){
    const f = e.target.files[0];
    e.target.value = '';
    if(!f) return;
    if(f.size > 25 * 1024 * 1024){ toast('El archivo es demasiado grande para ser un respaldo de Cuida.', 'bad'); return; }
    const r = new FileReader();
    r.onerror = () => toast('No se pudo leer el archivo.', 'bad');
    r.onload = async () => {
      let sobre;
      try{ sobre = JSON.parse(r.result); }
      catch{ toast('El archivo no es un respaldo válido de Cuida.', 'bad'); return; }

      if(Vault.isEncrypted(sobre)){
        if(!SECURE){ toast('Para abrir un respaldo cifrado necesitas https:// o localhost.', 'bad'); return; }
        const pass = await promptDialog({
          title:'Respaldo cifrado',
          label:`Contraseña del respaldo (creado el ${sobre.createdAt ? new Date(sobre.createdAt).toLocaleDateString('es-CO') : 'sin fecha'})`,
          type:'password' });
        if(pass === null) return;
        try{
          const datos = await Vault.decrypt(sobre, pass);
          this.applyImported(datos, 'Respaldo cifrado restaurado correctamente.');
        }catch{
          toast('Contraseña incorrecta o archivo alterado. No se restauró nada.', 'bad', 8000);
        }
        return;
      }
      // Compatibilidad: respaldos antiguos sin cifrar
      const ok = await confirmDialog({
        title:'Respaldo sin cifrar',
        message:'Este archivo es de una versión anterior y no está cifrado. ¿Quieres restaurarlo igualmente?',
        confirmText:'Restaurar' });
      if(!ok) return;
      this.applyImported(sobre, 'Respaldo antiguo restaurado. Descarga uno nuevo para tenerlo cifrado.');
    };
    r.readAsText(f);
  }

  /* Valida la forma de los datos antes de sustituir el estado */
  validState(d){
    return !!(d && typeof d === 'object' && !Array.isArray(d)
      && d.patient && typeof d.patient === 'object'
      && Array.isArray(d.medications));
  }
  applyImported(datos, mensaje){
    if(!this.validState(datos)){ toast('El contenido no tiene la estructura de Cuida.', 'bad'); return; }
    this.state = datos;
    this.migrate();
    this.save(); this.render();
    toast(mensaje, 'good', 7000);
  }

  /* --- Restauración desde las copias locales --- */
  async restorePrevious(){
    const prev = this.store.previous();
    if(!prev){ toast('No hay copia anterior disponible.', 'bad'); return; }
    const ok = await confirmDialog({
      title:'Restaurar el estado anterior',
      message:'Se sustituirán los datos actuales por la copia guardada antes del último cambio.',
      confirmText:'Restaurar', danger:true });
    if(ok) this.applyImported(prev, 'Estado anterior restaurado.');
  }
  async restoreSnapshot(i){
    const c = this.store.snapshots()[i];
    if(!c){ toast('Esa copia ya no está disponible.', 'bad'); return; }
    const ok = await confirmDialog({
      title:'Restaurar copia del ' + new Date(c.at).toLocaleDateString('es-CO'),
      message:'Esta copia no incluye las fotos de los medicamentos; el resto de la información se recupera completa.',
      confirmText:'Restaurar', danger:true });
    if(!ok) return;
    try{ this.applyImported(JSON.parse(c.data), 'Copia restaurada (sin fotos).'); }
    catch{ toast('La copia está dañada y no se pudo leer.', 'bad'); }
  }
}

const app = new App();
const ready = app.start();
</script>
