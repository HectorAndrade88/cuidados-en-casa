<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ============================================================
       SEGURIDAD DE LA INFORMACIÓN (defensa en profundidad)
       - CSP: los únicos destinos externos permitidos son los de
         Firebase/Google (SDK, Firestore, Auth y Storage). Todo lo
         demás sigue restringido a 'self'.
       - object/base/form-action bloqueados; frame-src solo permite
         el iframe de autenticación de Firebase y el popup de Google.
       - noindex: la página es pública en GitHub Pages, pero no debe
         aparecer en buscadores.
       ============================================================ -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.google.com; style-src 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com https://firebasestorage.googleapis.com; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.firebasestorage.app https://firebasestorage.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://recaptchaenterprise.googleapis.com https://content-firebaseappcheck.googleapis.com; frame-src https://cuidados-en-casa.firebaseapp.com https://accounts.google.com https://www.google.com; object-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#007fa8">
  <meta name="description" content="Cuida: seguimiento en casa de la medicación, los síntomas y el equipo de cuidado de una persona.">
  <title>Cuida · Seguimiento domiciliario</title>
  <style>
  /* ============================================================
     CUIDA · Hoja de estilos
     Organización:
       1. Tokens (variables) + temas (claro/oscuro/alto contraste/grande)
       2. Base y accesibilidad (foco, movimiento reducido)
       3. Layout (app, sidebar, contenido)
       4. Componentes (tarjetas, botones, píldoras, tablas, formularios)
       5. Diálogos y toasts
       6. Responsive (mobile-first con overrides)
     Todos los colores usan variables para poder tematizar.
     ============================================================ */

  /* 1. TOKENS ------------------------------------------------- */
  /* ----------------------------------------------------------
     PALETA TECNOLÓGICA · azul profundo y cian luminoso.
     Estados semánticos: administrada (verde), pendiente (ámbar),
     alerta (rojo). Modo claro por defecto y oscuro AUTOMÁTICO.
     ---------------------------------------------------------- */
  :root{
    --bg:#edf8fc;          /* azul hielo luminoso */
    --surface:#ffffff;
    --surface-2:#dff3f8;
    --ink:#06264a;         /* azul marino */
    --muted:#3e627c;       /* texto secundario · AA sobre superficie */
    --line:#b9e2ec;
    --primary:#007fa8;     /* cian profundo */
    --primary-ink:#ffffff; /* texto sobre color primario */
    --primary-soft:#c9f5f5;
    --primary-soft-ink:#005e83;
    --good:#087a69; --good-bg:#d9f8ef;   /* administrada */
    --warn:#9a5600; --warn-bg:#fff0cf;   /* pendiente */
    --bad:#b4234b;  --bad-bg:#ffe7ef;    /* alerta */
    --focus:#008cb7;
    /* Radios en escala: pequeño (controles) · base (tarjetas) · grande (diálogos) */
    --radius:14px;
    --radius-sm:9px;
    --radius-lg:20px;
    /* Sombras en capas para dar profundidad sin ensuciar */
    --shadow-sm:0 1px 3px rgba(0,60,95,.06), 0 2px 8px rgba(0,78,119,.06);
    --shadow:0 4px 14px rgba(0,70,110,.08), 0 10px 30px rgba(0,70,110,.06);
    --shadow-lg:0 18px 48px rgba(0,55,90,.16);
    /* Tipografía · stack de sistema moderno (CSP: font-src 'self', sin fuentes web).
       Se prioriza la variante de UI de cada sistema y se activan cifras tabulares
       donde alinear números importa (relojes, métricas, horarios). */
    --font-ui:"SF Pro Text","Segoe UI Variable Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
    /* Escala tipográfica fluida (razón ~1.2), más aireada que la anterior */
    --fs-base:clamp(15px, 0.9rem + 0.2vw, 16.5px);
    --fs-sm:clamp(.8rem, .77rem + .12vw, .875rem);
    --fs-h1:clamp(1.55rem, 1.2rem + 1.5vw, 2.05rem);
    --fs-h2:clamp(1.15rem, 1.02rem + 0.5vw, 1.38rem);
    --fs-h3:clamp(1rem, .95rem + .28vw, 1.12rem);
    --tap:44px; /* tamaño táctil mínimo (WCAG) */
  }
  /* Modo claro por defecto. El oscuro es OPCIONAL desde Ajustes
     (antes se activaba solo con el sistema y "se veía todo oscuro"). */
  body.dark{
    --bg:#020d27; --surface:#071a39; --surface-2:#09284f;
    --ink:#e8fbff; --muted:#9ac8d9; --line:#155375;
    --primary:#00cfe0; --primary-ink:#001b3b;
    --primary-soft:#073d62; --primary-soft-ink:#75f4f5;
    --good:#45e3bd; --good-bg:#073c42;
    --warn:#ffcb5b; --warn-bg:#3f2a0a;
    --bad:#ff7da2;  --bad-bg:#45152c;
    --focus:#00e6ef;
    --shadow-sm:0 1px 3px rgba(0,0,0,.35);
    --shadow:0 8px 26px rgba(0,0,0,.30);
    --shadow-lg:0 22px 54px rgba(0,0,0,.42);
  }
  /* Alto contraste (negro sobre blanco, bordes marcados) */
  body.high{
    --bg:#ffffff; --surface:#ffffff; --surface-2:#ffffff;
    --ink:#000000; --muted:#1a1a1a; --line:#000000;
    --primary:#0a4f43; --primary-ink:#ffffff;
    --primary-soft:#d6f2ec; --primary-soft-ink:#063b31;
    --good:#005c3c; --good-bg:#dff5ec;
    --warn:#7a3d00; --warn-bg:#fff0d6;
    --bad:#a5001f;  --bad-bg:#ffe0e6;
    --focus:#0a4f43; --shadow:none; --shadow-sm:none; --shadow-lg:none;
  }
  /* Fuente y controles grandes */
  body.large{ --fs-base:19px; --tap:52px; }
  body.large .btn{ padding:14px 18px; }

  /* 2. BASE Y ACCESIBILIDAD ---------------------------------- */
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:var(--fs-base)/1.55 var(--font-ui);
    -webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }
  button,input,select,textarea{ font:inherit; color:inherit; }
  /* Jerarquía tipográfica: títulos con tracking negativo (aspecto moderno)
     y equilibrio de saltos de línea donde el navegador lo permite. */
  h1,h2,h3{ line-height:1.18; letter-spacing:-.015em; text-wrap:balance; }
  h1{ letter-spacing:-.025em; font-weight:800; }
  /* Cifras tabulares: números que no “bailan” en relojes, métricas y horarios. */
  .clock strong,.stat .n,.stat-mini .n,.time,.cal-cell,.cal-num,.pin{
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  }

  /* Foco visible y consistente para navegación por teclado */
  :focus-visible{ outline:3px solid var(--focus); outline-offset:2px; border-radius:6px; }
  /* Evita doble anillo en elementos sin foco por teclado */
  :focus:not(:focus-visible){ outline:none; }

  /* Enlace de salto al contenido principal */
  .skip{
    position:absolute; left:8px; top:-60px; z-index:50;
    background:var(--surface); color:var(--ink); padding:10px 14px;
    border:2px solid var(--focus); border-radius:8px; transition:top .15s;
  }
  .skip:focus{ top:8px; }

  /* Respeta a quien prefiere menos movimiento */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.001ms!important; transition-duration:.001ms!important; scroll-behavior:auto!important; }
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }

  /* 3. LAYOUT ------------------------------------------------- */
  .app{ min-height:100vh; display:grid; grid-template-columns:240px 1fr; }

  .side{
    background:linear-gradient(160deg,#04173f 0%,#005f88 58%,#00aeba 145%); color:#fff; padding:22px 14px;
    border-right:1px solid rgba(255,255,255,.06);
    position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
  }
  body.dark .side{ background:linear-gradient(160deg,#010b25 0%,#043561 62%,#006d8a 150%); }
  body.high .side{ background:#000; }
  .brand{ display:flex; align-items:center; gap:11px; font-size:1.32rem; font-weight:800; letter-spacing:-.02em; margin:0 8px 26px; }
  .brand i{
    width:40px; height:40px; border-radius:12px;
    background:linear-gradient(135deg,#12dbdd 0%,#00a7c4 100%);
    box-shadow:0 6px 18px rgba(0,207,210,.42);
    color:#04223b; display:grid; place-items:center; font-style:normal;
  }
  .brand i svg{ width:22px; height:22px; display:block; }
  .nav a .ic svg{ display:block; }
  .nav{ display:flex; flex-direction:column; gap:4px; }
  .nav a{
    display:flex; align-items:center; gap:12px; min-height:var(--tap);
    padding:11px 14px; border-radius:12px; color:#cbe9f3;
    text-decoration:none; font-weight:600; letter-spacing:-.01em;
    transition:background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .nav a .ic{ width:22px; height:22px; display:grid; place-items:center; flex:none; }
  .nav a:hover{ background:rgba(255,255,255,.12); color:#fff; }
  .nav a[aria-current="page"]{ background:#0a97c0; color:#fff; box-shadow:0 4px 14px rgba(0,140,180,.42); }
  body.high .nav a{ color:#fff; }
  body.high .nav a[aria-current="page"]{ background:#fff; color:#000; }
  .side-foot{ margin-top:auto; color:#9bd5e5; font-size:.8rem; padding:12px 8px 0; }

  .main{ min-width:0; display:flex; flex-direction:column; }
  .top{
    min-height:64px; padding:12px 28px; display:flex; align-items:center;
    justify-content:space-between; gap:16px;
    background:var(--surface); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:3;
  }
  .top .who{ font-weight:600; min-width:0; }
  /* Paciente en la barra superior: es un botón, pero se lee como texto */
  .linklike{
    background:none; border:0; padding:4px 0; margin:0; cursor:pointer;
    font:inherit; font-weight:600; color:var(--ink); text-align:left;
    text-decoration:underline; text-decoration-color:var(--line);
    text-underline-offset:4px; min-height:auto;
  }
  .linklike:hover{ text-decoration-color:var(--primary); }
  .linklike.warnlike{ color:var(--warn); }
  .clock{ color:var(--muted); font-size:.9rem; }
  .clock strong{ color:var(--ink); font-size:1.05rem; margin-left:6px; }
  .content{ padding:26px; max-width:1240px; width:100%; margin:0 auto; }
  .page{ animation:fade .2s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none;} }

  .title-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .title-row h1{ margin:0; font-size:var(--fs-h1); }
  .sub{ color:var(--muted); margin:6px 0 0; }
  .section-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin:30px 0 12px; flex-wrap:wrap; }
  .section-head h2{ margin:0; font-size:var(--fs-h2); }

  /* 4. COMPONENTES ------------------------------------------- */
  .grid{ display:grid; gap:16px; }
  .stats{ grid-template-columns:repeat(4,1fr); }
  .two{ grid-template-columns:1.3fr .7fr; }

  /* Encabezado compacto del panel (enfoque de seguimiento clínico) */
  .compact-head{ margin-bottom:16px; }
  .dash-h1{ margin:0; font-size:clamp(1.15rem,1rem+0.6vw,1.4rem); }

  /* Panel de hoy: dos columnas. Antes "Próxima medicación" ocupaba el
     ancho completo (≈970 px) con un contenido de una sola columna, lo que
     dejaba un gran vacío a la derecha. */
  .dash-grid{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:16px; align-items:start; }
  .dash-side{ display:grid; gap:16px; min-width:0; }
  @media (max-width:860px){ .dash-grid{ grid-template-columns:minmax(0,1fr); } }

  /* Métricas compactas: fila densa en lugar de tarjetas grandes */
  .metrics{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .stat-mini{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px 12px;
  }
  /* El contenido se centra: alineado a la izquierda dejaba un hueco
     de hasta el 55% del ancho a la derecha de cada métrica. */
  .stat-mini{ justify-content:center; transition:box-shadow .15s ease, transform .15s ease; }
  .stat-mini .icon{
    width:36px; height:36px; border-radius:10px; flex:none;
    background:var(--primary-soft); color:var(--primary-soft-ink);
    display:grid; place-items:center;
  }
  .stat-mini .icon svg{ width:20px; height:20px; display:block; }
  /* Métricas con color semántico (pendiente / administrado / alerta) */
  .stat-mini.warn .icon{ background:var(--warn-bg); color:var(--warn); }
  .stat-mini.good .icon{ background:var(--good-bg); color:var(--good); }
  .stat-mini.bad  .icon{ background:var(--bad-bg);  color:var(--bad);  }
  .stat-mini .n{ font-size:1.5rem; font-weight:800; line-height:1.05; letter-spacing:-.02em; }
  .stat-mini .label{ font-size:.76rem; color:var(--muted); }

  /* Ficha del paciente como icono desplegable en el encabezado */
  .patient-info{ position:relative; flex:none; }
  .patient-info > summary{
    list-style:none; cursor:pointer; width:40px; height:40px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface); color:var(--primary);
    display:grid; place-items:center; font-size:1.15rem;
  }
  .patient-info > summary::-webkit-details-marker{ display:none; }
  .patient-info[open] > summary{ background:var(--primary-soft); color:var(--primary-soft-ink); border-color:transparent; }
  .patient-info .pop{
    position:absolute; right:0; top:48px; z-index:5; width:min(280px,80vw);
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:0 12px 30px rgba(15,55,50,.16); padding:14px 16px;
  }

  /* Tarjetas plegables (desplegables): agenda, según necesidad… */
  details.fold{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  details.fold > summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:16px 18px; font-weight:600; min-height:var(--tap);
  }
  details.fold > summary::-webkit-details-marker{ display:none; }
  details.fold > summary::after{ content:'⌄'; font-size:1.15rem; color:var(--muted); transition:transform .2s ease; }
  details.fold[open] > summary::after{ transform:rotate(180deg); }
  details.fold .fold-body{ padding:0 18px 18px; }

  /* Filas de horario dinámicas (varias dosis al día) */
  .time-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .time-row .input{ max-width:170px; }
  .time-row [data-remtime]{ min-height:38px; padding:6px 12px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-sm); }
  .card > b{ display:block; margin-bottom:8px; letter-spacing:-.01em; }

  .stat{ position:relative; }
  .stat .label{ color:var(--muted); font-size:.85rem; }
  .stat .n{ font-size:1.9rem; font-weight:700; margin-top:4px; }
  .stat .icon{ position:absolute; top:16px; right:16px; background:var(--primary-soft); color:var(--primary-soft-ink); padding:8px; border-radius:10px; width:38px; height:38px; display:grid; place-items:center; }

  .progress{ height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:12px; }
  .progress i{ display:block; height:100%; background:var(--primary); border-radius:inherit; }

  .next{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  .med-icon{ width:58px; height:58px; border-radius:13px; object-fit:cover; background:var(--primary-soft); }

  /* Píldoras de estado (texto con contraste AA) */
  .pill{ display:inline-block; font-size:.78rem; padding:4px 10px; border-radius:99px; font-weight:700; background:var(--good-bg); color:var(--good); }
  .pill.warn{ background:var(--warn-bg); color:var(--warn); }
  .pill.bad{ background:var(--bad-bg); color:var(--bad); }

  /* Botones: enlaces navegan, botones actúan */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:var(--tap); padding:10px 16px; border:1px solid transparent; border-radius:var(--radius);
    background:var(--primary); color:var(--primary-ink); font-weight:600; cursor:pointer; text-decoration:none;
    transition:filter .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:hover{ filter:brightness(.95); }
  /* Secundario tipo contorno: jerarquía clínica clara frente al primario */
  .btn.secondary{ background:var(--surface); color:var(--ink); border-color:var(--line); }
  .btn.secondary:hover{ background:var(--surface-2); filter:none; }
  .btn.danger{ background:var(--bad-bg); color:var(--bad); border-color:transparent; }
  /* Botón de WhatsApp: verde de marca oscurecido para cumplir contraste AA */
  .btn.wa{ background:#0b6b5f; color:#fff; }
  .btn.wa:hover{ filter:brightness(1.12); }
  body.high .btn.wa{ background:#00453c; border-color:#000; }
  .btn.small{ min-height:36px; padding:7px 11px; font-size:.85rem; }
  body.large .btn.small{ min-height:44px; }
  body.high .btn{ border-color:#000; }

  .list{ padding:0; margin:0; list-style:none; }
  .list li{ padding:13px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .list li:last-child{ border:0; }
  .muted{ color:var(--muted); }

  .agenda{ display:grid; gap:12px; }
  .agenda-card{ display:grid; grid-template-columns:66px 1fr auto; align-items:center; gap:14px; }
  .time{ font-size:1.15rem; font-weight:800; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .status{ font-size:.82rem; color:var(--muted); margin-top:4px; }

  .alert{ border-left:4px solid var(--warn); background:var(--warn-bg); color:var(--ink); padding:11px 14px; border-radius:8px; margin:10px 0; }
  .alert.bad{ border-color:var(--bad); background:var(--bad-bg); }
  .notice{ padding:12px; border-radius:10px; background:var(--good-bg); color:var(--good); font-size:.9rem; margin-top:12px; }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .input{
    min-height:var(--tap); width:100%;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:11px 13px; border-radius:var(--radius-sm);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .input::placeholder{ color:var(--muted); opacity:1; }
  .search{ max-width:340px; }

  .table-wrap{ overflow-x:auto; }
  .table{ width:100%; border-collapse:collapse; font-size:.9rem; }
  .table caption{ text-align:left; color:var(--muted); padding:0 0 10px; }
  .table th{ text-align:left; color:var(--muted); font-weight:600; background:var(--surface-2); }
  .table th,.table td{ padding:12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .med-row{ display:flex; align-items:center; gap:10px; }
  .empty{ text-align:center; padding:28px; color:var(--muted); }

  /* Formularios */
  .form{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .form label{ font-size:.85rem; font-weight:700; color:var(--muted); display:block; }
  .form label .req{ color:var(--bad); }
  .form .input,.form textarea,.form select{ margin-top:5px; }
  .form .full{ grid-column:1/-1; }
  .form textarea{ min-height:84px; resize:vertical; }
  .hint{ font-weight:500; color:var(--muted); font-size:.8rem; margin-top:4px; }
  /* Mensaje de error accesible por campo */
  .err{ color:var(--bad); font-size:.82rem; font-weight:600; margin-top:5px; min-height:0; }
  .input[aria-invalid="true"]{ border-color:var(--bad); outline-color:var(--bad); }


  .switch{ display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); padding:14px 0; min-height:var(--tap); }
  .switch:last-child{ border:0; }
  .switch input{ width:22px; height:22px; }
  .settings{ grid-template-columns:1fr; max-width:760px; }

  /* --- Cuidadores: avatares, chips y selección múltiple --- */
  .card.hover{ transition:transform .15s ease, box-shadow .15s ease; }
  .card.hover:hover{ transform:translateY(-2px); box-shadow:0 12px 30px rgba(15,55,50,.14); }
  .cargrid{ grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); }
  .avatar{
    width:46px; height:46px; border-radius:50%; flex:none; display:grid; place-items:center;
    font-weight:700; color:#fff; background:var(--primary);
  }
  .avatar.sm{ width:30px; height:30px; font-size:.72rem; }
  .car-head{ display:flex; align-items:center; gap:12px; }
  .car-meds{ margin-top:14px; }
  .car-line{ display:inline-flex; align-items:center; gap:9px; }
  /* Chips (medicamentos asignados) */
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:99px;
    background:var(--primary-soft); color:var(--primary-soft-ink); font-size:.78rem; font-weight:600;
  }
  .chip .dot,.check .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  /* Selección múltiple con casillas tipo chip */
  .checks{ border:0; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:8px; }
  .checks legend{ font-size:.85rem; font-weight:700; color:var(--muted); margin-bottom:6px; width:100%; padding:0; }
  .check{
    display:inline-flex; align-items:center; gap:8px; padding:8px 12px; min-height:var(--tap);
    border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--surface); font-weight:600;
  }
  .check input{ width:18px; height:18px; }
  .check:has(input:checked){ border-color:var(--primary); background:var(--primary-soft); color:var(--primary-soft-ink); }
  .check:focus-within{ outline:3px solid var(--focus); outline-offset:2px; }
  .chips.mini .chip{ font-size:.72rem; padding:3px 9px; }

  /* 5. DIÁLOGOS Y TOASTS ------------------------------------- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:40; background:rgba(15,23,42,.55);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .modal-backdrop[hidden]{ display:none; }
  .dialog{
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-radius:var(--radius-lg); padding:26px; width:min(760px,100%); max-height:92vh; overflow:auto;
    box-shadow:var(--shadow-lg);
  }
  .dialog.sm{ width:min(440px,100%); }
  .dialog h2{ margin:0 0 16px; font-size:var(--fs-h2); }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; flex-wrap:wrap; }

  .toasts{ position:fixed; right:16px; bottom:16px; z-index:60; display:flex; flex-direction:column; gap:10px; max-width:min(360px,92vw); }
  .toast{
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-left:4px solid var(--primary); border-radius:10px; padding:12px 14px;
    box-shadow:var(--shadow); animation:fade .2s ease;
  }
  .toast.good{ border-left-color:var(--good); }
  .toast.bad{ border-left-color:var(--bad); }

  /* 6. RESPONSIVE -------------------------------------------- */
  /* Móvil/tablet: sidebar pasa a barra inferior fija con targets táctiles */
  @media (max-width:860px){
    .app{ display:block; }
    .side{
      position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; z-index:30;
      flex-direction:row; align-items:center; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
      border-top:1px solid var(--line);
    }
    .brand,.side-foot{ display:none; }
    .nav{ flex-direction:row; width:100%; justify-content:space-around; gap:2px; overflow-x:auto; }
    .nav a{ flex-direction:column; gap:3px; font-size:.68rem; padding:6px 4px; min-width:58px; flex:1 0 auto; justify-content:center; }
    .content{ padding:20px 15px; }
    .main{ padding-bottom:calc(76px + env(safe-area-inset-bottom)); } /* espacio para la barra inferior */
    body.large .main{ padding-bottom:calc(92px + env(safe-area-inset-bottom)); }
    .top{ padding:12px 16px; }
    .stats{ grid-template-columns:repeat(2,1fr); }
    .metrics{ grid-template-columns:repeat(2,1fr); }
    .two{ grid-template-columns:1fr; }
    .agenda-card{ grid-template-columns:56px 1fr; }
    .agenda-card .actions{ grid-column:1/-1; }
  }

  /* Tabletas en vertical: evita líneas demasiado largas y conserva acciones
     cómodas sin activar todavía la navegación móvil. */
  @media (min-width:561px) and (max-width:860px){
    .content{ max-width:780px; }
    .top .clock{ white-space:nowrap; }
    .cargrid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  }

  /* Tablas apiladas tipo tarjeta en pantallas pequeñas (mejor lectura móvil) */
  @media (max-width:560px){
    .stats{ grid-template-columns:1fr; }
    .metrics{ grid-template-columns:repeat(2,1fr); }
    .form{ grid-template-columns:1fr; }
    .title-row .btn{ width:100%; }
    .table thead{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    .table, .table tbody, .table tr, .table td{ display:block; width:100%; }
    .table tr{ border:1px solid var(--line); border-radius:12px; margin-bottom:12px; padding:6px 12px; background:var(--surface); }
    .table td{ border:0; display:flex; justify-content:space-between; gap:12px; padding:8px 0; text-align:right; }
    .table td::before{ content:attr(data-label); font-weight:700; color:var(--muted); text-align:left; }
    .table td .med-row{ justify-content:flex-end; }
  }

  /* Teléfonos estrechos (320–390 px): no se corta el encabezado, los botones
     ni la barra inferior; se prioriza contenido y objetivos táctiles. */
  @media (max-width:390px){
    .top{ min-height:58px; padding:8px 12px; gap:8px; }
    .top .who{ font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .clock{ font-size:.75rem; }
    .clock strong{ display:block; margin:0; font-size:.95rem; }
    .content{ padding:16px 12px; }
    .card{ padding:14px; }
    .nav a{ min-width:54px; font-size:.62rem; }
    .metrics{ gap:8px; }
    .stat-mini{ padding:9px; gap:7px; }
    .stat-mini .icon{ width:30px; height:30px; }
    .agenda-card{ grid-template-columns:50px 1fr; gap:8px; }
    .modal-backdrop{ padding:10px; }
    .dialog{ padding:18px; }
  }

  /* Escritorios amplios: una lectura más descansada sin estirar el contenido
     clínico indefinidamente. */
  @media (min-width:1440px){
    .app{ grid-template-columns:264px 1fr; }
    .content{ max-width:1320px; padding:32px; }
    .top{ padding-inline:32px; }
  }

  /* 7. SEGURIDAD: PANTALLA DE BLOQUEO ------------------------- */
  /* Al bloquear, la app se retira del render: los datos no quedan
     visibles ni siquiera desenfocados detrás de la capa. */
  .lock{
    position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:20px;
    background:linear-gradient(160deg,#16223d,#0d1424);
  }
  .lock[hidden]{ display:none; }
  body.locked .app,body.locked .toasts{ display:none; }
  .lock-box{
    width:min(410px,100%); background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:20px; padding:26px;
    box-shadow:0 26px 70px rgba(0,0,0,.5);
  }
  .lock-logo{
    width:54px; height:54px; border-radius:16px; display:grid; place-items:center;
    background:var(--primary); color:#fff; font-size:1.5rem;
    margin-bottom:16px; box-shadow:0 8px 20px rgba(13,148,136,.4);
  }
  .lock-box h1{ margin:0 0 6px; font-size:1.3rem; }
  .pin{ letter-spacing:.5em; text-align:center; font-size:1.35rem; font-weight:700; }
  .lock-foot{ margin-top:18px; display:flex; flex-direction:column; gap:10px; }

  /* Indicadores de seguridad en Ajustes */
  .sec-state{ display:flex; align-items:center; gap:10px; margin:10px 0 4px; }
  .dot-state{ width:11px; height:11px; border-radius:50%; flex:none; background:var(--bad); }
  .dot-state.on{ background:var(--good); }
  .meter{ height:7px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:8px; }
  .meter i{ display:block; height:100%; width:0; background:var(--bad); transition:width .2s, background .2s; }
  .meter.mid i{ background:var(--warn); } .meter.ok i{ background:var(--good); }

  /* 8. MEDICAMENTOS: tarjetas y ficha sin imágenes --------------- */
  .hero{ display:grid; gap:20px; align-items:center; }
  .hero-name{ font-size:1.45rem; font-weight:800; line-height:1.2; }

  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button{
    background:var(--surface); color:var(--muted); border:0; cursor:pointer;
    min-height:var(--tap); padding:8px 16px; font-weight:700;
  }
  .seg button[aria-pressed="true"]{ background:var(--primary); color:var(--primary-ink); }

  .gallery{ grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
  .gcard{ display:flex; flex-direction:column; }
  .gbody{ padding:15px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .gbody .actions{ margin-top:auto; }

  .detail{ display:grid; grid-template-columns:1fr; gap:22px; align-items:start; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:8px 18px; margin:0; }
  .kv dt{ color:var(--muted); font-size:.85rem; }
  .kv dd{ margin:0; font-weight:600; }

  .viewer img{ display:block; margin:0 auto; max-width:100%; max-height:72vh; border-radius:14px; }

  @media (max-width:560px){
    .hero{ grid-template-columns:96px 1fr; gap:14px; }
    .hero-name{ font-size:1.15rem; }
    .detail{ grid-template-columns:1fr; }
    .detail-photo{ max-width:220px; }
  }

  /* 9. CALENDARIO Y RESUMEN DIARIO --------------------------- */
  /* Dos columnas: mes navegable + resumen del día elegido. En móvil
     se apilan (calendario arriba, resumen debajo). */
  /* minmax(0,…) + min-width:0: sin ellos los hijos de un grid usan
     min-width:auto y el calendario ensancha la página en móvil. */
  .cal{ display:grid; grid-template-columns:minmax(0,330px) minmax(0,1fr); gap:18px; align-items:start; }
  .cal-panel{ min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:16px; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .cal-title{ font-weight:800; letter-spacing:-.01em; text-transform:capitalize; font-size:1.02rem; }
  .cal-nav{ display:inline-flex; gap:6px; }
  .cal-nav button{
    width:40px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--line);
    background:var(--surface); color:var(--ink); display:grid; place-items:center; cursor:pointer;
    transition:background .12s ease;
  }
  /* Modo "fuente y botones grandes": el calendario también crece */
  body.large .cal-nav button{ width:var(--tap); height:var(--tap); }
  body.large .cal-cell{ height:var(--tap); font-size:1rem; }
  .cal-nav button:hover{ background:var(--surface-2); }
  .cal-nav button svg{ width:18px; height:18px; display:block; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
  .cal-dow{ text-align:center; font-size:.68rem; font-weight:700; color:var(--muted); padding:4px 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  .cal-cell{
    position:relative; min-width:0; height:42px; border:1.5px solid transparent;
    border-radius:10px; background:transparent; color:var(--ink); cursor:pointer;
    font-weight:600; display:flex; align-items:center; justify-content:center;
    padding:0; font-size:.92rem;
    transition:background .12s ease, border-color .12s ease;
  }
  .cal-cell:hover{ background:var(--surface-2); }
  .cal-cell.empty{ visibility:hidden; pointer-events:none; }
  .cal-cell.today{ border-color:var(--primary); }
  .cal-cell.sel{ background:var(--primary); color:var(--primary-ink); font-weight:800; border-color:transparent; }
  .cal-cell.sel:hover{ background:var(--primary); }
  .cal-cell .dot{ position:absolute; bottom:5px; left:50%; transform:translateX(-50%); width:6px; height:6px; border-radius:50%; background:var(--primary); }
  .cal-cell .dot.good{ background:var(--good); } .cal-cell .dot.warn{ background:var(--warn); } .cal-cell .dot.bad{ background:var(--bad); }
  .cal-cell.sel .dot{ background:var(--primary-ink); }
  body.high .cal-cell.today{ border-color:#000; }

  /* Resumen del día seleccionado (línea de tiempo) */
  .day{ min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:18px 20px; }
  .day-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .day-date{ font-weight:800; font-size:1.12rem; letter-spacing:-.015em; text-transform:capitalize; margin:0; }
  .day-count{ color:var(--muted); font-size:.85rem; margin:2px 0 0; }
  .day-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .tl{ display:flex; flex-direction:column; }
  .tl-item{ display:flex; gap:12px; padding:12px 2px; border-bottom:1px solid var(--line); }
  .tl-item:last-child{ border:0; }
  .tl-ic{ width:34px; height:34px; border-radius:var(--radius-sm); flex:none; display:grid; place-items:center; background:var(--primary-soft); color:var(--primary-soft-ink); }
  .tl-ic svg{ width:18px; height:18px; display:block; }
  .tl-ic.good{ background:var(--good-bg); color:var(--good); }
  .tl-ic.warn{ background:var(--warn-bg); color:var(--warn); }
  .tl-ic.bad{ background:var(--bad-bg); color:var(--bad); }
  .tl-ic.muted{ background:var(--surface-2); color:var(--muted); }
  .tl-body{ min-width:0; flex:1; }
  .tl-meta{ display:flex; align-items:center; gap:9px; margin-bottom:1px; }
  .tl-time{ color:var(--muted); font-weight:700; font-size:.82rem; }
  .tl-kind{ font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .tl-text{ font-size:.95rem; line-height:1.4; overflow-wrap:anywhere; }

  @media (max-width:860px){ .cal{ grid-template-columns:minmax(0,1fr); } }
  @media (max-width:390px){
    .cal-panel{ padding:12px; }
    .cal-cell{ height:38px; font-size:.86rem; }
    .cal-grid{ gap:3px; }
    .day{ padding:15px 14px; }
  }

  /* Paginación (historial): mantiene la tarjeta a una altura estable */
  .pager{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line); }
  .pager .btn{ gap:4px; }
  .pager .btn svg{ display:block; }
  .pager .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .pager-info{ color:var(--muted); font-size:.82rem; font-weight:600; font-variant-numeric:tabular-nums; text-align:center; }
  /* Tarjetas emparejadas (registros / rescates): el paginador se ancla
     abajo para que ambas queden alineadas aunque una tenga menos filas. */
  .rec-card{ display:flex; flex-direction:column; }
  .rec-card > div{ display:flex; flex-direction:column; flex:1; min-width:0; }
  .rec-card .pager{ margin-top:auto; }
  @media (max-width:390px){
    .pager{ gap:6px; }
    .pager .btn{ padding:7px 9px; }
    .pager-info{ font-size:.75rem; }
  }

  /* Aviso al grupo: destino principal, por eso se destaca sobre el resto */
  .wa-group{ border-color:var(--primary); border-left:4px solid var(--primary); background:var(--surface); }
  body.high .wa-group{ border-color:#000; }
  </style>

<body>
  <a class="skip" href="#main">Saltar al contenido</a>

  <div class="app">
    <!-- Navegación principal: enlaces (navegan entre vistas) -->
    <aside class="side">
      <div class="brand"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></i> Cuida</div>
      <nav class="nav" id="nav" aria-label="Secciones"></nav>

        <div class="who" id="topPatient"></div>

          <div class="clock">Hoy <strong id="clock">--:--</strong></div>

      </header>
      <!-- El contenido se re-renderiza; aria-live anuncia el cambio de sección -->
      <main class="content" id="main" tabindex="-1"></main>

  </div>

  <!-- Región para anuncios a lectores de pantalla (cambios de vista/acciones) -->
  <div id="live" aria-live="polite" class="sr-only"></div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <!-- Host de diálogos modales accesibles -->
  <div class="modal-backdrop" id="modalHost" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" id="dialog"></div>
  </div>
  <input hidden type="file" id="importFile" accept="application/json,.json">

  <!-- ============================================================
       Pantalla de bloqueo. Se muestra si hay PIN configurado:
       al abrir la app, tras inactividad o al pulsar "Bloquear".
       El PIN nunca se guarda en claro (PBKDF2-SHA256 + sal).
       ============================================================ -->
  <div class="lock" id="lock" hidden role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="lock-box">
      <div class="lock-logo" aria-hidden="true">✚</div>
      <h1 id="lockTitle">Aplicación bloqueada</h1>
      <p class="muted" id="lockWho">Introduce el PIN para ver la información.</p>
      <form id="lockForm" novalidate>
        <label class="sr-only" for="lockPin">PIN de acceso</label>
        <input class="input pin" id="lockPin" type="password" inputmode="numeric"
               autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="12" placeholder="••••">
        <p class="err" id="lockErr" role="alert" aria-live="assertive"></p>
        <div class="lock-foot">
          <button class="btn" type="submit" id="lockBtn">Desbloquear</button>
          <button class="btn secondary" type="button" data-forgot>He olvidado el PIN</button>
        </div>
      </form>
    </div>
  </div>

<script>
'use strict';
/* ============================================================
   CUIDA · Lógica de la aplicación
   Arquitectura por responsabilidades:
     - StorageManager : persistencia local + respaldo automático
     - Modelos        : Patient, Medication, Caregiver
     - Utilidades     : MedicationSchedule, Inventory
     - Managers       : Symptom, History, Notification, Image
     - UI helpers     : escapeHtml, toast, Modal (diálogo accesible),
                        confirmDialog, promptDialog
     - App            : controlador principal (render + acciones)
   ============================================================ */

/* --- Utilidad de seguridad: escapa texto para insertar en HTML --- */
function escapeHtml(v){
  return String(v ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

/* ------------------------------------------------------------
   Set de iconos (una sola familia visual: trazo 1.9, esquinas
   redondeadas, viewBox 24). Reutilizable en panel, calendario y
   avisos para que TODO el producto hable el mismo lenguaje gráfico.
   ------------------------------------------------------------ */
const ICONS = {
  clock:    '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.6V12l3 1.8"/>',
  check:    '<path d="M4.5 12.5 10 18 20 6"/>',
  alert:    '<path d="M12 4 21 19H3L12 4Z"/><path d="M12 10v4"/><path d="M12 16.6h.01"/>',
  pill:     '<path d="M10.5 3.5 3.5 10.5a5 5 0 0 0 7 7l7-7a5 5 0 0 0-7-7Z"/><path d="M7 7l7 7"/>',
  heart:    '<path d="M12 20.5S3.5 15.5 3.5 9.3A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 8.5 2.3C20.5 15.5 12 20.5 12 20.5Z"/>',
  rescue:   '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M5.6 5.6 9.7 9.7M14.3 14.3 18.4 18.4M18.4 5.6 14.3 9.7M9.7 14.3 5.6 18.4"/>',
  send:     '<path d="M21 3 10.5 13.5"/><path d="M21 3 14 21l-3.4-7.6L3 10 21 3Z"/>',
  box:      '<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5v-9Z"/><path d="M3.5 7.5 12 12l8.5-4.5"/><path d="M12 12v9"/>',
  gear:     '<circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9 2 2 0 1 1-2.8 2.8 1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2 2 2 0 1 1-2.8-2.8 1.7 1.7 0 0 0-1.2-2.9 2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9A2 2 0 1 1 7.3 3.9 1.7 1.7 0 0 0 10.2 2.7a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2 2 2 0 1 1 2.8 2.8 1.7 1.7 0 0 0 1.2 2.9 2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.7 1.7Z"/>',
  user:     '<circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.6"/><path d="M3.5 9.6h17M8 3v4M16 3v4"/>',
  left:     '<path d="M14.5 5 8 12l6.5 7"/>',
  right:    '<path d="M9.5 5 16 12l-6.5 7"/>',
};
function svgIcon(name, size = 20){
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}

/* ------------------------------------------------------------
   Fechas en horario LOCAL (YYYY-MM-DD)
   No se usa toISOString(): en Colombia (UTC−5) devolvería el día
   siguiente a partir de las 7 de la tarde, y la agenda saltaría
   de día antes de tiempo.
   ------------------------------------------------------------ */
function isoDate(d = new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseISO(s){
  const [y, m, d] = String(s || '').split('-').map(Number);
  return new Date(y || 1970, (m || 1) - 1, d || 1);
}
function daysBetween(desde, hasta){
  return Math.round((parseISO(hasta) - parseISO(desde)) / 864e5);
}
function addDays(iso, n){
  const d = parseISO(iso);
  return isoDate(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n));
}
function prettyDate(iso){
  return parseISO(iso).toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'});
}

/* ============================================================
   SEGURIDAD · Base criptográfica (Web Crypto del navegador)
   Web Crypto solo existe en contexto seguro: https:// o localhost.
   Abriendo el archivo con doble clic (file://) NO está disponible;
   la app sigue funcionando pero se desactivan el PIN y el respaldo
   cifrado, y se avisa al usuario en Ajustes.
   ============================================================ */
const SECURE = !!(window.isSecureContext && window.crypto && window.crypto.subtle);

/* Identificador único (crypto.randomUUID tampoco existe en file://) */
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(b);
  else for(let i=0;i<16;i++) b[i] = Math.floor(Math.random()*256);
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

/* Base64 por bloques: evita desbordar la pila con respaldos grandes */
const B64 = {
  from(buf){
    const b = new Uint8Array(buf); let s = '';
    for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000));
    return btoa(s);
  },
  to(str){ return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }
};

/* ------------------------------------------------------------
   Vault · Cifrado del archivo de respaldo
   AES-GCM 256 (confidencialidad + autenticidad) con clave derivada
   de la contraseña mediante PBKDF2-SHA256 y sal aleatoria.
   Sal e IV se generan nuevos en cada exportación.
   ------------------------------------------------------------ */
class Vault{
  /* 600 000 iteraciones: recomendación OWASP vigente para PBKDF2-SHA256.
     Importa especialmente aquí, porque el perfil cifrado se publica en un
     repositorio público y cualquiera puede intentar romperlo sin conexión. */
  static ITERATIONS = 600000;

  static async derive(pass, salt, iterations, usages){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, usages);
  }
  /* Deriva la clave a partir de la contraseña y la sal de un sobre ya
     existente. Se hace UNA vez por sesión: repetir 600 000 iteraciones
     en cada guardado dejaría la aplicación inutilizable en el móvil. */
  static keyFor(sobre, pass, usos = ['encrypt','decrypt']){
    return this.derive(pass, B64.to(sobre.salt), sobre.iterations || this.ITERATIONS, usos);
  }

  /* Cierra el sobre con una clave ya derivada (solo AES: instantáneo) */
  static async sealWith(key, obj, salt, iterations){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key,
                 new TextEncoder().encode(JSON.stringify(obj)));
    return {
      format:'cuida-backup', version:2, app:'Cuida',
      cipher:'AES-GCM-256', kdf:'PBKDF2-SHA256', iterations,
      salt:B64.from(salt), iv:B64.from(iv), data:B64.from(ct),
      createdAt:new Date().toISOString()
    };
  }
  static async openWith(key, sobre){
    const out = await crypto.subtle.decrypt({name:'AES-GCM', iv:B64.to(sobre.iv)}, key, B64.to(sobre.data));
    return JSON.parse(new TextDecoder().decode(out));
  }

  static async encrypt(obj, pass){
    if(!SECURE) throw new Error('Cifrado no disponible en este contexto.');
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key  = await this.derive(pass, salt, this.ITERATIONS, ['encrypt']);
    return this.sealWith(key, obj, salt, this.ITERATIONS);
  }
  static async decrypt(file, pass){
    return this.openWith(await this.keyFor(file, pass, ['decrypt']), file);
  }
  static isEncrypted(o){ return !!(o && o.format === 'cuida-backup' && o.data && o.salt && o.iv); }
}

/* ------------------------------------------------------------
   Profile · Perfil cifrado publicado en el repositorio
   Los datos viajan como «perfil.json»: el mismo sobre AES-GCM que
   el respaldo. El navegador lo descarga del propio sitio y lo
   descifra con la clave de acceso. Consecuencias, sin rodeos:
     · Sin la clave no se muestra absolutamente nada, en cualquier
       navegador y dispositivo: el descifrado ES la puerta.
     · El archivo es público, así que alguien puede descargarlo e
       intentar romperlo sin conexión. La clave debe ser larga.
     · No hay servidor: publicar cambios significa reemplazar el
       archivo en el repositorio y subirlo.
   ------------------------------------------------------------ */
class Profile{
  static FILE  = 'perfil.json';
  static CACHE = 'cuida-cache-cifrada';

  /* Perfil publicado en el sitio; null si aún no se ha publicado ninguno */
  static async published(){
    if(typeof fetch !== 'function') return null;
    try{
      const r = await fetch(this.FILE + '?v=' + Date.now(), {cache:'no-store'});
      if(!r.ok) return null;
      const j = await r.json();
      return Vault.isEncrypted(j) ? j : null;
    }catch{ return null; }   // sin perfil, sin red o abierto como archivo local
  }

  /* Copia local, también cifrada: permite recargar sin perder cambios */
  static cache(){
    try{
      const j = JSON.parse(localStorage.getItem(this.CACHE));
      return Vault.isEncrypted(j) ? j : null;
    }catch{ return null; }
  }
  static saveCache(sobre){
    try{ localStorage.setItem(this.CACHE, JSON.stringify(sobre)); return true; }
    catch{ return false; }
  }
  static clearCache(){ localStorage.removeItem(this.CACHE); }
  static when(o){ return o && o.createdAt ? new Date(o.createdAt).getTime() : 0; }
}

/* ------------------------------------------------------------
   PinLock · Bloqueo de pantalla
   La configuración del PIN vive DENTRO del perfil central (state.pin),
   nunca por dispositivo: así es el mismo en todas las cuentas.
   El PIN en sí no se guarda, solo su derivación PBKDF2 con sal.
   Los intentos fallidos son efímeros (solo memoria, no se persisten).
   Comparación en tiempo constante y retardo progresivo por fallos.
   Nota: protege el acceso visual, no cifra los datos guardados.
   ------------------------------------------------------------ */
class PinLock{
  constructor(app){ this.app = app; this._fails = 0; this._last = 0; }
  /* La configuración se lee del perfil descifrado en memoria */
  config(){ return (this.app.state && this.app.state.pin) || null; }
  enabled(){ return !!this.config(); }

  async digest(pin, salt, iterations){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations, hash:'SHA-256'}, base, 256);
    return B64.from(bits);
  }
  async set(pin){
    if(!this.app.state) return;
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iterations = Vault.ITERATIONS;
    this.app.state.pin = {
      salt:B64.from(salt), iterations,
      hash: await this.digest(pin, salt, iterations),
      createdAt: new Date().toISOString()
    };
    this.resetFails();
    this.app.save();   // el PIN pasa a formar parte del perfil central
  }
  clear(){
    if(this.app.state) delete this.app.state.pin;
    this.resetFails();
    this.app.save();
  }
  async verify(pin){
    const c = this.config(); if(!c) return true;
    return this.equalTime(await this.digest(pin, B64.to(c.salt), c.iterations), c.hash);
  }
  /* Comparación sin fugas de tiempo */
  equalTime(a, b){
    if(a.length !== b.length) return false;
    let d = 0; for(let i=0;i<a.length;i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return d === 0;
  }
  fails(){ return this._fails; }
  addFail(){ this._last = Date.now(); return ++this._fails; }
  resetFails(){ this._fails = 0; this._last = 0; }
  /* Espera obligatoria tras 3 fallos: 5 s, 15 s, 45 s… hasta 5 min */
  waitMs(){
    const n = this._fails; if(n < 3) return 0;
    const espera = Math.min(5000 * Math.pow(3, n - 3), 300000);
    return Math.max(0, espera - (Date.now() - this._last));
  }
}

/* ------------------------------------------------------------
   Phone · Celulares y avisos por WhatsApp
   Se usa el enlace oficial «clic para chatear» (wa.me): no hay
   API, ni token, ni credenciales, ni servidor intermediario.
   El enlace abre WhatsApp con el mensaje ya escrito y es la
   persona quien pulsa enviar, así que nada sale del dispositivo
   sin una acción explícita.
   ------------------------------------------------------------ */
class Phone{
  static PAIS = '57';                                  // Colombia por defecto
  static digits(v){ return String(v ?? '').replace(/\D/g, ''); }

  /* Formato internacional sin signos, como exige wa.me (E.164 sin «+») */
  static intl(v){
    let d = this.digits(v);
    if(!d) return '';
    if(d.startsWith('00')) d = d.slice(2);             // 0057 300…
    if(d.length === 10 && d.startsWith('3')) d = this.PAIS + d;  // celular colombiano
    return d;
  }
  static valid(v){ const d = this.intl(v); return d.length >= 8 && d.length <= 15; }
  static pretty(v){ const d = this.intl(v); return d ? '+' + d : ''; }

  /* Enlace de WhatsApp con el mensaje precargado */
  static waLink(numero, texto){
    return 'https://wa.me/' + this.intl(numero) + '?text=' + encodeURIComponent(texto || '');
  }
}

/* ------------------------------------------------------------
   StorageManager · Persistencia local y respaldo automático
   Tres niveles, todos dentro del navegador (sin servidor):
     1. Estado actual.
     2. Copia completa del estado inmediatamente anterior.
   3. Hasta 5 copias diarias para poder recuperar el historial si se agota la cuota.
   ------------------------------------------------------------ */
class StorageManager{
  constructor(){
    this.key  = 'cuida-datos-v1';
    this.keyAntigua = 'cuida-paliativos-v1';   // nombre anterior, se migra al vuelo
    this.prev = 'cuida-copia-previa';
    this.snapKey = 'cuida-copias';
    this.maxSnaps = 5;
  }
  load(){
    try{
      const actual = localStorage.getItem(this.key);
      if(actual) return JSON.parse(actual);
      // Datos guardados con el nombre anterior: se recuperan y se reubican
      const viejo = localStorage.getItem(this.keyAntigua);
      if(!viejo) return null;
      localStorage.setItem(this.key, viejo);
      localStorage.removeItem(this.keyAntigua);
      return JSON.parse(viejo);
    }catch{ return null; }
  }
  previous(){ try{ return JSON.parse(localStorage.getItem(this.prev)); }catch{ return null; } }
  snapshots(){ try{ return JSON.parse(localStorage.getItem(this.snapKey)) || []; }catch{ return []; } }
  /* Borra todo rastro legible: se usa al pasar al perfil cifrado */
  wipePlain(){ [this.key, this.prev, this.snapKey].forEach(k => localStorage.removeItem(k)); }

  save(data){
    let json;
    try{ json = JSON.stringify(data); }catch{ return {ok:false, error:'serializar'}; }
    const anterior = localStorage.getItem(this.key);
    try{
      if(anterior) localStorage.setItem(this.prev, anterior);
      localStorage.setItem(this.key, json);
      this.snapshot(data);
      return {ok:true, bytes:json.length};
    }catch{
      // Cuota agotada: libera las copias y conserva lo esencial
      try{
        localStorage.removeItem(this.snapKey);
        localStorage.removeItem(this.prev);
        localStorage.setItem(this.key, json);
        return {ok:true, bytes:json.length, warning:'copias-liberadas'};
      }catch{
        return {ok:false, error:'cuota'};
      }
    }
  }
  /* Copia diaria: se renueva como mucho una vez por hora */
  snapshot(data){
    const hoy = isoDate();
    const list = this.snapshots();
    const i = list.findIndex(s => s.day === hoy);
    if(i === 0 && Date.now() - new Date(list[0].at).getTime() < 3600000) return;
    if(i >= 0) list.splice(i, 1);
    list.unshift({ day:hoy, at:new Date().toISOString(), data:JSON.stringify(data) });
    localStorage.setItem(this.snapKey, JSON.stringify(list.slice(0, this.maxSnaps)));
  }
  /* Espacio ocupado por la app en este navegador (aprox.) */
  usedBytes(){
    let n = 0;
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('cuida')) n += k.length + (localStorage.getItem(k) || '').length;
    }
    return n * 2; // UTF-16
  }
}

/* Un único paciente: es el centro de toda la aplicación.
   Sin datos inventados: se rellena en Ajustes al empezar. */
class Patient{

class Medication{

    presentation:'Comprimido', route:'Oral', times:[], indication:'', notes:'',
    color:'#007fa8', active:true, stock:0, minStock:5, expiry:'', lab:'', nationalCode:'',
    /* --- Pauta: no todos los tratamientos son diarios, ni programados --- */
    pattern:'diaria',   // 'diaria' | 'cada' | 'semana' | 'demanda' (sin horario)
    everyDays:2,        // intervalo para la pauta 'cada'
    weekdays:[],        // 0 = domingo … 6 = sábado, para la pauta 'semana'
    startDate:'',       // ancla del ciclo: desde aquí se cuentan los intervalos

  }, o);
    if(!Array.isArray(this.times)) this.times = [];

/* --- Utilidades de negocio --- */
/* ------------------------------------------------------------
   MedicationSchedule · Qué toca y qué día
   Resuelve las tres pautas habituales en domicilio:
     · diaria  → todos los días
     · cada N  → «cada tres días», contando desde la fecha de inicio
     · semana  → días fijos (lunes, miércoles y viernes)
   Con inicio de pauta y fin de tratamiento opcionales.
   ------------------------------------------------------------ */
class MedicationSchedule{
  static DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  /* ¿Le corresponde a este medicamento en esta fecha? */
  static appliesOn(m, fecha = isoDate()){
    if(!m || !m.active) return false;
    if(m.pattern === 'demanda') return false;              // no se programa nunca
    if(m.startDate && fecha < m.startDate) return false;   // aún no empieza
    if(m.endDate   && fecha > m.endDate)   return false;   // ya terminó
    if(m.pattern === 'semana')
      return (m.weekdays || []).includes(parseISO(fecha).getDay());
    if(m.pattern === 'cada'){
      const n = Math.max(1, +m.everyDays || 1);
      const dif = daysBetween(m.startDate || fecha, fecha);
      return dif >= 0 && dif % n === 0;
    }
    return true;   // diaria
  }

  static forDate(meds, fecha = isoDate()){
    return (meds || []).filter(m => this.appliesOn(m, fecha))
      .flatMap(m => m.times.map(time => ({
        id:uuid(), medId:m.id, time, status:'pending', actual:'', responsible:'', note:'' })))
      .sort((a,b) => a.time.localeCompare(b.time));
  }
  static today(meds){ return this.forDate(meds, isoDate()); }

  /* Conserva lo ya registrado al recalcular la agenda tras editar un medicamento */
  static merge(anterior, nueva){
    return nueva.map(n =>
      (anterior || []).find(a => a.medId === n.medId && a.time === n.time) || n);
  }

  /* Próxima fecha en la que toca, buscando hacia delante */
  static nextDate(m, desde = isoDate(), limite = 400){
    for(let i = 0; i <= limite; i++){
      const f = addDays(desde, i);
      if(m.endDate && f > m.endDate) return null;
      if(this.appliesOn(m, f)) return f;
    }
    return null;
  }

  /* Descripción legible de la pauta */
  static describe(m){
    if(m.pattern === 'demanda') return 'Según necesidad · sin horario fijo';
    let t = 'Todos los días';
    if(m.pattern === 'cada'){
      const n = Math.max(1, +m.everyDays || 1);
      t = n === 1 ? 'Todos los días' : n === 2 ? 'Un día sí y otro no' : `Cada ${n} días`;
    }else if(m.pattern === 'semana'){
      const l = [...(m.weekdays || [])].sort((a,b)=>a-b).map(i => this.DIAS[i]);
      t = !l.length ? 'Sin días seleccionados'
        : l.length === 1 ? `Los ${l[0]}s`
        : `Los ${l.slice(0,-1).join(', ')} y ${l.at(-1)}`;
    }
    if(m.endDate) t += ` · hasta el ${m.endDate}`;
    return t;
  }

  /* Dosis medias por día: necesario para saber cuánto dura el inventario */
  static dosesPerDay(m){
    if(m.pattern === 'demanda') return 0;   // consumo imprevisible
    const n = (m.times || []).length;
    if(!n) return 0;
    if(m.pattern === 'cada')  return n / Math.max(1, +m.everyDays || 1);
    if(m.pattern === 'semana') return n * ((m.weekdays || []).length) / 7;
    return n;
  }
  static onDemand(m){ return !!m && m.pattern === 'demanda'; }
}
class Inventory{
  /* Días de tratamiento que cubre el stock, según la pauta real.
     Devuelve null cuando no hay consumo previsible (según necesidad
     o sin horarios): inventarse una cifra sería engañoso. */
  static days(m){
    const porDia = MedicationSchedule.dosesPerDay(m);
    return porDia ? Math.floor(m.stock / porDia) : null;
  }
  static daysText(m){
    const d = this.days(m);
    return d === null ? 'sin consumo previsible' : `${d} días`;
  }
  static level(m){ return m.stock<=m.minStock ? 'low' : 'ok'; }
}

/* ============================================================
   UI: Toasts (avisos no bloqueantes con aria-live)
   ============================================================ */
function toast(message, type='info', ms=4000){
  const host = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='good' ? ' good' : type==='bad' ? ' bad' : '');
  el.setAttribute('role', type==='bad' ? 'alert' : 'status');
